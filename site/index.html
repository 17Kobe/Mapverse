<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <meta name="theme-color" content="#1a2b47" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>股市村</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="alternate icon" href="favicon.svg" />
        <!-- 嵌入模式（網址加 ?embed=1，例如 iKDx 的「探索」分頁）：只留股市地圖，隱藏概況卡與圖層列。在載入 CSS 前加上 class 避免閃一下 -->
        <script>
            if (/[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add('embed');
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css?v=20251111a" />
    </head>
    <body>
        <!-- 左側直式圖層列（手機版變成底部導覽列），內容由 app.js 的 LAYERS 產生 -->
        <nav id="rail" aria-label="地圖圖層" data-i18n-aria="地圖圖層">
            <div class="brand" aria-hidden="true">🌏</div>
            <div id="layers"></div>
            <button id="btnSet" class="rl" aria-label="設定" data-i18n-aria="設定">
                <span class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 5 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 5 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 5a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 5a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/></svg></span><span class="rt" data-i18n="設定">設定</span>
            </button>
        </nav>

        <main id="stage">
            <canvas id="terrain" aria-hidden="true"></canvas>
            <canvas id="aurora" aria-hidden="true"></canvas>
            <!-- 一般裝飾雲：在國界/旗幟/卡片下面，不擋內容 -->
            <canvas id="clouds" aria-hidden="true"></canvas>
            <svg id="map" role="img" aria-label="世界股市地圖" data-i18n-aria="世界股市地圖"></svg>
            <!-- 煙火 / 烏雲等漲跌特效：在卡片上面也沒關係，烏雲有形成→消散的呼吸週期，不會一直擋住卡片 -->
            <canvas id="wfx" aria-hidden="true"></canvas>
            <!-- 上帝視角的災難效果（disasters.js），疊在地圖上面、不擋滑鼠 -->
            <canvas id="fx" aria-hidden="true"></canvas>
            <div id="attrib">地形資料 © Mapzen/AWS Terrain Tiles · Esri, Maxar, Earthstar Geographics</div>

            <!-- 骰子（原「上帝之手」的位置）：真正的 CSS 3D 立方體，點擊會翻滾並轉到對應點數那一面朝前。
                 每面是 fw（只負責旋轉）包 fback（幾乎不圓角的背板，墊住 df 圓角四角缺口）+ df（真正可見的圓角面）。
                 圓角一定要做在「每個面自己身上」才行：翻滾時鏡頭看到的是立方體的透視輪廓（菱形/斜面），
                 不是正面那個 68x68 的方框，所以靠外層固定視窗裁切在旋轉中完全對不上，只有停止、正面朝鏡頭時才碰巧吻合 -->
            <button id="diceBtn" aria-label="擲骰子" title="擲骰子">
                <div id="diceScene">
                    <div id="diceCube">
                        <div class="fw f1"><div class="fback"></div><div class="df"><span class="pip p-c"></span></div></div>
                        <div class="fw f2"><div class="fback"></div><div class="df"><span class="pip p-tl"></span><span class="pip p-br"></span></div></div>
                        <div class="fw f3"><div class="fback"></div><div class="df"><span class="pip p-tl"></span><span class="pip p-c"></span><span class="pip p-br"></span></div></div>
                        <div class="fw f4"><div class="fback"></div><div class="df"><span class="pip p-tl"></span><span class="pip p-tr"></span><span class="pip p-bl"></span><span class="pip p-br"></span></div></div>
                        <div class="fw f5"><div class="fback"></div><div class="df"><span class="pip p-tl"></span><span class="pip p-tr"></span><span class="pip p-c"></span><span class="pip p-bl"></span><span class="pip p-br"></span></div></div>
                        <div class="fw f6"><div class="fback"></div><div class="df"><span class="pip p-tl"></span><span class="pip p-ml"></span><span class="pip p-bl"></span><span class="pip p-tr"></span><span class="pip p-mr"></span><span class="pip p-br"></span></div></div>
                    </div>
                </div>
            </button>

            <!-- 浮在地圖上的介面（仿 Google 地圖的位置） -->
            <div id="side">
                <section id="hud" class="gpanel" aria-label="全球概況" data-i18n-aria="全球概況">
                    <div class="logo">🌏 <b data-i18n="股市村">股市村</b></div>
                    <div class="hp" title="CNN 貪婪與恐慌指數" data-i18n-title="CNN 貪婪與恐慌指數">
                        <span id="hpIcon" class="hpl fngi">😐</span>
                        <div class="bar fng"><i id="hpFill"></i><b id="hpKnob"></b></div>
                        <span id="hpText" class="hpt">--</span>
                    </div>
                    <div id="statusLine" class="sub" data-i18n="正在連線世界…">正在連線世界…</div>
                </section>
            </div>
            <nav id="chips" aria-label="篩選" data-i18n-aria="篩選"></nav>
            <div id="toast" role="status" aria-live="polite"></div>
            <div id="ctip" role="tooltip"></div>

            <div id="loading" role="status" aria-label="載入中" data-i18n-aria="載入中">
                <canvas class="globe" aria-hidden="true"></canvas>
            </div>
        </main>

        <div id="sheet" hidden></div>

        <script src="i18n.js"></script>
        <script src="globe.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
        <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
        <script src="terrain.js"></script>
        <script src="disasters.js"></script>
        <script src="geoscenes.js"></script>
        <script src="corp-logos.js"></script>
        <script src="corps.js"></script>
        <script src="natives.js"></script>
        <script src="tips.js?v=20251111f"></script>
        <script src="app.js?v=20251111q"></script>
    </body>
</html>
