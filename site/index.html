<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2b47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>股市村</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.svg">
<!-- 嵌入模式（網址加 ?embed=1，例如 iKDx 的「探索」分頁）：只留股市地圖，隱藏概況卡與圖層列。在載入 CSS 前加上 class 避免閃一下 -->
<script>if (/[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add('embed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 左側直式圖層列（手機版變成底部導覽列），內容由 app.js 的 LAYERS 產生 -->
<nav id="rail" aria-label="地圖圖層" data-i18n-aria="地圖圖層">
  <div class="brand" aria-hidden="true">🌏</div>
  <div id="layers"></div>
  <button id="btnSet" class="rl" aria-label="設定" data-i18n-aria="設定"><span class="ri">⚙️</span><span class="rt" data-i18n="設定">設定</span></button>
</nav>

<main id="stage">
  <canvas id="terrain" aria-hidden="true"></canvas>
  <canvas id="clouds" aria-hidden="true"></canvas>
  <svg id="map" role="img" aria-label="世界股市地圖" data-i18n-aria="世界股市地圖"></svg>
  <!-- 上帝視角的災難效果（disasters.js），疊在地圖上面、不擋滑鼠 -->
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="attrib">地形資料 © Mapzen/AWS Terrain Tiles · Esri, Maxar, Earthstar Geographics</div>

  <!-- 浮在地圖上的介面（仿 Google 地圖的位置） -->
  <div id="side">
    <section id="hud" class="gpanel" aria-label="全球概況" data-i18n-aria="全球概況">
      <div class="logo">🌏 <b data-i18n="股市村">股市村</b></div>
      <div class="hp" title="CNN 貪婪與恐慌指數" data-i18n-title="CNN 貪婪與恐慌指數">
        <span id="hpIcon" class="hpl fngi">😐</span>
        <div class="bar fng"><i id="hpFill"></i><b id="hpKnob"></b></div>
        <span id="hpText" class="hpt">--</span>
      </div>
      <div id="statusLine" class="sub" data-i18n="正在連線世界…">正在連線世界…</div>
    </section>
  </div>
  <nav id="chips" aria-label="篩選" data-i18n-aria="篩選"></nav>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="loading" role="status" aria-label="載入中" data-i18n-aria="載入中"><canvas class="globe" aria-hidden="true"></canvas></div>
</main>

<div id="sheet" hidden></div>

<script src="i18n.js"></script>
<script src="globe.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="terrain.js"></script>
<script src="disasters.js"></script>
<script src="geoscenes.js"></script>
<script src="corp-logos.js"></script>
<script src="corps.js"></script>
<script src="natives.js"></script>
<script src="app.js?v=20251107e"></script>
</body>
</html>
