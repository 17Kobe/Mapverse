<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4fb8e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>股市大冒險 · 世界指數地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hud">
  <div class="row1">
    <div class="logo">🌏 <b>股市大冒險</b></div>
    <div class="hp" title="全球情緒">
      <span class="hpl">❤️</span>
      <div class="bar"><i id="hpFill"></i></div>
      <span id="hpText" class="hpt">--</span>
    </div>
    <button id="btnSet" class="icon" aria-label="設定">⚙️</button>
  </div>
  <nav id="chips" aria-label="區域篩選"></nav>
  <div id="statusLine" class="sub">正在連線世界…</div>
</header>

<main id="stage">
  <svg id="map" role="img" aria-label="世界股市地圖"></svg>
  <div class="cloud" style="top:12%;animation-duration:90s;animation-delay:-20s">☁️</div>
  <div class="cloud" style="top:48%;animation-duration:120s;animation-delay:-70s;font-size:34px">☁️</div>
  <div class="cloud" style="top:76%;animation-duration:100s;animation-delay:-40s;font-size:54px">☁️</div>
  <div id="loading"><div class="spin">🌏</div><p>正在召喚世界地圖…</p></div>
</main>

<section id="dock">
  <div id="dockTitle" class="dock-title">🎒 道具欄</div>
  <div id="items"></div>
</section>

<div id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="app.js"></script>
</body>
</html>
