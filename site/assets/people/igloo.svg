      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e3f0fa"/><stop offset="1" stop-color="#a9c8e2"/>
    </radialGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3550"/><stop offset="1" stop-color="#3d6488"/>
