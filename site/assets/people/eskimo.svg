<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 因紐特（愛斯基摩）小人：毛皮連帽大衣，手上提著一條魚。仿 Fluent 3D 的柔和漸層 -->
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98b58"/><stop offset="1" stop-color="#7a4527"/>
    </linearGradient>
    <radialGradient id="hood" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#d49a67"/><stop offset="1" stop-color="#7d4828"/>
    </radialGradient>
    <radialGradient id="fur" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d2c4"/>
    </radialGradient>
    <radialGradient id="skin" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#f6c79c"/><stop offset="1" stop-color="#d9935f"/>
    </radialGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3b20"/><stop offset="1" stop-color="#3b1f10"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#3b8fd6"/>
    </linearGradient>
  </defs>
  <!-- 靴子 -->
  <rect x="44" y="108" width="17" height="17" rx="7" fill="url(#boot)"/>
  <rect x="67" y="108" width="17" height="17" rx="7" fill="url(#boot)"/>
  <!-- 大衣 -->
  <path d="M46 64 Q64 56 82 64 L94 108 Q64 118 34 108 Z" fill="url(#coat)"/>
  <!-- 衣襬花紋帶 + 白色毛邊 -->
  <path d="M38 98 Q64 106 90 98 L92 104 Q64 112 36 104 Z" fill="#2e9c9a"/>
  <path d="M40 100 l4 3 4 -3 4 3 4 -3 4 3 4 -3 4 3 4 -3 4 3 4 -3 4 3 4 -3 4 3" fill="none" stroke="#f2c14e" stroke-width="1.6"/>
  <path d="M34 106 Q64 116 94 106 Q96 114 90 115 Q64 122 38 115 Q32 114 34 106 Z" fill="url(#fur)"/>
  <!-- 手臂 + 紅色手套 -->
  <path d="M47 68 Q34 78 33 94" stroke="#8a5130" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M81 68 Q94 78 95 92" stroke="#8a5130" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="33" cy="96" r="7" fill="#d8443a"/>
  <!-- 手上的魚 -->
  <g transform="translate(96 96) rotate(80)">
    <path d="M0 0 Q10 -7 20 0 Q10 7 0 0 Z" fill="url(#fish)"/>
    <path d="M19 0 L26 -5 L26 5 Z" fill="#3b8fd6"/>
    <circle cx="5" cy="-1" r="1.3" fill="#123"/>
  </g>
  <circle cx="95" cy="94" r="7" fill="#d8443a"/>
  <!-- 帽兜 + 毛圈 + 臉 -->
  <circle cx="64" cy="44" r="30" fill="url(#hood)"/>
  <circle cx="64" cy="46" r="24" fill="url(#fur)"/>
  <g fill="#fff" opacity=".9">
    <circle cx="42" cy="40" r="5"/><circle cx="45" cy="30" r="5"/><circle cx="53" cy="23" r="5"/><circle cx="64" cy="21" r="5"/>
    <circle cx="75" cy="23" r="5"/><circle cx="83" cy="30" r="5"/><circle cx="86" cy="40" r="5"/><circle cx="86" cy="51" r="5"/>
    <circle cx="82" cy="61" r="5"/><circle cx="74" cy="67" r="5"/><circle cx="64" cy="69" r="5"/><circle cx="54" cy="67" r="5"/>
    <circle cx="46" cy="61" r="5"/><circle cx="42" cy="51" r="5"/>
  </g>
  <circle cx="64" cy="47" r="17" fill="url(#skin)"/>
  <!-- 瞇瞇眼、腮紅、微笑 -->
  <path d="M55 45 q3 -3 6 0 M67 45 q3 -3 6 0" stroke="#3a2416" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <ellipse cx="53.5" cy="52" rx="4" ry="2.6" fill="#ef7f7f" opacity=".7"/>
  <ellipse cx="74.5" cy="52" rx="4" ry="2.6" fill="#ef7f7f" opacity=".7"/>
  <path d="M59 55 q5 4 10 0" stroke="#3a2416" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 高光 -->
  <ellipse cx="50" cy="26" rx="9" ry="5" fill="#fff" opacity=".25" transform="rotate(-30 50 26)"/>
</svg>
