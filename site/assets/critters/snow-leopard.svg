<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4fb"/>
      <stop offset="100%" stop-color="#cfe3ef"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8f9"/>
      <stop offset="45%" stop-color="#e6ebee"/>
      <stop offset="100%" stop-color="#bfccd6"/>
    </linearGradient>
    <linearGradient id="bodyGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dee3"/>
      <stop offset="100%" stop-color="#a7b4c0"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f5f6"/>
      <stop offset="100%" stop-color="#c3cdd6"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a958c"/>
      <stop offset="55%" stop-color="#726c62"/>
      <stop offset="100%" stop-color="#4a453d"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dceaf2"/>
    </linearGradient>
    <radialGradient id="bellyShade" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7c8894" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- distant soft peaks (not a full background rect) -->
  <g opacity="0.4">
    <path d="M-5,32 L14,6 L34,32 Z" fill="url(#skyGrad)"/>
    <path d="M18,34 L44,2 L70,34 Z" fill="url(#skyGrad)"/>
    <path d="M52,35 L74,12 L86,35 Z" fill="url(#skyGrad)"/>
  </g>

  <!-- rocky snow ledge -->
  <path d="M0,80 L0,66 C7,61 15,65 21,62 C28,60 30,70 36,75 C42,78 50,78 56,75 C62,71 65,63 72,65 C76,66 78,62 80,58 L80,80 Z"
        fill="url(#rockGrad)" stroke="#352f28" stroke-width="0.5"/>
  <path d="M0,66 C7,61 15,65 21,62 C28,60 30,70 36,75 C42,78 50,78 56,75 C62,71 65,63 72,65 C76,66 78,62 80,58 L80,61 C78,65 76,69 72,68 C65,66 62,74 56,78 C50,81 42,81 36,78 C30,74 28,64 21,66 C15,69 7,65 0,70 Z"
        fill="url(#snowGrad)" opacity="0.85"/>

  <!-- tail (drawn behind body, animates with a gentle swish) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 60 43;10 60 43;-5 60 43;0 60 43" dur="3.2s" repeatCount="indefinite"/>
    <path d="M58,43 C66,40 72,34 74,23 C76,16 72,11 65,13 C61,14 59,19 58,25 C57,31 55,38 58,43 Z"
          fill="url(#tailGrad)" stroke="#9aa6b1" stroke-width="0.4"/>
    <circle cx="68" cy="17" r="3.4" fill="url(#tailGrad)" stroke="#9aa6b1" stroke-width="0.3"/>
    <circle cx="63" cy="22" r="2.6" fill="url(#tailGrad)" stroke="#9aa6b1" stroke-width="0.3"/>
    <ellipse cx="66" cy="21" rx="1.3" ry="1" fill="#4a4a4f" opacity="0.85"/>
    <ellipse cx="70" cy="26" rx="1.2" ry="0.9" fill="#4a4a4f" opacity="0.8"/>
    <circle cx="61" cy="30" r="1.4" fill="none" stroke="#5c5a54" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- rear legs -->
  <path d="M52,54 C50,60 50,68 51,75 C51,77 55,77 55,75 C56,68 56,60 55,54 Z" fill="url(#bodyGradDark)" stroke="#8f9aa5" stroke-width="0.4"/>
  <ellipse cx="53" cy="76" rx="3" ry="1.8" fill="#aab6c0"/>
  <path d="M57,52 C55,58 55,68 56,75 C56,77 60,77 60,75 C61,68 61,58 59,52 Z" fill="url(#bodyGrad)" stroke="#8f9aa5" stroke-width="0.4"/>
  <ellipse cx="58" cy="76" rx="3" ry="1.8" fill="#c7d0d8"/>

  <!-- torso -->
  <path d="M30,46 C34,33 44,25 55,27 C63,29 67,36 65,44 C63,51 56,55 48,57 C40,59 32,54 30,46 Z"
        fill="url(#bodyGrad)" stroke="#8f9aa5" stroke-width="0.5"/>
  <path d="M30,46 C32,52 38,57 48,57 C53,56 58,54 61,50 C58,56 51,60 44,59 C36,58 31,53 30,46 Z" fill="url(#bellyShade)"/>

  <!-- front legs -->
  <path d="M33,50 C31,56 31,66 32,74 C32,76 36,77 37,74 C38,66 38,56 37,50 Z" fill="url(#bodyGradDark)" stroke="#8f9aa5" stroke-width="0.4"/>
  <ellipse cx="34" cy="76" rx="3" ry="1.8" fill="#aab6c0"/>
  <path d="M37,52 C36,58 36,68 37,75 C37,77 41,77 41,75 C42,68 42,58 41,52 Z" fill="url(#bodyGrad)" stroke="#8f9aa5" stroke-width="0.4"/>
  <ellipse cx="39" cy="76" rx="3" ry="1.8" fill="#c7d0d8"/>

  <!-- head -->
  <path d="M8,42 C8,35 12,29 20,28 C27,27 32,31 33,38 C34,44 30,49 23,50 C16,51 8,49 8,42 Z"
        fill="url(#bodyGrad)" stroke="#8f9aa5" stroke-width="0.5"/>
  <!-- ears -->
  <path d="M14,29 L16,20 L21,28 Z" fill="url(#bodyGrad)" stroke="#8f9aa5" stroke-width="0.4"/>
  <path d="M15.5,27 L16.5,22 L19,27 Z" fill="#cbd3da"/>
  <path d="M21,28 L25,19 L29,27 Z" fill="url(#bodyGrad)" stroke="#8f9aa5" stroke-width="0.4"/>
  <path d="M22.5,26.5 L25.5,21 L27.5,26.5 Z" fill="#cbd3da"/>
  <!-- face shading / muzzle -->
  <path d="M9,45 C9,49 13,51 18,50.5 C15,48 12,46 9,45 Z" fill="#ffffff" opacity="0.55"/>
  <!-- eye -->
  <ellipse cx="19.5" cy="38" rx="1.7" ry="1.4" fill="#2b2b2e"/>
  <circle cx="19" cy="37.4" r="0.5" fill="#ffffff" opacity="0.85"/>
  <!-- nose -->
  <path d="M8,40 C7,41 7,43 9,43.5 C10.5,43.5 11,41.5 10,40.5 C9.5,40 8.5,39.7 8,40 Z" fill="#3a3a3d"/>

  <!-- rosette / spot pattern -->
  <circle cx="17" cy="33" r="1.3" fill="#4a4a4f" opacity="0.85"/>
  <circle cx="24.5" cy="32" r="1.1" fill="#4a4a4f" opacity="0.85"/>
  <circle cx="31.5" cy="41" r="1.4" fill="#4a4a4f" opacity="0.85"/>
  <circle cx="41" cy="34" r="2.3" fill="none" stroke="#54545a" stroke-width="1" opacity="0.8"/>
  <circle cx="51" cy="33" r="2" fill="none" stroke="#54545a" stroke-width="1" opacity="0.8"/>
  <circle cx="44" cy="48" r="1.7" fill="none" stroke="#54545a" stroke-width="0.9" opacity="0.8"/>
  <ellipse cx="35" cy="58" rx="1.4" ry="1.1" fill="#4a4a4f" opacity="0.8"/>
  <ellipse cx="55" cy="59" rx="1.3" ry="1.1" fill="#4a4a4f" opacity="0.8"/>
  <ellipse cx="60" cy="47" rx="1.5" ry="1.2" fill="#4a4a4f" opacity="0.8"/>

  <!-- light snow flurry -->
  <circle cx="50" cy="8" r="1.1" fill="#ffffff">
    <animate attributeName="cy" values="4;72" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="4" r="0.9" fill="#ffffff">
    <animate attributeName="cy" values="0;60" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="2" r="1" fill="#ffffff">
    <animate attributeName="cy" values="-2;50" dur="6.2s" begin="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6.2s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
