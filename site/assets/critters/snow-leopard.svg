<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="slFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f6f1"/>
      <stop offset="55%" stop-color="#e9e7dd"/>
      <stop offset="100%" stop-color="#d2cfc2"/>
    </linearGradient>
    <linearGradient id="slFurFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d7cc"/>
      <stop offset="100%" stop-color="#bdb9ab"/>
    </linearGradient>
    <radialGradient id="slRosette" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#6e6c62" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#48453d" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="slSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8e4ea"/>
    </linearGradient>
    <linearGradient id="slRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa6ac"/>
      <stop offset="100%" stop-color="#6c7579"/>
    </linearGradient>
  </defs>

  <!-- snowy rocky ledge -->
  <path d="M0,80 L0,67 Q14,61 28,65 Q44,70 58,63 Q70,59 80,64 L80,80 Z" fill="url(#slRock)" stroke="#5a6266" stroke-width="0.4"/>
  <path d="M0,67 Q14,61 28,65 Q44,70 58,63 Q70,59 80,64 L80,69 Q68,65 58,68 Q44,74 28,70 Q14,66 0,71 Z" fill="url(#slSnow)" stroke="#c2d2da" stroke-width="0.3"/>

  <!-- far legs -->
  <path d="M24,56 Q22,63 23,72 Q27,73 29,72 Q29,63 28,55 Z" fill="url(#slFurFar)" stroke="#8b887a" stroke-width="0.4"/>
  <ellipse cx="26" cy="72.5" rx="4" ry="2.6" fill="url(#slFurFar)" stroke="#8b887a" stroke-width="0.4"/>
  <path d="M54,58 Q52,64 53,71 Q57,72.5 59.5,71.5 Q59,64 58,57 Z" fill="url(#slFurFar)" stroke="#8b887a" stroke-width="0.4"/>
  <ellipse cx="56" cy="72" rx="4" ry="2.6" fill="url(#slFurFar)" stroke="#8b887a" stroke-width="0.4"/>

  <!-- tail (fluffy, swishing) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-7 60 44; 9 60 44; -7 60 44" dur="4.2s" repeatCount="indefinite"/>
    <path d="M60,44 C68,40 76,38 77,28 C78,20 73,16 68,17" fill="none" stroke="url(#slFur)" stroke-width="11" stroke-linecap="round"/>
    <path d="M60,44 C68,40 76,38 77,28 C78,20 73,16 68,17" fill="none" stroke="#c9c6ba" stroke-width="11" stroke-linecap="round" opacity="0.35"/>
    <ellipse cx="68" cy="17.5" rx="6.5" ry="6" fill="url(#slFur)" stroke="#aba893" stroke-width="0.4"/>
    <ellipse cx="70" cy="30" rx="4" ry="3.2" fill="url(#slRosette)"/>
    <ellipse cx="74" cy="21" rx="3.4" ry="2.8" fill="url(#slRosette)"/>
    <ellipse cx="63" cy="40" rx="3.6" ry="2.8" fill="url(#slRosette)"/>
    <ellipse cx="65" cy="20" rx="2.6" ry="2.2" fill="#3a3832" opacity="0.5"/>
  </g>

  <!-- near legs -->
  <path d="M20,55 Q18,63 19,73 Q23,74.5 26,73 Q26,63 25,54 Z" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.5"/>
  <ellipse cx="22.5" cy="73.5" rx="4.4" ry="2.8" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.5"/>
  <path d="M50,57 Q48,64 49,72.5 Q53,74.5 56.5,73 Q56,64 55,56 Z" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.5"/>
  <ellipse cx="53" cy="73.5" rx="4.4" ry="2.8" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.5"/>
  <ellipse cx="22" cy="63" rx="3" ry="2.4" fill="url(#slRosette)"/>
  <ellipse cx="52" cy="65" rx="3" ry="2.4" fill="url(#slRosette)"/>

  <!-- long lean torso -->
  <path d="M20,36 C26,28 40,25 50,27 C58,29 64,34 63,40 C66,44 66,50 60,54 C54,58 44,60 36,59 C28,58 21,54 18,48 C16,44 17,40 20,36 Z"
        fill="url(#slFur)" stroke="#8a8778" stroke-width="0.5"/>
  <!-- belly highlight -->
  <path d="M22,50 C26,56 34,58 40,58 C34,55 27,52 22,50 Z" fill="#fbfaf6" opacity="0.6"/>

  <!-- rosette markings on torso -->
  <ellipse cx="28" cy="36" rx="5" ry="3.8" fill="url(#slRosette)"/>
  <ellipse cx="38" cy="31" rx="4.4" ry="3.2" fill="url(#slRosette)"/>
  <ellipse cx="48" cy="34" rx="5" ry="3.6" fill="url(#slRosette)"/>
  <ellipse cx="57" cy="40" rx="4" ry="3" fill="url(#slRosette)"/>
  <ellipse cx="34" cy="46" rx="4.6" ry="3.4" fill="url(#slRosette)"/>
  <ellipse cx="44" cy="50" rx="4.4" ry="3.2" fill="url(#slRosette)"/>
  <ellipse cx="54" cy="48" rx="3.6" ry="2.8" fill="url(#slRosette)"/>
  <ellipse cx="24" cy="43" rx="3.2" ry="2.6" fill="url(#slRosette)"/>

  <!-- neck -->
  <path d="M19,40 C16,36 14,33 15,30 C18,32 21,35 22,40 Z" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.4"/>

  <!-- head -->
  <ellipse cx="12" cy="36" rx="8.5" ry="7.8" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.5"/>
  <!-- ears -->
  <ellipse cx="7" cy="29.5" rx="2.6" ry="2.3" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.4"/>
  <ellipse cx="16" cy="29" rx="2.6" ry="2.3" fill="url(#slFur)" stroke="#8a8778" stroke-width="0.4"/>
  <ellipse cx="7" cy="29.7" rx="1.3" ry="1.1" fill="#d9a9a0" opacity="0.6"/>
  <ellipse cx="16" cy="29.2" rx="1.3" ry="1.1" fill="#d9a9a0" opacity="0.6"/>
  <!-- muzzle -->
  <path d="M4,38 C2,38.5 1,40 2,41.5 C3.5,43 6,43 7.5,41.5 Z" fill="#fbfaf6" stroke="#8a8778" stroke-width="0.3"/>
  <!-- face markings -->
  <ellipse cx="13" cy="33" rx="2.6" ry="2" fill="url(#slRosette)" opacity="0.7"/>
  <ellipse cx="8" cy="39" rx="2.2" ry="1.7" fill="url(#slRosette)" opacity="0.6"/>
  <!-- eye -->
  <ellipse cx="9" cy="35.5" rx="1.5" ry="1.5" fill="#3c3a33"/>
  <ellipse cx="8.6" cy="35.1" rx="0.5" ry="0.5" fill="#f4f2ec"/>
  <!-- nose -->
  <path d="M2.5,39.8 Q2,40.6 2.8,41.2 Q3.6,41.6 4.2,40.8 Q3.6,40 2.5,39.8 Z" fill="#3c3a33"/>

  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.6; 0,0" dur="3.1s" repeatCount="indefinite"/>
</svg>
