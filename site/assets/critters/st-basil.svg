<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="br" x1="0" x2="1"><stop offset="0" stop-color="#d4503f"/><stop offset=".5" stop-color="#b53326"/><stop offset="1" stop-color="#8a2218"/></linearGradient>
    <linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#ffe28a"/><stop offset=".5" stop-color="#f0b73a"/><stop offset="1" stop-color="#b9831c"/></linearGradient>
    <pattern id="p1" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="5" height="5" fill="#d8352b"/><rect width="2.4" height="5" fill="#f6ecd0"/></pattern>
    <pattern id="p2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><rect width="5" height="5" fill="#2f9a5e"/><rect width="2.4" height="5" fill="#f2d24a"/></pattern>
    <pattern id="p3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2f6fd1"/><rect width="3" height="3" fill="#f2d24a"/><rect x="3" y="3" width="3" height="3" fill="#f2d24a"/></pattern>
    <pattern id="p4" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="5" height="5" fill="#f0a22e"/><rect width="2.4" height="5" fill="#d8352b"/></pattern>
    <pattern id="p5" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2f9a5e"/><rect width="3" height="3" fill="#f6ecd0"/><rect x="3" y="3" width="3" height="3" fill="#f6ecd0"/></pattern>
    <path id="on" d="M0 -22 Q10 -11 9 0 Q0 4 -9 0 Q-10 -11 0 -22Z"/>
  </defs>
  <!-- 莫斯科紅場的聖瓦西里主教座堂：中央帳篷頂高塔，周圍九座各色花紋的洋蔥頂 -->
  <!-- 後排小圓頂 -->
  <g>
    <rect x="10" y="70" width="10" height="26" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/><use href="#on" transform="translate(15 70) scale(.8)" fill="url(#p4)"/><path d="M15 52 V57" stroke="#e8b43a" stroke-width="1.4"/>
    <rect x="108" y="70" width="10" height="26" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/><use href="#on" transform="translate(113 70) scale(.8)" fill="url(#p2)"/><path d="M113 52 V57" stroke="#e8b43a" stroke-width="1.4"/>
  </g>
  <!-- 中央帳篷頂高塔 -->
  <rect x="52" y="58" width="24" height="42" fill="url(#br)" stroke="#7a1a12" stroke-width="1"/>
  <path d="M52 64 H76 M52 72 H76" stroke="#f6ecd0" stroke-width="1.6"/>
  <g fill="#2b1810"><rect x="56" y="76" width="4" height="9" rx="2"/><rect x="62" y="76" width="4" height="9" rx="2"/><rect x="68" y="76" width="4" height="9" rx="2"/></g>
  <path d="M50 58 L64 12 L78 58Z" fill="url(#br)" stroke="#7a1a12" stroke-width="1"/>
  <path d="M64 12 L64 58 M64 12 L56 58 M64 12 L72 58 M54 46 H74 M57 34 H71" stroke="#f6ecd0" stroke-width="1.3" opacity=".9"/>
  <rect x="59" y="8" width="10" height="6" fill="#efe3cb" stroke="#cdbf9f" stroke-width=".8"/>
  <use href="#on" transform="translate(64 8) scale(.55)" fill="url(#gd)"/>
  <path d="M64 -4 V0 M62 -2 H66" stroke="#e8b43a" stroke-width="1.4"/>
  <!-- 周圍的七座教堂 -->
  <g>
    <rect x="22" y="72" width="14" height="28" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/><rect x="26" y="80" width="6" height="10" rx="3" fill="#8d2c20"/>
    <use href="#on" transform="translate(29 70) scale(1.05)" fill="url(#p2)"/><path d="M29 46 V52" stroke="#e8b43a" stroke-width="1.4"/>
    <rect x="92" y="72" width="14" height="28" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/><rect x="96" y="80" width="6" height="10" rx="3" fill="#8d2c20"/>
    <use href="#on" transform="translate(99 70) scale(1.05)" fill="url(#p3)"/><path d="M99 46 V52" stroke="#e8b43a" stroke-width="1.4"/>
    <rect x="38" y="82" width="11" height="18" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/>
    <use href="#on" transform="translate(43.5 80) scale(.85)" fill="url(#p1)"/>
    <rect x="79" y="82" width="11" height="18" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/>
    <use href="#on" transform="translate(84.5 80) scale(.85)" fill="url(#p5)"/>
    <rect x="4" y="84" width="9" height="16" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/><use href="#on" transform="translate(8.5 82) scale(.7)" fill="url(#p1)"/>
    <rect x="115" y="84" width="9" height="16" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/><use href="#on" transform="translate(119.5 82) scale(.7)" fill="url(#p4)"/>
  </g>
  <!-- 基座與臺階 -->
  <rect x="2" y="98" width="124" height="14" fill="url(#br)" stroke="#7a1a12" stroke-width="1"/>
  <g stroke="#6f1a10" stroke-width=".9" opacity=".55"><path d="M2 104 H126 M2 109 H126 M14 98 V104 M38 104 V109 M62 98 V104 M86 104 V109 M110 98 V104"/></g>
  <rect x="2" y="97" width="124" height="3" fill="#f2e6c8"/>
  <path d="M30 112 H98 V116 H30Z M22 116 H106 V120 H22Z" fill="#d8c8a0" stroke="#b09c72" stroke-width="1"/>
</svg>
