<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<g>
  <!-- 地面 -->
  <ellipse cx="40" cy="71" rx="35" ry="7" fill="#6b6b6b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 鐵絲網支柱 -->
  <line x1="12" y1="27" x2="12" y2="14" stroke="#4a4a4a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="68" y1="27" x2="68" y2="14" stroke="#4a4a4a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 鐵絲網主線 -->
  <polyline points="10,15 14,12 18,16 22,12 26,16 30,12 34,16 38,12 42,16 46,12 50,16 54,12 58,16 62,12 66,16 70,13" fill="none" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 鐵絲網倒刺 -->
  <g stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round">
    <line x1="16" y1="10" x2="20" y2="17"/>
    <line x1="28" y1="10" x2="32" y2="17"/>
    <line x1="40" y1="10" x2="44" y2="17"/>
    <line x1="52" y1="10" x2="56" y2="17"/>
    <line x1="64" y1="10" x2="68" y2="17"/>
  </g>

  <!-- 圍牆區塊 A -->
  <path d="M9,68 L9,27 A9,9 0 0 1 27,27 L27,68 Z" fill="#8a8a90" stroke="#ffffff" stroke-width="2"/>
  <line x1="18" y1="30" x2="18" y2="65" stroke="#9c9ca2" stroke-width="1"/>

  <!-- 圍牆區塊 B -->
  <path d="M31,68 L31,27 A9,9 0 0 1 49,27 L49,68 Z" fill="#94949a" stroke="#ffffff" stroke-width="2"/>
  <line x1="40" y1="30" x2="40" y2="65" stroke="#a6a6ac" stroke-width="1"/>

  <!-- 圍牆區塊 C -->
  <path d="M53,68 L53,27 A9,9 0 0 1 71,27 L71,68 Z" fill="#8a8a90" stroke="#ffffff" stroke-width="2"/>
  <line x1="62" y1="30" x2="62" y2="65" stroke="#9c9ca2" stroke-width="1"/>

  <!-- 塗鴉 A：紅色鋸齒線 + 黃色色塊 -->
  <polyline points="12,38 16,33 14,45 20,40 16,52 22,47" fill="none" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21" cy="58" r="4" fill="#ffd60a"/>

  <!-- 塗鴉 B：藍色波浪 + 綠色塗鴉 -->
  <path d="M34,36 Q38,31 42,36 T46,36" fill="none" stroke="#1982c4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M35,55 Q39,49 43,55 Q46,59 44,62" fill="none" stroke="#2ecc71" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 塗鴉 C：黃色噴漆圓 + 紅色滴漆 + 線條 -->
  <circle cx="63" cy="40" r="5" fill="#ffd60a"/>
  <line x1="63" y1="45" x2="63" y2="56" stroke="#ffd60a" stroke-width="2" stroke-linecap="round"/>
  <polyline points="57,55 61,50 59,62" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 噴漆閃爍動畫 -->
  <circle cx="24" cy="34" r="1.6" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="42" r="1.6" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="38" r="1.6" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>