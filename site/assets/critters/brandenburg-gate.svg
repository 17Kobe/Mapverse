<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecd8a8"/>
      <stop offset="55%" stop-color="#d7b878"/>
      <stop offset="100%" stop-color="#b8935a"/>
    </linearGradient>
    <linearGradient id="atticGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3c994"/>
      <stop offset="100%" stop-color="#c3a06a"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfa06a"/>
      <stop offset="100%" stop-color="#8f7245"/>
    </linearGradient>
    <linearGradient id="archShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5a42"/>
      <stop offset="100%" stop-color="#453a2a"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4a33"/>
      <stop offset="100%" stop-color="#2c2216"/>
    </linearGradient>
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base / steps reaching to bottom edge -->
  <rect x="4" y="66" width="72" height="14" fill="url(#baseGrad)" stroke="#6b5636" stroke-width="0.5"/>
  <rect x="4" y="66" width="72" height="3" fill="#d7bd8c" opacity="0.6"/>
  <rect x="2" y="74" width="76" height="6" fill="url(#baseGrad)" stroke="#5a4830" stroke-width="0.5"/>

  <!-- archway shadow openings -->
  <g fill="url(#archShadow)">
    <rect x="14" y="24" width="5" height="42"/>
    <rect x="24" y="24" width="5" height="42"/>
    <rect x="34" y="24" width="5" height="42"/>
    <rect x="44" y="24" width="5" height="42"/>
    <rect x="54" y="24" width="5" height="42"/>
  </g>

  <!-- columns -->
  <g fill="url(#stoneGrad)" stroke="#8a7248" stroke-width="0.5">
    <rect x="9" y="22" width="6" height="44"/>
    <rect x="19" y="22" width="6" height="44"/>
    <rect x="29" y="22" width="6" height="44"/>
    <rect x="39" y="22" width="6" height="44"/>
    <rect x="49" y="22" width="6" height="44"/>
    <rect x="59" y="22" width="6" height="44"/>
    <rect x="69" y="22" width="6" height="44"/>
  </g>
  <!-- fluting hints -->
  <g stroke="#9c8558" stroke-width="0.4" opacity="0.6">
    <line x1="12" y1="24" x2="12" y2="64"/>
    <line x1="22" y1="24" x2="22" y2="64"/>
    <line x1="32" y1="24" x2="32" y2="64"/>
    <line x1="42" y1="24" x2="42" y2="64"/>
    <line x1="52" y1="24" x2="52" y2="64"/>
    <line x1="62" y1="24" x2="62" y2="64"/>
    <line x1="72" y1="24" x2="72" y2="64"/>
  </g>
  <!-- column capitals -->
  <g fill="url(#atticGrad)" stroke="#8a7248" stroke-width="0.4">
    <rect x="8" y="20" width="8" height="3"/>
    <rect x="18" y="20" width="8" height="3"/>
    <rect x="28" y="20" width="8" height="3"/>
    <rect x="38" y="20" width="8" height="3"/>
    <rect x="48" y="20" width="8" height="3"/>
    <rect x="58" y="20" width="8" height="3"/>
    <rect x="68" y="20" width="8" height="3"/>
  </g>

  <!-- entablature -->
  <rect x="4" y="14" width="72" height="6" fill="url(#atticGrad)" stroke="#7a6440" stroke-width="0.5"/>
  <!-- attic story -->
  <rect x="10" y="5" width="60" height="9" fill="url(#atticGrad)" stroke="#7a6440" stroke-width="0.5"/>

  <!-- quadriga silhouette on top -->
  <g fill="url(#bronzeGrad)" stroke="#1d160e" stroke-width="0.4">
    <rect x="37" y="2" width="6" height="4" rx="0.8"/>
    <ellipse cx="22" cy="4.5" rx="4.2" ry="2.6"/>
    <ellipse cx="29.5" cy="3.8" rx="4.2" ry="2.6"/>
    <ellipse cx="50.5" cy="3.8" rx="4.2" ry="2.6"/>
    <ellipse cx="58" cy="4.5" rx="4.2" ry="2.6"/>
    <rect x="19" y="5.5" width="1.2" height="3" />
    <rect x="25" y="5.5" width="1.2" height="3" />
    <rect x="32" y="5" width="1.2" height="3" />
    <rect x="48" y="5" width="1.2" height="3" />
    <rect x="55" y="5.5" width="1.2" height="3" />
    <rect x="61" y="5.5" width="1.2" height="3" />
  </g>

  <!-- flying birds -->
  <g fill="none" stroke="#3a3228" stroke-width="0.8" stroke-linecap="round">
    <path d="M -6 10 l 3 -2 l 3 2 l 3 -2 l 3 2">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="95 -4" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M -10 16 l 2.2 -1.6 l 2.2 1.6 l 2.2 -1.6 l 2.2 1.6">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="100 3" dur="9s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- subtle sunlight glint sweeping across the facade -->
  <rect x="-18" y="18" width="16" height="50" fill="url(#glint)">
    <animate attributeName="x" from="-18" to="82" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
