<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">

  <!-- Ground/excavation pit -->
  <rect x="8" y="52" width="64" height="8" rx="2" fill="#8B6914" stroke="white" stroke-width="1"/>
  <!-- Dig site dark layer -->
  <rect x="8" y="56" width="64" height="4" rx="1" fill="#5C3D0E" stroke="none"/>
  
  <!-- Ground surface (dirt band) -->
  <rect x="5" y="60" width="70" height="7" rx="2" fill="#C8A060" stroke="white" stroke-width="1.2"/>
  <!-- Ground base ellipse -->
  <ellipse cx="40" cy="67" rx="35" ry="5" fill="#A07830" stroke="white" stroke-width="1"/>

  <!-- Soldier 3 (back, smallest) -->
  <g transform="translate(47, 22) scale(0.78)">
    <!-- Body armor -->
    <rect x="-7" y="18" width="14" height="18" rx="2" fill="#B8904A" stroke="white" stroke-width="1.5"/>
    <!-- Armor plates -->
    <rect x="-7" y="21" width="14" height="2.5" rx="0.5" fill="#A07838" stroke="white" stroke-width="0.8"/>
    <rect x="-7" y="26" width="14" height="2.5" rx="0.5" fill="#A07838" stroke="white" stroke-width="0.8"/>
    <rect x="-7" y="31" width="14" height="2.5" rx="0.5" fill="#A07838" stroke="white" stroke-width="0.8"/>
    <!-- Legs -->
    <rect x="-5" y="35" width="5" height="10" rx="1" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <rect x="1" y="35" width="5" height="10" rx="1" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <!-- Head -->
    <ellipse cx="0" cy="12" rx="6.5" ry="7" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <!-- Helmet -->
    <path d="M-7,10 Q-7,0 0,0 Q7,0 7,10 Z" fill="#B8904A" stroke="white" stroke-width="1.5"/>
    <!-- Helmet top knot -->
    <ellipse cx="0" cy="0" rx="2.5" ry="3" fill="#8B6914" stroke="white" stroke-width="1.2"/>
    <!-- Face -->
    <line x1="-2" y1="12" x2="-1" y2="14" stroke="#8B6914" stroke-width="0.8"/>
    <line x1="2" y1="12" x2="1" y2="14" stroke="#8B6914" stroke-width="0.8"/>
    <!-- Spear -->
    <line x1="9" y1="-5" x2="9" y2="45" stroke="#8B6914" stroke-width="2"/>
    <polygon points="9,-5 6,-12 12,-12" fill="#A0A0A0" stroke="white" stroke-width="1"/>
  </g>

  <!-- Soldier 2 (middle) -->
  <g transform="translate(35, 18) scale(0.88)">
    <!-- Body armor -->
    <rect x="-7.5" y="18" width="15" height="20" rx="2" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <!-- Armor plates -->
    <rect x="-7.5" y="21" width="15" height="2.5" rx="0.5" fill="#A87828" stroke="white" stroke-width="0.8"/>
    <rect x="-7.5" y="26" width="15" height="2.5" rx="0.5" fill="#A87828" stroke="white" stroke-width="0.8"/>
    <rect x="-7.5" y="31" width="15" height="2.5" rx="0.5" fill="#A87828" stroke="white" stroke-width="0.8"/>
    <!-- Legs -->
    <rect x="-5.5" y="37" width="5.5" height="11" rx="1" fill="#D4A850" stroke="white" stroke-width="1.5"/>
    <rect x="1" y="37" width="5.5" height="11" rx="1" fill="#D4A850" stroke="white" stroke-width="1.5"/>
    <!-- Head -->
    <ellipse cx="0" cy="11" rx="7" ry="8" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <!-- Helmet -->
    <path d="M-8,9 Q-8,-1 0,-1 Q8,-1 8,9 Z" fill="#B8904A" stroke="white" stroke-width="1.5"/>
    <!-- Helmet top knot -->
    <ellipse cx="0" cy="-1" rx="2.8" ry="3.5" fill="#8B6914" stroke="white" stroke-width="1.2"/>
    <!-- Face details -->
    <line x1="-2.5" y1="11" x2="-1.5" y2="13" stroke="#8B6914" stroke-width="0.8"/>
    <line x1="2.5" y1="11" x2="1.5" y2="13" stroke="#8B6914" stroke-width="0.8"/>
    <!-- Ear -->
    <ellipse cx="7" cy="12" rx="2" ry="3" fill="#C8A060" stroke="white" stroke-width="1"/>
    <!-- Spear -->
    <line x1="10" y1="-8" x2="10" y2="48" stroke="#8B6914" stroke-width="2.2"/>
    <polygon points="10,-8 7,-16 13,-16" fill="#B0B0B0" stroke="white" stroke-width="1.2"/>
  </g>

  <!-- Soldier 1 (front, largest) -->
  <g transform="translate(22, 14)">
    <!-- Body armor -->
    <rect x="-8" y="20" width="16" height="22" rx="2" fill="#D4AA5A" stroke="white" stroke-width="1.5"/>
    <!-- Armor plates horizontal lines -->
    <rect x="-8" y="23" width="16" height="3" rx="0.5" fill="#B88830" stroke="white" stroke-width="0.8"/>
    <rect x="-8" y="28.5" width="16" height="3" rx="0.5" fill="#B88830" stroke="white" stroke-width="0.8"/>
    <rect x="-8" y="34" width="16" height="3" rx="0.5" fill="#B88830" stroke="white" stroke-width="0.8"/>
    <!-- Waist belt -->
    <rect x="-8" y="40" width="16" height="2.5" rx="1" fill="#8B5C14" stroke="white" stroke-width="1"/>
    <!-- Legs -->
    <rect x="-6" y="42" width="6" height="13" rx="1.5" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <rect x="1" y="42" width="6" height="13" rx="1.5" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <!-- Boots -->
    <rect x="-6.5" y="52" width="7" height="3" rx="1" fill="#7A5020" stroke="white" stroke-width="1"/>
    <rect x="0.5" y="52" width="7" height="3" rx="1" fill="#7A5020" stroke="white" stroke-width="1"/>
    <!-- Head -->
    <ellipse cx="0" cy="12" rx="8" ry="9" fill="#D4AA5A" stroke="white" stroke-width="1.5"/>
    <!-- Helmet top -->
    <path d="M-9,10 Q-9,-2 0,-2 Q9,-2 9,10 Z" fill="#C8A060" stroke="white" stroke-width="1.5"/>
    <!-- Helmet brim -->
    <rect x="-10" y="8" width="20" height="3" rx="1" fill="#B88830" stroke="white" stroke-width="1.2"/>
    <!-- Helmet crest/knot -->
    <ellipse cx="0" cy="-2" rx="3" ry="4" fill="#8B6914" stroke="white" stroke-width="1.5"/>
    <!-- Face features -->
    <ellipse cx="-3" cy="12" rx="1.5" ry="1" fill="#8B6914"/>
    <ellipse cx="3" cy="12" rx="1.5" ry="1" fill="#8B6914"/>
    <path d="M-2,16 Q0,18 2,16" fill="none" stroke="#8B6914" stroke-width="0.8"/>
    <!-- Ear -->
    <ellipse cx="8" cy="13" rx="2.5" ry="3.5" fill="#D4AA5A" stroke="white" stroke-width="1"/>
    <!-- Arm/Shield suggestion -->
    <rect x="8" y="22" width="5" height="16" rx="2" fill="#A07030" stroke="white" stroke-width="1.2"/>
    <!-- Spear shaft -->
    <line x1="13" y1="-10" x2="13" y2="55" stroke="#9B6814" stroke-width="2.5"/>
    <!-- Spear tip -->
    <polygon points="13,-10 9.5,-20 16.5,-20" fill="#C0C0A0" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Dust particles animation around feet -->
  <circle cx="15" cy="63" r="1.5" fill="#C8A060" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="63;59;63" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="62" r="1" fill="#C8A060" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="62;57;62" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="38" cy="64" r="1.2" fill="#A07830" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="64;60;64" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

</svg>