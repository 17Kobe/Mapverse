<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
    <linearGradient id="beakGrad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffb02e"/>
      <stop offset="100%" stop-color="#ff7e1a"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5430"/><stop offset="1" stop-color="#4a2e14"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3f3f3f"/><stop offset="1" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3f3f3f"/><stop offset="1" stop-color="#141414"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="chestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbf0"/><stop offset="1" stop-color="#eed9a0"/>
    </linearGradient>
    <radialGradient id="eyeRingGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#78c8ff"/><stop offset="1" stop-color="#1f7ac2"/>
    </radialGradient>
    <linearGradient id="footGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa733"/><stop offset="1" stop-color="#c06f00"/>
    </linearGradient>
  </defs>

  <!-- 樹枝（靜止，不隨鳥身跳動） -->
  <rect x="8" y="58" width="64" height="9" rx="4.5" fill="url(#branchGrad)" stroke="#3f2910" stroke-width="0.5"/>
  <line x1="13" y1="60.5" x2="67" y2="60.5" stroke="#8a5a30" stroke-width="2" stroke-linecap="round"/>

  <!-- 鳥身整體：輕微上下跳動模擬樹枝跳躍 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0; 0,-1; 0,0"
      keyTimes="0; 0.3; 0.55; 0.8; 1"
      dur="0.9s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M55,30 Q70,24 67,16 Q59,20 52,32 Z" fill="url(#wingGrad)" stroke="#0d0d0d" stroke-width="0.5"/>

    <!-- 腳 -->
    <rect x="37" y="51" width="3.2" height="9" rx="1.6" fill="url(#footGrad)" stroke="#8a5400" stroke-width="0.4"/>
    <ellipse cx="38.6" cy="61" rx="4.2" ry="2.3" fill="#ffb02e" stroke="#b37a16" stroke-width="0.4"/>
    <rect x="47" y="51" width="3.2" height="9" rx="1.6" fill="url(#footGrad)" stroke="#8a5400" stroke-width="0.4"/>
    <ellipse cx="48.6" cy="61" rx="4.2" ry="2.3" fill="#ffb02e" stroke="#b37a16" stroke-width="0.4"/>

    <!-- 身體 -->
    <ellipse cx="48" cy="38" rx="15.5" ry="17.5" fill="url(#bodyGrad)" stroke="#0d0d0d" stroke-width="0.6"/>

    <!-- 翅膀細節 -->
    <path d="M51,30 Q62,34 56,49 Q47,46 47,35 Z" fill="url(#wingGrad)" stroke="#000000" stroke-width="0.4"/>

    <!-- 胸前白/黃斑塊 -->
    <ellipse cx="43" cy="42" rx="7.5" ry="9.5" fill="url(#chestGrad)" stroke="#d9c488" stroke-width="0.4"/>

    <!-- 頭 -->
    <circle cx="28" cy="26" r="11.5" fill="url(#headGrad)" stroke="#0d0d0d" stroke-width="0.6"/>

    <!-- 眼周藍色 -->
    <circle cx="24" cy="23" r="6.3" fill="url(#eyeRingGrad)" stroke="#1a5c8c" stroke-width="0.4"/>

    <!-- 眼睛 -->
    <circle cx="22.8" cy="23" r="2.7" fill="#1a1a1a"/>
    <circle cx="23.8" cy="21.9" r="1" fill="#f4f4f4"/>

    <!-- 巨大彩色鳥喙 -->
    <path d="M19,21 C8,16 -1,21 1,30 C3,39 14,39 21,33 C24,30 24,24 19,21 Z"
      fill="url(#beakGrad)" stroke="#c85a00" stroke-width="0.5"/>
    <path d="M17,22.5 C9,19 2,23 3,28.5" fill="none" stroke="#e8900a" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
    <path d="M2,29.5 C8,32 15,33 20,30.5" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="2" cy="29.5" r="1.4" fill="#1a1a1a"/>
  </g>
</svg>
