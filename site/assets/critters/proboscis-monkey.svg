<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="furGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a5536"/>
      <stop offset="50%" stop-color="#7a3f24"/>
      <stop offset="100%" stop-color="#4f2414"/>
    </linearGradient>
    <radialGradient id="bellyGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ddb690"/>
      <stop offset="55%" stop-color="#bb8a5d"/>
      <stop offset="100%" stop-color="#8a5a36"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a65f3d"/>
      <stop offset="100%" stop-color="#5c2c18"/>
    </linearGradient>
    <linearGradient id="noseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcae93"/>
      <stop offset="100%" stop-color="#a06c53"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6239"/>
      <stop offset="100%" stop-color="#52351b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fb85e"/>
      <stop offset="100%" stop-color="#4c7a2c"/>
    </linearGradient>
  </defs>

  <!-- branch -->
  <path d="M2,62 C20,55 60,55 78,63 L78,73 C60,66 20,66 2,73 Z" fill="url(#branchGrad)" stroke="#3d2810" stroke-width="0.5"/>
  <path d="M8,64.5 C25,60.5 55,60.5 72,65" fill="none" stroke="#3d2810" stroke-width="0.6" opacity="0.5"/>
  <path d="M10,69 C28,67 52,67 70,70" fill="none" stroke="#3d2810" stroke-width="0.5" opacity="0.35"/>

  <!-- leaves -->
  <g>
    <path d="M6,52 C2,46 4,38 11,36 C13,44 13,50 6,52 Z" fill="url(#leafGrad)" stroke="#355a1e" stroke-width="0.4"/>
    <path d="M8.5,37 L6,51" fill="none" stroke="#355a1e" stroke-width="0.4" opacity="0.6"/>
    <path d="M66,50 C63,45 65,39 70,38 C72,44 71,49 66,50 Z" fill="url(#leafGrad)" stroke="#355a1e" stroke-width="0.4"/>
  </g>

  <!-- tail with gentle swish -->
  <g transform-origin="56 38">
    <animateTransform attributeName="transform" type="rotate" values="-5 56 38;5 56 38;-5 56 38" dur="3.4s" repeatCount="indefinite"/>
    <path d="M55,37 C66,32 75,38 76.5,49 C77.5,56 73,60.5 67.5,58.5 C70,52.5 67.5,46 59.5,43.5 C57,42.7 55,40 55,37 Z" fill="url(#furGrad)" stroke="#3a1c0e" stroke-width="0.5"/>
  </g>

  <!-- body with slight idle rock -->
  <g transform-origin="35 58">
    <animateTransform attributeName="transform" type="rotate" values="0 35 58;-1.5 35 58;0 35 58" dur="3.4s" repeatCount="indefinite"/>

    <!-- back/belly silhouette -->
    <path d="M19,34 C16,21 27,11 40,12 C50,13 57,20 57,30 C59,34 59,41 55,45 C58,49 57,55 49,58 C39,62 25,61 19,54 C15,49 15,41 17,37 Z" fill="url(#furGrad)" stroke="#3a1c0e" stroke-width="0.5"/>

    <!-- belly patch -->
    <ellipse cx="31" cy="48" rx="13.5" ry="11.5" fill="url(#bellyGrad)" stroke="#7a4e2e" stroke-width="0.4"/>

    <!-- hind leg/foot on branch -->
    <path d="M27,51 C24,56 24,61 28,63 C33,64.5 37,61 35,57 C34,53 31,51 27,51 Z" fill="url(#furGrad)" stroke="#3a1c0e" stroke-width="0.5"/>

    <!-- arm resting on belly -->
    <path d="M23,36 C18,38 17,42.5 20.5,45.5 C24,48 28,45.5 27.5,41.5 C27.2,38.5 26,36.5 23,36 Z" fill="url(#furGrad)" stroke="#3a1c0e" stroke-width="0.4"/>

    <!-- head -->
    <circle cx="17" cy="23" r="9.5" fill="url(#headGrad)" stroke="#3a1c0e" stroke-width="0.5"/>
    <path d="M22.5,15.5 C25.5,13.5 28,15.5 26.5,18.8 C24.3,20 21,19 22.5,15.5 Z" fill="url(#headGrad)" stroke="#3a1c0e" stroke-width="0.4"/>

    <!-- pendulous nose -->
    <path d="M10.5,19.5 C4,19 0.8,23.5 1,28.5 C1.2,33 3.5,36.3 7.3,36 C10.3,35.7 12,31.8 10.8,27.8 C13,25.8 13.2,21.8 10.5,19.5 Z" fill="url(#noseGrad)" stroke="#6b4530" stroke-width="0.5"/>

    <!-- eye -->
    <circle cx="13.2" cy="19.5" r="1.3" fill="#2a1408"/>
    <circle cx="12.8" cy="19.1" r="0.4" fill="#e9d9c6"/>

    <!-- mouth -->
    <path d="M8,26.5 C10,28 12.5,28 14.5,26.8" fill="none" stroke="#3a1c0e" stroke-width="0.6" opacity="0.7"/>
  </g>
</svg>
