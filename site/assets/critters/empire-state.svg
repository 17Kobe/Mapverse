<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="stoneMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9c8a72"/>
      <stop offset="45%" stop-color="#cdbda0"/>
      <stop offset="60%" stop-color="#b6a486"/>
      <stop offset="100%" stop-color="#8a7a63"/>
    </linearGradient>
    <linearGradient id="stoneMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f7e68"/>
      <stop offset="45%" stop-color="#c0af92"/>
      <stop offset="100%" stop-color="#7d6e59"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#857562"/>
      <stop offset="50%" stop-color="#b3a287"/>
      <stop offset="100%" stop-color="#726351"/>
    </linearGradient>
    <linearGradient id="spireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c5048"/>
      <stop offset="50%" stop-color="#9a8b78"/>
      <stop offset="100%" stop-color="#443b34"/>
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffd84d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd84d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft base shadow anchoring to ground -->
  <ellipse cx="40" cy="78" rx="24" ry="3.4" fill="#2d2823" opacity="0.28"/>

  <!-- neighbouring low buildings for scale, kept further out so the tower itself reads narrow -->
  <rect x="2" y="62" width="10" height="17" fill="#6b6f78" opacity="0.8"/>
  <rect x="4" y="65" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.6"/>
  <rect x="7.5" y="65" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.6"/>
  <rect x="4" y="70" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.6"/>
  <rect x="7.5" y="70" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.6"/>
  <rect x="68" y="58" width="11" height="21" fill="#5f6570" opacity="0.8"/>
  <rect x="70.5" y="61" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.5"/>
  <rect x="75" y="61" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.5"/>
  <rect x="70.5" y="66" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.5"/>
  <rect x="75" y="66" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.5"/>
  <rect x="70.5" y="71" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.5"/>
  <rect x="75" y="71" width="1.8" height="1.8" fill="#dcdfe6" opacity="0.5"/>

  <!-- base tier: narrowed so the tower reads tall, not stocky -->
  <path d="M27 79 L27 50 L53 50 L53 79 Z" fill="url(#stoneMain)" stroke="#5f5346" stroke-width="0.5"/>
  <path d="M25 50 L55 50 L51 46 L29 46 Z" fill="url(#stoneMid)" stroke="#5f5346" stroke-width="0.4"/>

  <!-- window grid on base -->
  <g fill="#3c4450" opacity="0.55">
    <rect x="29.3" y="53" width="1.8" height="3"/>
    <rect x="32.6" y="53" width="1.8" height="3"/>
    <rect x="35.9" y="53" width="1.8" height="3"/>
    <rect x="39.2" y="53" width="1.8" height="3"/>
    <rect x="42.5" y="53" width="1.8" height="3"/>
    <rect x="45.8" y="53" width="1.8" height="3"/>
    <rect x="49.1" y="53" width="1.8" height="3"/>

    <rect x="29.3" y="59" width="1.8" height="3"/>
    <rect x="32.6" y="59" width="1.8" height="3"/>
    <rect x="35.9" y="59" width="1.8" height="3"/>
    <rect x="39.2" y="59" width="1.8" height="3"/>
    <rect x="42.5" y="59" width="1.8" height="3"/>
    <rect x="45.8" y="59" width="1.8" height="3"/>
    <rect x="49.1" y="59" width="1.8" height="3"/>

    <rect x="29.3" y="65" width="1.8" height="3"/>
    <rect x="32.6" y="65" width="1.8" height="3"/>
    <rect x="35.9" y="65" width="1.8" height="3"/>
    <rect x="39.2" y="65" width="1.8" height="3"/>
    <rect x="42.5" y="65" width="1.8" height="3"/>
    <rect x="45.8" y="65" width="1.8" height="3"/>
    <rect x="49.1" y="65" width="1.8" height="3"/>

    <rect x="29.3" y="71" width="1.8" height="3"/>
    <rect x="32.6" y="71" width="1.8" height="3"/>
    <rect x="35.9" y="71" width="1.8" height="3"/>
    <rect x="39.2" y="71" width="1.8" height="3"/>
    <rect x="42.5" y="71" width="1.8" height="3"/>
    <rect x="45.8" y="71" width="1.8" height="3"/>
    <rect x="49.1" y="71" width="1.8" height="3"/>
  </g>

  <!-- second tier (stepped setback) -->
  <path d="M30 46 L30 32 L50 32 L50 46 Z" fill="url(#stoneMain)" stroke="#5f5346" stroke-width="0.45"/>
  <path d="M28.5 32 L51.5 32 L48 28 L32 28 Z" fill="url(#stoneMid)" stroke="#5f5346" stroke-width="0.35"/>
  <g fill="#3c4450" opacity="0.55">
    <rect x="32" y="35" width="1.6" height="2.6"/>
    <rect x="34.9" y="35" width="1.6" height="2.6"/>
    <rect x="37.8" y="35" width="1.6" height="2.6"/>
    <rect x="40.7" y="35" width="1.6" height="2.6"/>
    <rect x="43.6" y="35" width="1.6" height="2.6"/>
    <rect x="46.5" y="35" width="1.6" height="2.6"/>

    <rect x="32" y="40" width="1.6" height="2.6"/>
    <rect x="34.9" y="40" width="1.6" height="2.6"/>
    <rect x="37.8" y="40" width="1.6" height="2.6"/>
    <rect x="40.7" y="40" width="1.6" height="2.6"/>
    <rect x="43.6" y="40" width="1.6" height="2.6"/>
    <rect x="46.5" y="40" width="1.6" height="2.6"/>
  </g>

  <!-- third tier -->
  <path d="M33.5 28 L33.5 18 L46.5 18 L46.5 28 Z" fill="url(#stoneMid)" stroke="#5f5346" stroke-width="0.4"/>
  <path d="M32.5 18 L47.5 18 L45 15 L35 15 Z" fill="url(#stoneTop)" stroke="#5f5346" stroke-width="0.3"/>
  <g fill="#3c4450" opacity="0.5">
    <rect x="35.5" y="21" width="1.4" height="2.3"/>
    <rect x="38" y="21" width="1.4" height="2.3"/>
    <rect x="40.5" y="21" width="1.4" height="2.3"/>
    <rect x="43" y="21" width="1.4" height="2.3"/>
  </g>

  <!-- narrow tower top -->
  <path d="M36.5 15 L36.5 8 L43.5 8 L43.5 15 Z" fill="url(#stoneTop)" stroke="#574c3f" stroke-width="0.35"/>
  <path d="M37.5 8 L42.5 8 L41 5 L39 5 Z" fill="url(#stoneTop)" stroke="#574c3f" stroke-width="0.3"/>

  <!-- spire antenna -->
  <line x1="40" y1="5" x2="40" y2="-7" stroke="url(#spireGrad)" stroke-width="1" stroke-linecap="round"/>

  <!-- beacon glow -->
  <circle cx="40" cy="-6" r="5" fill="url(#beacon)">
    <animate attributeName="r" values="4;5.8;4" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="-6.3" r="1" fill="#fff9df">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- subtle facade light sheen sweep -->
  <rect x="27" y="46" width="26" height="33" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.05;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
