<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
<linearGradient id="bg-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8d060"/><stop offset="1" stop-color="#93a038"/></linearGradient>
<linearGradient id="bg-pg-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8502e"/><stop offset="1" stop-color="#7a341c"/></linearGradient>
