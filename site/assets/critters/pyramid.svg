<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<!-- 沙地底部橢圓 -->
<ellipse cx="40" cy="72" rx="36" ry="7" fill="#d4a843" stroke="white" stroke-width="1.5"/>

<!-- 小金字塔（右） -->
<polygon points="57,62 67,62 62,50" fill="#d4a843" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="57,62 62,62 62,50" fill="#b88e30" stroke="none"/>

<!-- 中金字塔 -->
<polygon points="42,62 59,62 50.5,41" fill="#d4a843" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="50.5,62 59,62 50.5,41" fill="#b88e30" stroke="none"/>

<!-- 大金字塔（最左，最高） -->
<polygon points="13,65 50,65 31.5,22" fill="#d4a843" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="31.5,65 50,65 31.5,22" fill="#b88e30" stroke="none"/>

<!-- 獅身人面像（最右） -->
<rect x="64" y="58" width="13" height="7" rx="2" fill="#c49b3a" stroke="white" stroke-width="1.2"/>
<rect x="64" y="62" width="4" height="5" rx="1" fill="#c49b3a" stroke="white" stroke-width="1"/>
<ellipse cx="70" cy="55" rx="5" ry="5.5" fill="#d4a843" stroke="white" stroke-width="1.2"/>
<rect x="67" y="49" width="6" height="4" rx="1" fill="#b88e30" stroke="white" stroke-width="1"/>
<circle cx="69" cy="55.5" r="0.6" fill="#7a5a20"/>
<circle cx="71" cy="55.5" r="0.6" fill="#7a5a20"/>
<line x1="68.5" y1="53.5" x2="71.5" y2="53.5" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
</svg>