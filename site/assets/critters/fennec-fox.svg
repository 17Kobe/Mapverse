<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="fennecFur" x1="20%" y1="0%" x2="85%" y2="100%">
    <stop offset="0%" stop-color="#f6ddb0"/>
    <stop offset="55%" stop-color="#e8b878"/>
    <stop offset="100%" stop-color="#c88f50"/>
  </linearGradient>
  <linearGradient id="fennecFurDark" x1="20%" y1="0%" x2="85%" y2="100%">
    <stop offset="0%" stop-color="#e0bb86"/>
    <stop offset="100%" stop-color="#b17c42"/>
  </linearGradient>
  <linearGradient id="fennecBelly" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fcefd6"/>
    <stop offset="100%" stop-color="#f3d7a7"/>
  </linearGradient>
  <radialGradient id="earInner" cx="40%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#ffd9df"/>
    <stop offset="100%" stop-color="#e38fa0"/>
  </radialGradient>
  <linearGradient id="sandGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e8c48a"/>
    <stop offset="100%" stop-color="#d9af6b"/>
  </linearGradient>
  <linearGradient id="sandGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f1d6a0"/>
    <stop offset="100%" stop-color="#e3bd7e"/>
  </linearGradient>
</defs>

<!-- 沙地 -->
<path d="M0 62 Q16 54 30 60 Q44 66 58 58 Q70 52 80 58 L80 80 L0 80 Z" fill="url(#sandGrad1)"/>
<path d="M0 70 Q18 64 34 70 Q50 76 64 68 Q74 64 80 68 L80 80 L0 80 Z" fill="url(#sandGrad2)"/>

<!-- 尾巴（輕微搖擺） -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="-5 48 53;6 48 53;-5 48 53" dur="3.2s" repeatCount="indefinite"/>
  <path d="M46 52 Q62 34 72 42 Q78 52 70 60 Q60 68 48 62 Q42 57 46 52 Z" fill="url(#fennecFur)" stroke="#8a5a2e" stroke-width="0.6"/>
  <path d="M50 56 Q60 50 67 56" fill="none" stroke="#a9733c" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <path d="M64 32 Q76 36 76 48 Q75 56 66 54 Q64 44 64 32 Z" fill="#3a2416" stroke="#241408" stroke-width="0.5"/>
</g>

<!-- 遠側腿 -->
<rect x="42" y="50" width="9" height="15" rx="4.5" fill="url(#fennecFurDark)" stroke="#8a5a2e" stroke-width="0.6"/>
<ellipse cx="46.5" cy="64" rx="4.6" ry="2.4" fill="#3a2416" stroke="#241408" stroke-width="0.5"/>
<g stroke="#241408" stroke-width="0.4" stroke-linecap="round">
  <line x1="44" y1="65" x2="43.2" y2="66.4"/>
  <line x1="46.5" y1="65.6" x2="46.5" y2="67"/>
  <line x1="49" y1="65" x2="49.8" y2="66.4"/>
</g>

<!-- 身體 -->
<path d="M20 48 Q18 32 34 28 Q50 24 58 36 Q64 46 58 54 Q48 60 32 58 Q20 56 20 48 Z" fill="url(#fennecFur)" stroke="#8a5a2e" stroke-width="0.7"/>
<path d="M26 34 Q38 29 50 35" fill="none" stroke="#fcefd6" stroke-width="1.6" opacity="0.4" stroke-linecap="round"/>
<path d="M24 50 Q36 56 50 52" fill="none" stroke="url(#fennecBelly)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
<path d="M30 40 l2.4 1.4 M36 36 l2.4 1.4 M43 38 l2.4 1.4 M38 48 l2.4 1" stroke="#a9733c" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>

<!-- 近側腿 -->
<rect x="26" y="50" width="9" height="15" rx="4.5" fill="url(#fennecFur)" stroke="#8a5a2e" stroke-width="0.7"/>
<ellipse cx="30.5" cy="64" rx="4.6" ry="2.4" fill="#3a2416" stroke="#241408" stroke-width="0.5"/>
<g stroke="#241408" stroke-width="0.4" stroke-linecap="round">
  <line x1="28" y1="65" x2="27.2" y2="66.4"/>
  <line x1="30.5" y1="65.6" x2="30.5" y2="67"/>
  <line x1="33" y1="65" x2="33.8" y2="66.4"/>
</g>

<!-- 遠側耳（靜止） -->
<path d="M24 22 L34 4 L38 24 Z" fill="url(#fennecFurDark)" stroke="#8a5a2e" stroke-width="0.6"/>
<path d="M26 20 L33 9 L34 19 Z" fill="url(#earInner)" opacity="0.85"/>

<!-- 近側耳（輕微抖動動畫） -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="-3 22 23;4 22 23;-3 22 23" dur="2.6s" repeatCount="indefinite"/>
  <path d="M14 24 L8 4 L22 22 Z" fill="url(#fennecFur)" stroke="#8a5a2e" stroke-width="0.7"/>
  <path d="M14 21 L10 9 L19 19 Z" fill="url(#earInner)"/>
  <path d="M13 20 L10 11" stroke="#c87e94" stroke-width="0.5" opacity="0.6"/>
</g>

<!-- 頭 -->
<path d="M8 34 Q6 22 18 20 Q30 18 34 28 Q36 36 28 40 Q16 42 8 34 Z" fill="url(#fennecFur)" stroke="#8a5a2e" stroke-width="0.7"/>
<!-- 吻部淡色毛 -->
<path d="M9 34 Q3 37 3 43 Q3 48 11 46 Q15 44 14 38 Q12 35 9 34 Z" fill="url(#fennecBelly)" stroke="#8a5a2e" stroke-width="0.6"/>
<!-- 深色淚痕斑紋 -->
<path d="M15 24 Q10 26 11 32 Q12 37 18 34 Q21 29 19 25 Q17 23 15 24 Z" fill="#5c3b22" opacity="0.9"/>
<!-- 鼻頭 -->
<circle cx="5" cy="43" r="2.3" fill="#241a14"/>
<!-- 眼睛 -->
<circle cx="16" cy="29" r="2.2" fill="#241a14"/>
<circle cx="16.6" cy="28.3" r="0.6" fill="#fbe8c9" opacity="0.85"/>
<!-- 嘴 -->
<path d="M8 44 Q12 47 16 44" stroke="#5c3b22" stroke-width="1.1" fill="none" stroke-linecap="round"/>
</svg>
