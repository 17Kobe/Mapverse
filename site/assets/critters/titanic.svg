<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f86b8" stop-opacity=".92"/><stop offset="1" stop-color="#1a4f7e" stop-opacity=".97"/></linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="128" height="128"/></clipPath>
  </defs>
  <!-- 鐵達尼號：船頭已沒入水中，船尾翹起 -->
  <g clip-path="url(#c)">
    <g transform="rotate(-24 70 84)">
      <!-- 煙囪 -->
      <g fill="#e2b25a" stroke="#7a5a1a" stroke-width="1">
        <rect x="46" y="34" width="9" height="26"/><rect x="60" y="32" width="9" height="28"/>
        <rect x="74" y="34" width="9" height="26"/><rect x="88" y="36" width="9" height="24"/>
      </g>
      <g fill="#15151a"><rect x="46" y="31" width="9" height="6"/><rect x="60" y="29" width="9" height="6"/><rect x="74" y="31" width="9" height="6"/><rect x="88" y="33" width="9" height="6"/></g>
      <!-- 上層建築 -->
      <rect x="22" y="58" width="96" height="14" fill="#f3f1ec" stroke="#8a8780" stroke-width="1"/>
      <g fill="#2b4a66"><rect x="28" y="62" width="4" height="4"/><rect x="38" y="62" width="4" height="4"/><rect x="48" y="62" width="4" height="4"/><rect x="58" y="62" width="4" height="4"/><rect x="68" y="62" width="4" height="4"/><rect x="78" y="62" width="4" height="4"/><rect x="88" y="62" width="4" height="4"/><rect x="98" y="62" width="4" height="4"/><rect x="108" y="62" width="4" height="4"/></g>
      <!-- 船身：黑色船體、紅色水線 -->
      <path d="M8 72 L124 72 L120 100 L14 100Z" fill="#17181f"/>
      <rect x="14" y="94" width="106" height="6" fill="#b3261e"/>
      <!-- 船尾翹起的螺旋槳側 -->
      <path d="M118 72 L128 66 L126 100 L120 100Z" fill="#17181f"/>
      <!-- 桅杆 -->
      <rect x="14" y="40" width="2.4" height="32" fill="#4a3a28"/>
    </g>
    <!-- 海水蓋住船頭 -->
    <path d="M0 78 Q12 74 26 80 T54 84 T82 92 T110 100 L128 104 L128 128 L0 128Z" fill="url(#w)"/>
    <path d="M0 78 Q12 74 26 80 T54 84 T82 92 T110 100 L128 104" stroke="#d7efff" stroke-width="2" fill="none" opacity=".85"/>
    <!-- 氣泡與浪花 -->
    <g fill="#e9f7ff" opacity=".8"><circle cx="30" cy="94" r="3"/><circle cx="42" cy="104" r="2"/><circle cx="20" cy="108" r="2.4"/><circle cx="56" cy="98" r="1.8"/></g>
  </g>
</svg>
