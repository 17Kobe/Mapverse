<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="mfSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b8784a"/>
    </linearGradient>
    <linearGradient id="mfShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd0ea"/>
      <stop offset="100%" stop-color="#5a9fc9"/>
    </linearGradient>
    <linearGradient id="mfGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd27f"/>
      <stop offset="100%" stop-color="#3f8a3f"/>
    </linearGradient>
  </defs>

  <!-- pitch patch -->
  <ellipse cx="40" cy="77" rx="37" ry="4.6" fill="url(#mfGrass)" stroke="#2c6a2c" stroke-width="0.5"/>
  <path d="M8,77 Q40,73 72,77" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>

  <!-- trailing leg, mid-stride -->
  <path d="M34,58 C26,62 20,68 18,76 L24,78 C28,71 33,65 38,61 Z" fill="url(#mfSkin)" stroke="#8a5a34" stroke-width="0.4"/>
  <path d="M18,76 L24,78 L22,80 L15,80 Z" fill="#2a2a2a"/>

  <!-- torso, leaning into the kick -->
  <path d="M34,40 C30,48 31,55 36,60 C42,64 50,62 53,56 C56,50 54,42 48,38 C43,35 37,36 34,40 Z"
        fill="url(#mfShirt)" stroke="#2f6f93" stroke-width="0.5"/>
  <path d="M38,40 L36,54" stroke="#2f6f93" stroke-width="1" opacity="0.5"/>
  <path d="M44,38 L47,58" stroke="#2f6f93" stroke-width="1" opacity="0.5"/>

  <!-- arms, out for balance -->
  <path d="M36,42 C30,40 24,41 20,45" fill="none" stroke="url(#mfSkin)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M50,40 C56,38 61,40 64,45" fill="none" stroke="url(#mfSkin)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="44" cy="30" r="7" fill="url(#mfSkin)" stroke="#8a5a34" stroke-width="0.4"/>
  <path d="M38,27 Q44,22 51,27 Q51,24 44,23 Q38,24 38,27 Z" fill="#2a1d12"/>

  <!-- kicking leg, extended forward with the ball -->
  <path d="M48,56 C56,58 62,62 66,68 L61,72 C56,67 50,63 46,59 Z" fill="url(#mfSkin)" stroke="#8a5a34" stroke-width="0.4"/>
  <path d="M61,72 L66,68 L70,72 L65,78 Z" fill="#2a2a2a"/>

  <!-- the ball, flying off the boot -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 6,-3; 0,0" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="74" cy="66" r="3.4" fill="#fdfdfd" stroke="#333" stroke-width="0.5"/>
    <path d="M72,64 L76,64 L77,67 L74,69 L71,67 Z" fill="#333" opacity="0.85"/>
  </g>

  <!-- motion streak -->
  <path d="M58,70 L70,67" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
  </path>
</svg>
