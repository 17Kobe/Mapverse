<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<!-- Stars -->
<circle cx="12" cy="8"  r="1"   fill="white" opacity="0.9"/>
<circle cx="26" cy="5"  r="0.8" fill="white" opacity="0.8"/>
<circle cx="42" cy="7"  r="1.2" fill="white" opacity="0.9"/>
<circle cx="58" cy="4"  r="0.9" fill="white" opacity="0.7"/>
<circle cx="70" cy="9"  r="1"   fill="white" opacity="0.85"/>
<circle cx="67" cy="15" r="0.7" fill="white" opacity="0.6"/>
<circle cx="18" cy="14" r="0.8" fill="white" opacity="0.7"/>

<!-- Aurora Band 1: Green, widest back layer -->
<g opacity="0.78">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 3,0; 0,0; -3,0; 0,0" dur="7s" repeatCount="indefinite"/>
  <path d="M-5,10 C10,6 20,18 35,12 C50,6 60,18 75,10 C80,7 80,26 75,28 C60,36 50,24 35,30 C20,36 10,24 -5,28 Z"
    fill="#00dd66" stroke="none"/>
</g>

<!-- Aurora Band 2: Cyan, mid layer -->
<g opacity="0.72">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; -3,0; 0,0; 3,0; 0,0" dur="9s" repeatCount="indefinite"/>
  <path d="M-5,18 C8,14 22,28 40,20 C55,13 65,26 85,18 C85,30 80,38 65,34 C50,30 38,40 22,34 C8,29 -2,36 -5,30 Z"
    fill="#00ccee" stroke="none"/>
</g>

<!-- Aurora Band 3: Purple, front layer -->
<g opacity="0.68">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 2,0; 0,0; -4,0; 0,0" dur="11s" repeatCount="indefinite"/>
  <path d="M-5,28 C12,22 24,36 42,28 C57,21 66,32 85,26 C85,38 80,44 65,42 C50,40 40,48 24,44 C10,40 -2,46 -5,40 Z"
    fill="#9944ff" stroke="none"/>
</g>

<!-- Aurora Band 4: Thin green accent streak -->
<g opacity="0.55">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; -2,0; 0,0; 4,0; 0,0" dur="13s" repeatCount="indefinite"/>
  <path d="M-5,36 C15,30 30,42 50,35 C65,29 72,38 85,33 C85,42 80,48 65,46 C50,44 36,50 20,46 C6,43 -2,48 -5,44 Z"
    fill="#00ff88" stroke="none"/>
</g>

<!-- Ground: white snow ellipse -->
<ellipse cx="40" cy="76" rx="38" ry="6" fill="white" opacity="0.95" stroke="white" stroke-width="0.5"/>

<!-- Left mountain peak -->
<polygon points="14,72 26,50 38,72"
  fill="#e8f4ff" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<!-- Snow cap left -->
<polygon points="26,50 20,62 32,62"
  fill="white" stroke="white" stroke-width="0.5"/>

<!-- Right mountain peak -->
<polygon points="42,72 56,55 70,72"
  fill="#d4ecff" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<!-- Snow cap right -->
<polygon points="56,55 50,64 62,64"
  fill="white" stroke="white" stroke-width="0.5"/>

<!-- Pine tree between mountains -->
<polygon points="39,72 35,62 43,62" fill="#1a5c2a" stroke="white" stroke-width="1.2"/>
<polygon points="39,65 36,57 42,57" fill="#1a5c2a" stroke="white" stroke-width="1.2"/>
</svg>