<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <radialGradient id="stoneGrad" cx="35%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#c2c2c2"/>
    <stop offset="100%" stop-color="#7a7a7a"/>
  </radialGradient>
  <radialGradient id="stoneGradSm" cx="35%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#c6c6c6"/>
    <stop offset="100%" stop-color="#84847e"/>
  </radialGradient>
  <radialGradient id="waterGrad" cx="40%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#eaf7fa"/>
    <stop offset="100%" stop-color="#a9d8e2"/>
  </radialGradient>
  <radialGradient id="furGrad" cx="35%" cy="25%" r="80%">
    <stop offset="0%" stop-color="#b3a386"/>
    <stop offset="100%" stop-color="#6e5e45"/>
  </radialGradient>
  <radialGradient id="skinGrad" cx="40%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#f3bcc3"/>
    <stop offset="100%" stop-color="#d3808a"/>
  </radialGradient>
</defs>
<!-- 雪地點綴（不填滿畫布） -->
<circle cx="10" cy="10" r="2" fill="#ffffff" opacity="0.8"/>
<circle cx="70" cy="8" r="1.6" fill="#ffffff" opacity="0.7"/>
<circle cx="6" cy="68" r="1.8" fill="#ffffff" opacity="0.7"/>
<circle cx="73" cy="70" r="2" fill="#ffffff" opacity="0.8"/>
<circle cx="14" cy="24" r="1.2" fill="#ffffff" opacity="0.6"/>
<circle cx="66" cy="22" r="1.3" fill="#ffffff" opacity="0.6"/>

<!-- 溫泉池：石砌外緣 -->
<g>
  <circle cx="40" cy="50" r="29" fill="url(#stoneGrad)" stroke="#565656" stroke-width="0.6"/>
  <circle cx="14" cy="42" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="20" cy="26" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="36" cy="20" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="54" cy="21" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="66" cy="34" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="68" cy="54" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="58" cy="70" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="38" cy="75" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="18" cy="68" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
  <circle cx="9" cy="54" r="5" fill="url(#stoneGradSm)" stroke="#5c5c58" stroke-width="0.5"/>
</g>

<!-- 溫泉水面 -->
<circle cx="40" cy="50" r="24" fill="url(#waterGrad)" stroke="#8fc3d1" stroke-width="0.5"/>
<ellipse cx="32" cy="46" rx="6" ry="2.5" fill="#ffffff" opacity="0.5"/>
<ellipse cx="50" cy="56" rx="7" ry="2.5" fill="#ffffff" opacity="0.4"/>

<!-- 猴子肩膀（浸在水中） -->
<ellipse cx="40" cy="58" rx="17" ry="11" fill="url(#furGrad)" stroke="#4a3d2a" stroke-width="0.6"/>

<!-- 猴子耳朵 -->
<circle cx="27" cy="34" r="5.5" fill="url(#furGrad)" stroke="#4a3d2a" stroke-width="0.5"/>
<circle cx="53" cy="34" r="5.5" fill="url(#furGrad)" stroke="#4a3d2a" stroke-width="0.5"/>
<circle cx="27" cy="34" r="2.6" fill="#e8a0a8"/>
<circle cx="53" cy="34" r="2.6" fill="#e8a0a8"/>

<!-- 猴子頭 -->
<circle cx="40" cy="39" r="13" fill="url(#furGrad)" stroke="#4a3d2a" stroke-width="0.6"/>

<!-- 粉紅臉部：上半額頭眼眶、下半另外畫出突出的嘴吻部，輪廓比較像猴子，不是人臉 -->
<ellipse cx="40" cy="39.5" rx="8" ry="6" fill="url(#skinGrad)" stroke="#b8616c" stroke-width="0.5"/>
<ellipse cx="40" cy="47.5" rx="6.6" ry="5.2" fill="url(#skinGrad)" stroke="#b8616c" stroke-width="0.5"/>

<!-- 眉骨：猴子的眉脊比人類明顯 -->
<path d="M33,37 Q36,35 39,36.5" fill="none" stroke="#6e5e45" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<path d="M41,36.5 Q44,35 47,37" fill="none" stroke="#6e5e45" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

<!-- 眼睛：杏仁形且靠近一點，不是圓滾滾的人類大眼 -->
<ellipse cx="36.3" cy="39.5" rx="1.5" ry="1.9" fill="#2a2015"/>
<ellipse cx="43.7" cy="39.5" rx="1.5" ry="1.9" fill="#2a2015"/>

<!-- 鼻孔：扁扁的兩個小孔，取代人類的鼻子形狀 -->
<ellipse cx="38.2" cy="45.3" rx="0.9" ry="0.7" fill="#9c5a63"/>
<ellipse cx="41.8" cy="45.3" rx="0.9" ry="0.7" fill="#9c5a63"/>

<!-- 嘴：畫在突出的嘴吻部下緣 -->
<path d="M 35.5 50.5 Q 40 52.5 44.5 50.5" fill="none" stroke="#6b4a30" stroke-width="1.1" stroke-linecap="round"/>

<!-- 頭頂毛髮小尖角 -->
<path d="M 35 27 Q 40 22 45 27" fill="url(#furGrad)" stroke="#4a3d2a" stroke-width="0.5" stroke-linejoin="round"/>

<!-- 蒸氣：三股半透明白色橢圓，緩慢飄動 -->
<g>
  <ellipse cx="30" cy="22" rx="4" ry="7" fill="#ffffff" opacity="0.55">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,4; 0,-6; 0,4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="41" cy="16" rx="4.5" ry="8" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,3; 0,-7; 0,3" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="51" cy="23" rx="3.8" ry="6.5" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,4; 0,-5; 0,4" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
  </ellipse>
</g>
</svg>
