<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Petra / Al-Khazneh Treasury facade -->
  <defs>
    <linearGradient id="peFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d47e54"/><stop offset="1" stop-color="#a8532f"/>
    </linearGradient>
    <linearGradient id="peFaceDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bc6a46"/><stop offset="1" stop-color="#8e4327"/>
    </linearGradient>
    <linearGradient id="peCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08f6a"/><stop offset="1" stop-color="#b6613f"/>
    </linearGradient>
    <linearGradient id="peCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eca080"/><stop offset="1" stop-color="#c3785a"/>
    </linearGradient>
    <linearGradient id="peBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bc6a46"/><stop offset="1" stop-color="#8e4327"/>
    </linearGradient>
    <linearGradient id="peDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85a38"/><stop offset="1" stop-color="#7c3b20"/>
    </linearGradient>
    <linearGradient id="peSand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ddbb8c"/><stop offset="1" stop-color="#c79c68"/>
    </linearGradient>
  </defs>

  <!-- Two narrow side canyon rock walls (irregular paths, not rectangles) -->
  <!-- Left canyon wall -->
  <path d="M0,8 L10,6 L12,14 L9,22 L11,30 L8,38 L10,46 L7,54 L9,62 L6,72 L0,72 Z"
        fill="#7a3e20" opacity="0.85"/>
  <!-- Right canyon wall -->
  <path d="M80,8 L70,6 L68,14 L71,22 L69,30 L72,38 L70,46 L73,54 L71,62 L74,72 L80,72 Z"
        fill="#7a3e20" opacity="0.85"/>

  <!-- ===== UPPER PEDIMENT SECTION (y=8 to y=36) ===== -->

  <!-- Main triangular pediment background -->
  <polygon points="18,36 62,36 40,12" fill="url(#peFace)" stroke="#8e4327" stroke-width="0.5"/>

  <!-- Left small side pediment -->
  <polygon points="14,36 28,36 21,24" fill="url(#peFaceDark)" stroke="#7c3b20" stroke-width="0.5"/>
  <!-- Right small side pediment -->
  <polygon points="52,36 66,36 59,24" fill="url(#peFaceDark)" stroke="#7c3b20" stroke-width="0.5"/>

  <!-- Left tholos (round element) -->
  <circle cx="21" cy="22" r="5" fill="url(#peFace)" stroke="#8e4327" stroke-width="0.5"/>
  <circle cx="21" cy="22" r="2.5" fill="#9a4e30"/>

  <!-- Right tholos -->
  <circle cx="59" cy="22" r="5" fill="url(#peFace)" stroke="#8e4327" stroke-width="0.5"/>
  <circle cx="59" cy="22" r="2.5" fill="#9a4e30"/>

  <!-- Center decoration urn on main pediment -->
  <ellipse cx="40" cy="16" rx="3.5" ry="2.5" fill="#9a4e30" stroke="#7c3b20" stroke-width="0.4"/>
  <rect x="38.5" y="14" width="3" height="4" fill="#9a4e30" stroke="#7c3b20" stroke-width="0.4"/>

  <!-- Horizontal entablature band -->
  <rect x="14" y="34" width="52" height="4" fill="url(#peBand)" stroke="#7c3b20" stroke-width="0.5" rx="0.5"/>
  <!-- Frieze dots -->
  <circle cx="20" cy="36" r="1" fill="#7c3b20"/>
  <circle cx="28" cy="36" r="1" fill="#7c3b20"/>
  <circle cx="36" cy="36" r="1" fill="#7c3b20"/>
  <circle cx="44" cy="36" r="1" fill="#7c3b20"/>
  <circle cx="52" cy="36" r="1" fill="#7c3b20"/>
  <circle cx="60" cy="36" r="1" fill="#7c3b20"/>

  <!-- ===== LOWER COLONNADE SECTION (y=36 to y=58) ===== -->

  <!-- Column facade background -->
  <rect x="14" y="36" width="52" height="24" fill="url(#peFace)" stroke="#8e4327" stroke-width="0.5" rx="1"/>

  <!-- 4 columns -->
  <!-- Column 1 -->
  <rect x="16" y="37" width="6" height="22" fill="url(#peCol)" stroke="#9a5634" stroke-width="0.4" rx="1"/>
  <!-- Column 1 capital -->
  <rect x="15" y="37" width="8" height="3" fill="url(#peCap)" stroke="#a9643f" stroke-width="0.4" rx="0.5"/>

  <!-- Column 2 -->
  <rect x="27" y="37" width="6" height="22" fill="url(#peCol)" stroke="#9a5634" stroke-width="0.4" rx="1"/>
  <rect x="26" y="37" width="8" height="3" fill="url(#peCap)" stroke="#a9643f" stroke-width="0.4" rx="0.5"/>

  <!-- Column 3 -->
  <rect x="47" y="37" width="6" height="22" fill="url(#peCol)" stroke="#9a5634" stroke-width="0.4" rx="1"/>
  <rect x="46" y="37" width="8" height="3" fill="url(#peCap)" stroke="#a9643f" stroke-width="0.4" rx="0.5"/>

  <!-- Column 4 -->
  <rect x="58" y="37" width="6" height="22" fill="url(#peCol)" stroke="#9a5634" stroke-width="0.4" rx="1"/>
  <rect x="57" y="37" width="8" height="3" fill="url(#peCap)" stroke="#a9643f" stroke-width="0.4" rx="0.5"/>

  <!-- Dark shadow bays between columns -->
  <rect x="22" y="38" width="5" height="20" fill="#7a3e20" opacity="0.7"/>
  <rect x="33" y="38" width="14" height="20" fill="#9a4e30" opacity="0.5"/>
  <rect x="53" y="38" width="5" height="20" fill="#7a3e20" opacity="0.7"/>

  <!-- ===== CENTRAL ARCH DOORWAY (y=44 to y=70) ===== -->

  <!-- Arch surround -->
  <path d="M31,70 L31,50 Q40,40 49,50 L49,70 Z" fill="url(#peDark)" stroke="#5e2c16" stroke-width="0.5"/>
  <!-- Arch black interior -->
  <path d="M33,70 L33,51 Q40,43 47,51 L47,70 Z" fill="#1a0a04"/>

  <!-- Arch keystone highlight -->
  <ellipse cx="40" cy="44" rx="3" ry="2" fill="url(#peCap)" stroke="#a9643f" stroke-width="0.4"/>

  <!-- ===== BASE / STEPS ===== -->
  <rect x="16" y="58" width="48" height="3" fill="url(#peBand)" stroke="#7c3b20" stroke-width="0.4" rx="0.5"/>
  <rect x="14" y="61" width="52" height="3" fill="url(#peDark)" stroke="#5e2c16" stroke-width="0.4" rx="0.5"/>

  <!-- Sand ground -->
  <ellipse cx="40" cy="70" rx="28" ry="4" fill="url(#peSand)" stroke="#b89462" stroke-width="0.4" opacity="0.9"/>
</svg>
