<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<!-- 左側大摩艾 -->
<!-- 底部草地 -->
<ellipse cx="40" cy="74" rx="32" ry="7" fill="#4a8040" stroke="white" stroke-width="1.5"/>

<!-- 左大摩艾身體 -->
<rect x="12" y="38" width="24" height="22" rx="3" fill="#5a5550" stroke="white" stroke-width="1.5"/>
<!-- 左大摩艾頸部 -->
<rect x="16" y="32" width="16" height="8" rx="2" fill="#5a5550" stroke="white" stroke-width="1.5"/>
<!-- 左大摩艾臉 -->
<rect x="13" y="10" width="22" height="25" rx="4" fill="#6a6560" stroke="white" stroke-width="1.5"/>
<!-- 左大摩艾額頭突起 -->
<rect x="15" y="8" width="18" height="6" rx="2" fill="#6a6560" stroke="white" stroke-width="1.5"/>
<!-- 左大摩艾鼻子 -->
<rect x="21" y="21" width="6" height="10" rx="2" fill="#5a5550" stroke="white" stroke-width="1.2"/>
<!-- 左大摩艾下巴突出 -->
<rect x="17" y="31" width="14" height="5" rx="3" fill="#5a5550" stroke="white" stroke-width="1.2"/>
<!-- 左大摩艾左眼 -->
<ellipse cx="18" cy="19" rx="4" ry="3" fill="#2a2520" stroke="white" stroke-width="1"/>
<ellipse cx="18" cy="19" rx="2" ry="1.5" fill="white"/>
<ellipse cx="18" cy="19" rx="1" ry="1" fill="#111"/>
<!-- 左大摩艾右眼 -->
<ellipse cx="30" cy="19" rx="4" ry="3" fill="#2a2520" stroke="white" stroke-width="1"/>
<ellipse cx="30" cy="19" rx="2" ry="1.5" fill="white"/>
<ellipse cx="30" cy="19" rx="1" ry="1" fill="#111"/>
<!-- 左大摩艾嘴線 -->
<line x1="20" y1="28" x2="28" y2="28" stroke="#3a3530" stroke-width="1.5"/>

<!-- 右小摩艾身體 -->
<rect x="46" y="48" width="17" height="16" rx="2" fill="#5a5550" stroke="white" stroke-width="1.5"/>
<!-- 右小摩艾頸部 -->
<rect x="49" y="43" width="11" height="7" rx="2" fill="#5a5550" stroke="white" stroke-width="1.5"/>
<!-- 右小摩艾臉 -->
<rect x="47" y="26" width="16" height="19" rx="3" fill="#6a6560" stroke="white" stroke-width="1.5"/>
<!-- 右小摩艾額頭 -->
<rect x="49" y="24" width="12" height="5" rx="2" fill="#6a6560" stroke="white" stroke-width="1.5"/>
<!-- 右小摩艾 pukao 紅帽 (圓柱) -->
<rect x="50" y="16" width="10" height="8" rx="2" fill="#c0392b" stroke="white" stroke-width="1.5"/>
<ellipse cx="55" cy="16" rx="5" ry="2.5" fill="#c0392b" stroke="white" stroke-width="1.2"/>
<!-- 右小摩艾鼻子 -->
<rect x="52" y="33" width="4" height="7" rx="1.5" fill="#5a5550" stroke="white" stroke-width="1"/>
<!-- 右小摩艾下巴 -->
<rect x="50" y="42" width="9" height="3.5" rx="2" fill="#5a5550" stroke="white" stroke-width="1"/>
<!-- 右小摩艾左眼 -->
<ellipse cx="51" cy="31" rx="2.8" ry="2.2" fill="#2a2520" stroke="white" stroke-width="0.8"/>
<ellipse cx="51" cy="31" rx="1.4" ry="1.1" fill="white"/>
<ellipse cx="51" cy="31" rx="0.7" ry="0.7" fill="#111"/>
<!-- 右小摩艾右眼 -->
<ellipse cx="59" cy="31" rx="2.8" ry="2.2" fill="#2a2520" stroke="white" stroke-width="0.8"/>
<ellipse cx="59" cy="31" rx="1.4" ry="1.1" fill="white"/>
<ellipse cx="59" cy="31" rx="0.7" ry="0.7" fill="#111"/>
<!-- 右小摩艾嘴線 -->
<line x1="51" y1="39" x2="59" y2="39" stroke="#3a3530" stroke-width="1.2"/>
</svg>