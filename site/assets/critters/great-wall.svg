<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 山脊：起伏綠丘，襯托城牆 -->
  <ellipse cx="14" cy="64" rx="18" ry="11" fill="#6a9048" stroke="white" stroke-width="1.5"/>
  <ellipse cx="40" cy="58" rx="20" ry="12" fill="#5a8238" stroke="white" stroke-width="1.5"/>
  <ellipse cx="66" cy="50" rx="18" ry="11" fill="#6a9048" stroke="white" stroke-width="1.5"/>

  <!-- 城牆主體：單一清爽的斜向色帶，從左下到右上 -->
  <path d="M4,60 L74,16 L74,26 L4,70 Z"
    fill="#d4bb86" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 城牆下緣陰影，增加厚度感 -->
  <path d="M4,66 L74,22 L74,26 L4,70 Z" fill="#a98f5c"/>

  <!-- 城垛：鋸齒狀連續齒形（比分散的小矩形更乾淨好認） -->
  <path d="M6,53 L10,50.5 L10,47 L14,47 L14,50.5 L18,48 L18,44.5 L22,44.5 L22,48
           L45,33 L45,29.5 L49,29.5 L49,33 L53,30.5 L53,27 L57,27 L57,30.5 L61,28 L61,24.5 L65,24.5 L65,28 L70,25"
    fill="none" stroke="#b89a60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 唯一的主烽火台（置中偏左，清楚好認） -->
  <rect x="30" y="24" width="14" height="22" rx="1.5" fill="#d4bb86" stroke="white" stroke-width="2.2"/>
  <!-- 烽火台城垛 -->
  <rect x="30" y="18" width="3.5" height="6" fill="#b89a60" stroke="white" stroke-width="1"/>
  <rect x="36" y="18" width="3.5" height="6" fill="#b89a60" stroke="white" stroke-width="1"/>
  <rect x="41.5" y="18" width="3.5" height="6" fill="#b89a60" stroke="white" stroke-width="1"/>
  <!-- 烽火台窗洞 -->
  <rect x="34.5" y="33" width="5" height="7" rx="0.8" fill="#5a3f22" stroke="white" stroke-width="0.8"/>
</svg>
