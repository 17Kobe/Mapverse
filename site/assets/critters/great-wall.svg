<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="gwWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2cb98"/>
      <stop offset="1" stop-color="#bda06a"/>
    </linearGradient>
    <linearGradient id="gwTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddc694"/>
      <stop offset="1" stop-color="#b89a60"/>
    </linearGradient>
  </defs>
  <!-- 城牆主體：單一清爽的斜向色帶，從左下到右上 -->
  <path d="M4,60 L74,16 L74,26 L4,70 Z"
    fill="url(#gwWall)" stroke="#8a6f40" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- 城牆下緣陰影，增加厚度感 -->
  <path d="M4,66 L74,22 L74,26 L4,70 Z" fill="#a98f5c"/>

  <!-- 城垛：鋸齒狀連續齒形（比分散的小矩形更乾淨好認） -->
  <path d="M6,53 L10,50.5 L10,47 L14,47 L14,50.5 L18,48 L18,44.5 L22,44.5 L22,48
           L45,33 L45,29.5 L49,29.5 L49,33 L53,30.5 L53,27 L57,27 L57,30.5 L61,28 L61,24.5 L65,24.5 L65,28 L70,25"
    fill="none" stroke="#b89a60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 唯一的主烽火台（置中偏左，清楚好認） -->
  <rect x="30" y="24" width="14" height="22" rx="1.5" fill="url(#gwTower)" stroke="#8a6f40" stroke-width="0.6"/>
  <!-- 烽火台城垛 -->
  <rect x="30" y="18" width="3.5" height="6" fill="#b89a60" stroke="#7a6038" stroke-width="0.4"/>
  <rect x="36" y="18" width="3.5" height="6" fill="#b89a60" stroke="#7a6038" stroke-width="0.4"/>
  <rect x="41.5" y="18" width="3.5" height="6" fill="#b89a60" stroke="#7a6038" stroke-width="0.4"/>
  <!-- 烽火台窗洞 -->
  <rect x="34.5" y="33" width="5" height="7" rx="0.8" fill="#5a3f22" stroke="#331f0e" stroke-width="0.4"/>
</svg>
