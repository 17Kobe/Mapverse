<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="evSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fd4f0"/>
    <stop offset="1" stop-color="#5bb0da"/>
  </linearGradient>
  <linearGradient id="evRock" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a9bb0"/>
    <stop offset="1" stop-color="#48607a"/>
  </linearGradient>
  <linearGradient id="evMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5c6a74"/>
    <stop offset="0.55" stop-color="#394650"/>
    <stop offset="1" stop-color="#1c2630"/>
  </linearGradient>
</defs>

<ellipse cx="40" cy="75" rx="30" ry="9" fill="url(#evSky)" stroke="#3f8aad" stroke-width="0.6"/>

<!-- 遠處較低的肩峰，襯托主峰的孤高 -->
<polygon points="48,70 60,36 72,70" fill="url(#evRock)" stroke="#33445a" stroke-width="0.5" opacity="0.85"/>
<polygon points="60,36 56,43 64,43" fill="#ffffff" stroke="#c9d8e2" stroke-width="0.3" opacity="0.9"/>

<!-- 聖母峰主峰：不對稱金字塔形（左稜線長而緩、右側陡峭），黑灰岩壁只在上段覆雪 -->
<polygon points="10,70 23,44 33,18 41,5 47,20 58,44 70,70" fill="url(#evMain)" stroke="#10161c" stroke-width="0.6"/>
<!-- 陽面稜線的亮邊，製造立體感 -->
<path d="M41,5 L33,18 L23,44 L10,70 L16,70 L27,42 L35,18 Z" fill="#aebdc8" opacity="0.4"/>
<!-- 頂峰覆雪 -->
<polygon points="41,5 34,22 37,20 41,16 45,20 48,22" fill="#ffffff" stroke="#c9d8e2" stroke-width="0.4"/>
<path d="M41,5 L37,20 L41,16 Z" fill="#eef5fa" opacity="0.8"/>

<!-- 強風吹起的雪煙：聖母峰照片最常見的識別特徵 -->
<path d="M47,9 Q58,7 66,11 Q72,13 76,10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
  <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.4s" repeatCount="indefinite"/>
</path>
<path d="M45,13 Q54,12 60,15" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
  <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- 登山者 -->
<g>
  <circle cx="22" cy="55" r="2.1" fill="#2b2b2b" stroke="#141414" stroke-width="0.4"/>
  <path d="M22,57 L22,61 M22,61 L19,67 M22,61 L25,67" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <line x1="26" y1="50" x2="26" y2="62" stroke="#4a3b2c" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="26,50 32.5,52.5 26,55" fill="#e63946" stroke="#9c2430" stroke-width="0.4"/>
</g>

<!-- 經幡 -->
<g>
  <path d="M43,22 Q50,23 56,29" fill="none" stroke="#4a3b2c" stroke-width="0.8"/>
  <polygon points="43,22 47,22.7 45,27" fill="#1d6fd1" stroke="#124a90" stroke-width="0.4"/>
  <polygon points="47,22.7 50,24 48.5,28" fill="#e63946" stroke="#9c2430" stroke-width="0.4"/>
  <polygon points="50,24 53,26.3 51.5,30" fill="#f4a300" stroke="#a66e00" stroke-width="0.4"/>
  <polygon points="53,26.3 56,29 54.5,32.5" fill="#2a9d8f" stroke="#176a60" stroke-width="0.4"/>
</g>

<g>
  <ellipse cx="50" cy="34" rx="6" ry="2.4" fill="white" opacity="0.5">
    <animate attributeName="cx" values="50;58;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</g>
</svg>
