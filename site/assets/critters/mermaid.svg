<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#1f8fd4">
        <animate attributeName="stop-color" values="#1f8fd4;#3fd4c4;#1f8fd4" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5b3fb0"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9188"/>
      <stop offset="100%" stop-color="#4c463f"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe3c7"/>
      <stop offset="100%" stop-color="#e6a978"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a3a3a"/>
      <stop offset="100%" stop-color="#431414"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fb3d9"/>
      <stop offset="100%" stop-color="#0a3250"/>
    </linearGradient>
    <radialGradient id="shellGrad" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#fff2ea"/>
      <stop offset="100%" stop-color="#e59bb0"/>
    </radialGradient>
  </defs>

  <!-- rock outcrop -->
  <path d="M14,52 C16,41 27,34 37,36 C47,38 54,33 61,41 C67,48 65,58 58,63 C48,69 29,69 19,63 C12,59 12,56 14,52 Z"
        fill="url(#rockGrad)" stroke="#312c26" stroke-width="0.6"/>
  <ellipse cx="30" cy="42" rx="9" ry="4" fill="#b7ad9f" opacity="0.35"/>

  <!-- sea water base, reaching bottom edge -->
  <path d="M0,58 C8,52 16,62 24,56 C32,50 40,60 48,54 C56,48 64,58 72,52 C76,50 78,54 80,56 L80,80 L0,80 Z"
        fill="url(#waterGrad)"/>
  <path d="M0,63 C10,59 20,67 30,61 C40,55 50,65 60,59 C70,55 75,61 80,59 L80,80 L0,80 Z"
        fill="#ffffff" opacity="0.18">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- small rising bubbles -->
  <circle cx="64" cy="70" r="1.4" fill="#eafcff" opacity="0.6">
    <animate attributeName="cy" values="70;60;70" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="74" r="1" fill="#eafcff" opacity="0.5">
    <animate attributeName="cy" values="74;64;74" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- tail, flicking -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 30 38;6 30 38;-4 30 38" dur="2.4s" repeatCount="indefinite"/>
    <path d="M29,37 C39,39 49,45 55,55 C59,62 61,68 59,75 C57,70 53,61 49,55 C43,47 35,41 29,37 Z"
          fill="url(#tailGrad)" stroke="#0d5f58" stroke-width="0.6"/>
    <path d="M55,66 C61,61 72,59 77,65 C70,67 64,70 60,76 C58,72 56,69 55,66 Z"
          fill="url(#tailGrad)" stroke="#0d5f58" stroke-width="0.6"/>
    <path d="M36,44 Q40,46 44,50" fill="none" stroke="#9ff0e0" stroke-width="0.6" opacity="0.5"/>
    <path d="M42,50 Q47,53 51,58" fill="none" stroke="#9ff0e0" stroke-width="0.6" opacity="0.5"/>
    <path d="M47,56 Q51,59 54,64" fill="none" stroke="#9ff0e0" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- hair, behind torso -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 24 20;2 24 20;-2 24 20" dur="3.4s" repeatCount="indefinite"/>
    <path d="M21,9 C13,11 11,22 15,32 C19,42 26,46 34,48 C29,40 25,33 27,25 C29,19 26,13 21,9 Z"
          fill="url(#hairGrad)" stroke="#2b0d0d" stroke-width="0.5"/>
  </g>

  <!-- torso -->
  <path d="M20,22 C22,17 30,15 34,18 C38,21 40,27 38,33 C37,37 34,40 30,42 C25,43 19,40 18,34 C16,28 17,24 20,22 Z"
        fill="url(#skinGrad)" stroke="#c98a5e" stroke-width="0.5"/>

  <!-- shell top -->
  <path d="M23,23 C22,21 25,19 27,21 C28,22 27,24 25,24 C24,24 23,24 23,23 Z" fill="url(#shellGrad)" stroke="#c06a85" stroke-width="0.4"/>
  <path d="M30,22 C29,20 32,19 34,21 C35,22 33,24 31,24 C30,24 30,23 30,22 Z" fill="url(#shellGrad)" stroke="#c06a85" stroke-width="0.4"/>

  <!-- arms -->
  <path d="M22,20 Q16,14 18,9" fill="none" stroke="url(#skinGrad)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M34,20 Q42,26 40,34" fill="none" stroke="url(#skinGrad)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- seashell in hand -->
  <path d="M40,34 C38,32 39,29 42,30 C44,31 44,34 42,35 C41,35.5 40.5,34.5 40,34 Z" fill="url(#shellGrad)" stroke="#c06a85" stroke-width="0.4"/>

  <!-- head -->
  <circle cx="27" cy="16" r="7" fill="url(#skinGrad)" stroke="#c98a5e" stroke-width="0.5"/>
  <path d="M24,15 Q25,14 26,15" fill="none" stroke="#5a3a2a" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M24,19 Q27,21 29,19" fill="none" stroke="#c07a5a" stroke-width="0.6" stroke-linecap="round"/>
</svg>
