<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <radialGradient id="os-stone" cx="35%" cy="25%" r="85%">
    <stop offset="0" stop-color="#a0a0a0"/><stop offset="1" stop-color="#6e6e6e"/>
  </radialGradient>
  <linearGradient id="os-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#d8cfb6"/>
  </linearGradient>
  <linearGradient id="os-roof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5e7c6a"/><stop offset="1" stop-color="#344a3e"/>
  </linearGradient>
  <linearGradient id="os-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffdd66"/><stop offset="1" stop-color="#c8980a"/>
  </linearGradient>
</defs>

<!-- Ground shadow -->
<ellipse cx="40" cy="76" rx="22" ry="4" fill="#00000033"/>

<!-- Stone base (石垣) - irregular stone blocks -->
<rect x="14" y="62" width="52" height="14" rx="1" fill="url(#os-stone)" stroke="#484848" stroke-width="0.5"/>
<!-- Stone block lines -->
<line x1="22" y1="62" x2="22" y2="76" stroke="#555" stroke-width="0.6"/>
<line x1="31" y1="62" x2="31" y2="76" stroke="#555" stroke-width="0.6"/>
<line x1="40" y1="62" x2="40" y2="76" stroke="#555" stroke-width="0.6"/>
<line x1="49" y1="62" x2="49" y2="76" stroke="#555" stroke-width="0.6"/>
<line x1="58" y1="62" x2="58" y2="76" stroke="#555" stroke-width="0.6"/>
<line x1="14" y1="69" x2="66" y2="69" stroke="#555" stroke-width="0.6"/>
<line x1="18" y1="65" x2="18" y2="69" stroke="#454545" stroke-width="0.5"/>
<line x1="27" y1="65" x2="27" y2="69" stroke="#454545" stroke-width="0.5"/>
<line x1="35" y1="65" x2="35" y2="69" stroke="#454545" stroke-width="0.5"/>
<line x1="44" y1="65" x2="44" y2="69" stroke="#454545" stroke-width="0.5"/>
<line x1="53" y1="65" x2="53" y2="69" stroke="#454545" stroke-width="0.5"/>
<line x1="62" y1="65" x2="62" y2="69" stroke="#454545" stroke-width="0.5"/>
<line x1="20" y1="69" x2="20" y2="76" stroke="#454545" stroke-width="0.5"/>
<line x1="29" y1="69" x2="29" y2="76" stroke="#454545" stroke-width="0.5"/>
<line x1="37" y1="69" x2="37" y2="76" stroke="#454545" stroke-width="0.5"/>
<line x1="46" y1="69" x2="46" y2="76" stroke="#454545" stroke-width="0.5"/>
<line x1="55" y1="69" x2="55" y2="76" stroke="#454545" stroke-width="0.5"/>

<!-- Floor 1 - Main tower body -->
<rect x="18" y="52" width="44" height="12" rx="0.5" fill="url(#os-wall)" stroke="#a89a7c" stroke-width="0.5"/>
<!-- Floor 1 roof (飛簷) -->
<polygon points="13,52 40,45 67,52" fill="url(#os-roof)" stroke="#223028" stroke-width="0.5"/>
<!-- Roof ridge curve details -->
<path d="M13,52 Q40,46 67,52" fill="none" stroke="#263a30" stroke-width="0.8"/>
<!-- Eave tips curl up -->
<path d="M13,52 Q11,50 13,48" fill="none" stroke="#2c4238" stroke-width="1.2"/>
<path d="M67,52 Q69,50 67,48" fill="none" stroke="#2c4238" stroke-width="1.2"/>

<!-- Floor 2 -->
<rect x="22" y="41" width="36" height="10" rx="0.5" fill="url(#os-wall)" stroke="#a89a7c" stroke-width="0.5"/>
<!-- Floor 2 roof -->
<polygon points="17,41 40,34 63,41" fill="url(#os-roof)" stroke="#223028" stroke-width="0.5"/>
<path d="M17,41 Q40,35 63,41" fill="none" stroke="#263a30" stroke-width="0.8"/>
<path d="M17,41 Q15,39 17,37" fill="none" stroke="#2c4238" stroke-width="1.2"/>
<path d="M63,41 Q65,39 63,37" fill="none" stroke="#2c4238" stroke-width="1.2"/>

<!-- Floor 3 -->
<rect x="26" y="31" width="28" height="10" rx="0.5" fill="url(#os-wall)" stroke="#a89a7c" stroke-width="0.5"/>
<!-- Floor 3 roof -->
<polygon points="21,31 40,25 59,31" fill="url(#os-roof)" stroke="#223028" stroke-width="0.5"/>
<path d="M21,31 Q40,26 59,31" fill="none" stroke="#263a30" stroke-width="0.8"/>
<path d="M21,31 Q19,29 21,27" fill="none" stroke="#2c4238" stroke-width="1.2"/>
<path d="M59,31 Q61,29 59,27" fill="none" stroke="#2c4238" stroke-width="1.2"/>

<!-- Floor 4 -->
<rect x="30" y="22" width="20" height="10" rx="0.5" fill="url(#os-wall)" stroke="#a89a7c" stroke-width="0.5"/>
<!-- Floor 4 roof -->
<polygon points="26,22 40,17 54,22" fill="url(#os-roof)" stroke="#223028" stroke-width="0.5"/>
<path d="M26,22 Q40,18 54,22" fill="none" stroke="#263a30" stroke-width="0.8"/>
<path d="M26,22 Q24,20 26,18" fill="none" stroke="#2c4238" stroke-width="1.2"/>
<path d="M54,22 Q56,20 54,18" fill="none" stroke="#2c4238" stroke-width="1.2"/>

<!-- Floor 5 (top) -->
<rect x="34" y="14" width="12" height="9" rx="0.5" fill="url(#os-wall)" stroke="#a89a7c" stroke-width="0.5"/>
<!-- Floor 5 roof -->
<polygon points="31,14 40,9 49,14" fill="url(#os-roof)" stroke="#223028" stroke-width="0.5"/>
<path d="M31,14 Q40,10 49,14" fill="none" stroke="#263a30" stroke-width="0.7"/>

<!-- Spire -->
<rect x="38.5" y="5" width="3" height="5" rx="0.5" fill="url(#os-gold)" stroke="#8a6a00" stroke-width="0.5"/>

<!-- Gold Shachihoko (金の鯱) - stylized golden fish ornament -->
<g>
  <!-- Left shachihoko -->
  <ellipse cx="32" cy="14" rx="2.5" ry="1.5" fill="url(#os-gold)" stroke="#8a6a00" stroke-width="0.5"/>
  <path d="M29.5,14 Q30,11 32,12" fill="url(#os-gold)" stroke="#8a6a00" stroke-width="0.5"/>
  <!-- Right shachihoko -->
  <ellipse cx="48" cy="14" rx="2.5" ry="1.5" fill="url(#os-gold)" stroke="#8a6a00" stroke-width="0.5"/>
  <path d="M50.5,14 Q50,11 48,12" fill="url(#os-gold)" stroke="#8a6a00" stroke-width="0.5"/>
  <!-- Golden shimmer animation -->
  <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
</g>

<!-- Windows on floor 1 -->
<rect x="23" y="55" width="4" height="5" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.6"/>
<rect x="30" y="55" width="4" height="5" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.6"/>
<rect x="38" y="55" width="4" height="5" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.6"/>
<rect x="46" y="55" width="4" height="5" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.6"/>
<rect x="53" y="55" width="4" height="5" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.6"/>

<!-- Windows on floor 2 -->
<rect x="27" y="44" width="3.5" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>
<rect x="34" y="44" width="3.5" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>
<rect x="42.5" y="44" width="3.5" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>
<rect x="49" y="44" width="3.5" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>

<!-- Windows on floor 3 -->
<rect x="31" y="34" width="3" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>
<rect x="37" y="34" width="3" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>
<rect x="43" y="34" width="3" height="4" rx="0.5" fill="#8bb4d0" stroke="#4a6a80" stroke-width="0.5"/>

<!-- Front gate / entrance -->
<rect x="36" y="57" width="8" height="7" rx="0.5" fill="#6a4020" stroke="#3c2410" stroke-width="0.5"/>
<rect x="37.5" y="58" width="2" height="6" fill="#4a2810"/>
<rect x="40.5" y="58" width="2" height="6" fill="#4a2810"/>

</svg>
