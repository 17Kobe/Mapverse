<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#2f5a3a"/><stop offset="1" stop-color="#1c3a28"/></linearGradient>
    <linearGradient id="mp" x1="0" x2="1"><stop offset="0" stop-color="#8a96a6"/><stop offset="1" stop-color="#4a5666"/></linearGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7aa0"/><stop offset="1" stop-color="#1c4a68"/></linearGradient>
  </defs>
  <!-- 紐西蘭峽灣國家公園：米爾福德峽灣，三角形的米特峰、陡峭的雨林岩壁與細長的瀑布，一艘遊船駛過 -->
  <rect x="0" y="0" width="128" height="128" fill="none"/>
  <path d="M36 84 L62 18 L86 84Z" fill="url(#mp)"/>
  <path d="M62 18 L68 34 L62 30 L56 36Z" fill="#fff"/>
  <path d="M0 84 L0 30 L24 24 L40 56 L44 84Z" fill="url(#wl)"/>
  <path d="M128 84 L128 38 L104 30 L88 60 L84 84Z" fill="url(#wl)"/>
  <!-- 瀑布 -->
  <path d="M22 30 Q20 56 22 84" stroke="#fff" stroke-width="2.2" fill="none" opacity=".9"><animate attributeName="opacity" values=".9;.5;.9" dur="2.2s" repeatCount="indefinite"/></path>
  <path d="M106 36 Q108 60 104 84" stroke="#fff" stroke-width="2.6" fill="none" opacity=".9"><animate attributeName="opacity" values=".6;.9;.6" dur="2.6s" repeatCount="indefinite"/></path>
  <!-- 雲 -->
  <g fill="#fff" opacity=".8"><ellipse cx="40" cy="44" rx="16" ry="4"><animate attributeName="cx" values="34;48;34" dur="9s" repeatCount="indefinite"/></ellipse></g>
  <!-- 水面與倒影 -->
  <path d="M0 84 H128 V128 H0Z" fill="url(#sn)"/>
  <g opacity=".3"><path d="M36 86 L62 118 L86 86Z" fill="#cfe0ee"/></g>
  <path d="M0 96 Q16 94 32 96 T64 96 T96 96 T128 96 M0 108 Q16 106 32 108 T64 108 T96 108 T128 108" stroke="#cfeaf8" stroke-width="1.2" fill="none" opacity=".6"/>
  <!-- 遊船 -->
  <g><animateTransform attributeName="transform" type="translate" values="-8 0;10 0;-8 0" dur="9s" repeatCount="indefinite"/>
    <path d="M50 100 L84 100 L80 108 L54 108Z" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1"/><rect x="58" y="92" width="18" height="8" fill="#e0342f"/><rect x="62" y="86" width="9" height="6" fill="#f4f4f4"/>
    <path d="M44 110 Q56 108 68 110 M70 110 Q82 108 94 110" stroke="#fff" stroke-width="1.4" fill="none" opacity=".8"/></g>
</svg>
