<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="lsCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9ab8e"/>
      <stop offset="100%" stop-color="#7a6c52"/>
    </linearGradient>
    <linearGradient id="lsStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7c9a3"/>
      <stop offset="45%" stop-color="#b5a177"/>
      <stop offset="100%" stop-color="#8a7650"/>
    </linearGradient>
    <linearGradient id="lsRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0d8"/>
      <stop offset="100%" stop-color="#4f8f85"/>
    </linearGradient>
    <radialGradient id="lsHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6cf" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- river at the base -->
  <path d="M0,80 L0,70 Q40,64 80,70 L80,80 Z" fill="url(#lsRiver)" stroke="#2c6a62" stroke-width="0.5"/>

  <!-- cliff the buddha is carved into -->
  <path d="M4,72 L4,10 L76,10 L76,72 Q40,78 4,72 Z" fill="url(#lsCliff)" stroke="#5a4d38" stroke-width="0.6"/>
  <g stroke="#6a5c42" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M10,12 L8,70"/>
    <path d="M70,12 L72,70"/>
  </g>

  <!-- soft halo glow behind the head -->
  <circle cx="40" cy="23" r="12" fill="url(#lsHalo)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 盤坐的雙腿（蓮花座姿）：寬平的底座，是「坐姿」最重要的識別線索 -->
  <path d="M16,72 Q14,66 20,62 Q28,58 40,58 Q52,58 60,62 Q66,66 64,72 Q40,77 16,72 Z"
        fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.6"/>
  <path d="M22,68 Q40,72 58,68" fill="none" stroke="#5f512f" stroke-width="0.5" opacity="0.5"/>
  <path d="M26,64 Q40,61 54,64" fill="none" stroke="#5f512f" stroke-width="0.5" opacity="0.5"/>

  <!-- 疊放在腿上的雙手（禪定印），取代原本分開放在膝蓋的手 -->
  <ellipse cx="40" cy="60.5" rx="6.5" ry="3.6" fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.5"/>
  <ellipse cx="40" cy="58.5" rx="5.2" ry="2.8" fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.4" opacity="0.9"/>

  <!-- 上身：肩膀略寬、往頸部收窄 -->
  <path d="M24,60 Q21,48 26,38 Q22,34 24,26 Q28,16 40,14 Q52,16 56,26 Q58,34 54,38 Q59,48 56,60 Q40,64 24,60 Z"
        fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.6"/>
  <!-- head -->
  <ellipse cx="40" cy="22" rx="10.5" ry="11.5" fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.6"/>
  <!-- 肉髻（頭頂凸起），大佛的另一個識別特徵 -->
  <ellipse cx="40" cy="10.5" rx="4.2" ry="3.4" fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.5"/>
  <!-- 招牌：垂肩長耳垂，是樂山大佛最醒目的識別特徵 -->
  <path d="M29.5,18 Q24,24 25,34 Q25.5,42 30,45 Q31.5,38 30.5,30 Q30,23 32,19 Z" fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.6"/>
  <path d="M50.5,18 Q56,24 55,34 Q54.5,42 50,45 Q48.5,38 49.5,30 Q50,23 48,19 Z" fill="url(#lsStone)" stroke="#5f512f" stroke-width="0.6"/>
  <!-- hair curls texture -->
  <g fill="#6c5c3c" opacity="0.6">
    <circle cx="34" cy="13" r="1"/><circle cx="38" cy="11.5" r="1"/><circle cx="42" cy="11.5" r="1"/><circle cx="46" cy="13" r="1"/>
    <circle cx="31" cy="16" r="1"/><circle cx="49" cy="16" r="1"/>
  </g>
  <!-- serene half-closed meditating eyes -->
  <path d="M34,25 Q36,27 38,25" fill="none" stroke="#4a3f28" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M42,25 Q44,27 46,25" fill="none" stroke="#4a3f28" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M36,30 Q40,33 44,30" fill="none" stroke="#4a3f28" stroke-width="1" stroke-linecap="round"/>
  <!-- shoulders / draped robe folds -->
  <path d="M26,46 Q40,41 54,46" fill="none" stroke="#5f512f" stroke-width="0.6" opacity="0.6"/>
  <path d="M25,54 Q40,50 55,54" fill="none" stroke="#5f512f" stroke-width="0.6" opacity="0.5"/>

  <!-- tiny sightseeing boats on the river for scale -->
  <path d="M8,74 q4,-2 8,0 l-1,2 l-6,0 Z" fill="#2c3a40" opacity="0.7"/>
  <path d="M64,76 q4,-2 8,0 l-1,2 l-6,0 Z" fill="#2c3a40" opacity="0.7"/>
</svg>
