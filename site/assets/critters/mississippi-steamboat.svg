<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="msHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f1e6"/>
      <stop offset="100%" stop-color="#c9bfa2"/>
    </linearGradient>
    <linearGradient id="msDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#5c3a1e"/>
    </linearGradient>
    <linearGradient id="msWheelHouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8cfc0"/>
    </linearGradient>
    <linearGradient id="msWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdbd88"/>
      <stop offset="100%" stop-color="#7a6a3f"/>
    </linearGradient>
    <linearGradient id="msWheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#43280f"/>
    </linearGradient>
  </defs>

  <!-- muddy river water -->
  <path d="M0,80 L0,68 Q40,62 80,68 L80,80 Z" fill="url(#msWater)"/>
  <g stroke="#e8dcb0" stroke-width="0.6" fill="none" opacity="0.4">
    <path d="M4,73 Q14,71 24,73"/>
    <path d="M48,75 Q58,73 68,75"/>
  </g>

  <!-- gentle bob of the whole steamboat -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,0" dur="3s" repeatCount="indefinite"/>

    <!-- white hull -->
    <path d="M6,66 Q4,70 8,72 L58,72 Q64,70 62,66 L60,60 L8,60 Z" fill="url(#msHull)" stroke="#9c9178" stroke-width="0.5"/>
    <g stroke="#9c9178" stroke-width="0.4" opacity="0.6">
      <line x1="16" y1="62" x2="16" y2="70"/>
      <line x1="28" y1="62" x2="28" y2="70"/>
      <line x1="40" y1="62" x2="40" y2="70"/>
      <line x1="52" y1="62" x2="52" y2="70"/>
    </g>

    <!-- lower deck with ornate rail -->
    <path d="M8,60 L60,60 L60,52 L8,52 Z" fill="url(#msDeck)" stroke="#3a240f" stroke-width="0.5"/>
    <g stroke="#f5f1e6" stroke-width="0.6" opacity="0.8">
      <line x1="10" y1="52" x2="10" y2="47"/>
      <line x1="16" y1="52" x2="16" y2="47"/>
      <line x1="22" y1="52" x2="22" y2="47"/>
      <line x1="28" y1="52" x2="28" y2="47"/>
      <line x1="34" y1="52" x2="34" y2="47"/>
      <line x1="40" y1="52" x2="40" y2="47"/>
      <line x1="46" y1="52" x2="46" y2="47"/>
      <line x1="52" y1="52" x2="52" y2="47"/>
      <line x1="9" y1="47" x2="53" y2="47"/>
    </g>

    <!-- upper deck / pilot house -->
    <path d="M14,47 L48,47 L48,38 L14,38 Z" fill="url(#msHull)" stroke="#9c9178" stroke-width="0.5"/>
    <path d="M22,38 L40,38 L40,28 L22,28 Z" fill="url(#msWheelHouse)" stroke="#9c9178" stroke-width="0.5"/>
    <path d="M20,28 L42,28 L39,24 L23,24 Z" fill="#8a5a34" stroke="#5c3a1e" stroke-width="0.4"/>

    <!-- twin tall smokestacks -->
    <rect x="18" y="12" width="3.4" height="18" rx="1" fill="#2a2a2a"/>
    <rect x="43" y="12" width="3.4" height="18" rx="1" fill="#2a2a2a"/>
    <rect x="17.6" y="10" width="4.2" height="2.4" fill="#e23b2f"/>
    <rect x="42.6" y="10" width="4.2" height="2.4" fill="#e23b2f"/>

    <!-- puffing smoke -->
    <circle cx="20" cy="9" r="2" fill="#bdbdbd" opacity="0.7">
      <animate attributeName="cy" values="9;-6" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.6;5" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="9" r="1.8" fill="#bdbdbd" opacity="0.7">
      <animate attributeName="cy" values="9;-8" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.4;4.6" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- big red paddlewheel at the stern, turning -->
    <g transform="translate(62,62)">
      <circle r="11" fill="none" stroke="#9c1e1e" stroke-width="2.4"/>
      <g stroke="#9c1e1e" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.2s" repeatCount="indefinite"/>
        <line x1="-11" y1="0" x2="11" y2="0"/>
        <line x1="0" y1="-11" x2="0" y2="11"/>
        <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/>
        <line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8"/>
      </g>
      <circle r="2.4" fill="url(#msWheel)"/>
    </g>
  </g>

  <!-- paddlewheel splash -->
  <ellipse cx="62" cy="72" rx="8" ry="2.6" fill="#fff" opacity="0.5">
    <animate attributeName="rx" values="6;11;6" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.1s" repeatCount="indefinite"/>
  </ellipse>
</svg>
