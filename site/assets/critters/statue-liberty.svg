<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<!-- 自由女神像卡通圖示 — 無背景，白色描邊，融入地景 -->

<!-- 底部三層基座 -->
<rect x="28" y="66" width="24" height="4" rx="1" fill="#a0a0b0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="30" y="62" width="20" height="4" rx="1" fill="#b0b0c0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="33" y="58" width="14" height="4" rx="1" fill="#c0c0d0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>

<!-- 長袍主體 -->
<path d="M34 56 L31 58 L30 62 L34 62 L34 56Z" fill="#7eb0a0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M46 56 L49 58 L50 62 L46 62 L46 56Z" fill="#7eb0a0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="31" y="42" width="18" height="16" rx="2" fill="#7eb0a0" stroke="white" stroke-width="1.5"/>
<!-- 衣褶線條 -->
<line x1="35" y1="44" x2="34" y2="57" stroke="#5a8878" stroke-width="1" opacity="0.8"/>
<line x1="40" y1="43" x2="40" y2="58" stroke="#5a8878" stroke-width="1" opacity="0.8"/>
<line x1="45" y1="44" x2="46" y2="57" stroke="#5a8878" stroke-width="1" opacity="0.8"/>

<!-- 頸部 -->
<rect x="37" y="36" width="6" height="7" rx="1" fill="#7eb0a0" stroke="white" stroke-width="1.5"/>

<!-- 頭部 -->
<ellipse cx="40" cy="32" rx="6" ry="7" fill="#7eb0a0" stroke="white" stroke-width="1.5"/>

<!-- 放射冠：7個尖刺，從頭頂放射 -->
<polygon points="40,17 38.5,24 41.5,24" fill="#f0c040" stroke="white" stroke-width="1.2"/>
<polygon points="44.5,18.5 41.5,24.5 44,26" fill="#f0c040" stroke="white" stroke-width="1.2"/>
<polygon points="35.5,18.5 38.5,24.5 36,26" fill="#f0c040" stroke="white" stroke-width="1.2"/>
<polygon points="47.5,21.5 43,26.5 45.5,27.5" fill="#f0c040" stroke="white" stroke-width="1.2"/>
<polygon points="32.5,21.5 37,26.5 34.5,27.5" fill="#f0c040" stroke="white" stroke-width="1.2"/>
<polygon points="49,25.5 44,29 46,30.5" fill="#f0c040" stroke="white" stroke-width="1.2"/>
<polygon points="31,25.5 36,29 34,30.5" fill="#f0c040" stroke="white" stroke-width="1.2"/>

<!-- 臉部細節 -->
<ellipse cx="37.5" cy="32" rx="0.8" ry="1" fill="#5a8878"/>
<ellipse cx="42.5" cy="32" rx="0.8" ry="1" fill="#5a8878"/>
<path d="M38 34.5 Q40 36 42 34.5" stroke="#5a8878" stroke-width="0.8" fill="none"/>

<!-- 右臂舉起（圖示右側，視角左側）—— 舉火炬 -->
<path d="M49 42 L54 34 L56 35 L51 43Z" fill="#7eb0a0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>

<!-- 火炬握柄 -->
<rect x="53" y="23" width="4" height="12" rx="1.5" fill="#c8963c" stroke="white" stroke-width="1.5"/>

<!-- 火焰 -->
<ellipse cx="55" cy="21" rx="3" ry="4" fill="#ff8c00" stroke="white" stroke-width="1.2"/>
<ellipse cx="55" cy="20" rx="2" ry="3" fill="#ffcc00" stroke="none"/>
<ellipse cx="55" cy="19.5" rx="1" ry="1.5" fill="#fff8e0" stroke="none"/>

<!-- 左臂（平持石板） -->
<path d="M31 44 L24 46 L23 48 L32 47Z" fill="#7eb0a0" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
<!-- 石板 -->
<rect x="18" y="43" width="9" height="6" rx="1" fill="#9eb8b0" stroke="white" stroke-width="1.3" transform="rotate(-10 22 46)"/>
</svg>