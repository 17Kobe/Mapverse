<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="chamBody" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#8ed15c"/>
    <stop offset="100%" stop-color="#4a8f2e"/>
  </linearGradient>
</defs>

<!-- 樹枝 -->
<rect x="-5" y="58" width="90" height="9" rx="4.5" fill="#5c3a21" stroke="white" stroke-width="1.5" transform="rotate(-3 40 62)"/>

<!-- 捲曲尾巴 -->
<path d="M53,46 C64,52 72,46 71,35 C70,26 60,22 54,27 C50,30 52,35 56,34 C58,33 58,30 55,31 L52,35 C48,39 47,43 53,46 Z"
      fill="url(#chamBody)" stroke="white" stroke-width="1.5"/>

<!-- 後腿 -->
<path d="M50,48 C52,53 54,57 59,59 C54,61 49,59 47,54 C45,51 46,48 50,48 Z"
      fill="url(#chamBody)" stroke="white" stroke-width="1.5"/>
<!-- 前腿 -->
<path d="M28,48 C26,53 24,57 19,59 C24,61 29,59 31,54 C33,51 32,48 28,48 Z"
      fill="url(#chamBody)" stroke="white" stroke-width="1.5"/>

<!-- 身體 -->
<ellipse cx="42" cy="40" rx="15" ry="13" fill="url(#chamBody)" stroke="white" stroke-width="1.6"/>

<!-- 黃色斑點 -->
<ellipse cx="38" cy="35" rx="3" ry="2.2" fill="#f4e04d" stroke="white" stroke-width="1"/>
<ellipse cx="47" cy="40" rx="2.6" ry="2" fill="#f4e04d" stroke="white" stroke-width="1"/>
<ellipse cx="40" cy="47" rx="2.2" ry="1.8" fill="#f4e04d" stroke="white" stroke-width="1"/>
<ellipse cx="50" cy="33" rx="2" ry="1.6" fill="#f4e04d" stroke="white" stroke-width="1"/>

<!-- 頭 -->
<circle cx="20" cy="30" r="10" fill="url(#chamBody)" stroke="white" stroke-width="1.6"/>

<!-- 頭頂角狀突起 -->
<path d="M14,20 Q19,7 25,20 Z" fill="#4a8f2e" stroke="white" stroke-width="1.4"/>

<!-- 嘴巴 -->
<path d="M9,32 Q12,35 15,33" fill="none" stroke="#2e5c1f" stroke-width="1.3" stroke-linecap="round"/>

<!-- 眼睛（突出大眼，可朝不同方向看） -->
<circle cx="16" cy="27" r="5.5" fill="#ffffff" stroke="white" stroke-width="1.5"/>
<circle cx="17" cy="27" r="2.8" fill="#1a1a1a">
  <animate attributeName="cx" values="17;19;15;17" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="27;25;29;27" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- 舌頭（伸縮抓蟲動畫） -->
<line x1="9" y1="32" x2="9" y2="32" stroke="#ff6f91" stroke-width="2.5" stroke-linecap="round">
  <animate attributeName="x2" values="9;0;0;9;9" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="32;27;27;32;32" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
</line>
<circle cx="9" cy="32" r="2.2" fill="#ff4d73" stroke="white" stroke-width="1">
  <animate attributeName="cx" values="9;0;0;9;9" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="32;27;27;32;32" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- 被抓的小蟲 -->
<g>
  <ellipse cx="3" cy="28" rx="2.2" ry="1.5" fill="#3a2a1a" stroke="white" stroke-width="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <line x1="2" y1="27" x2="0" y2="25" stroke="#3a2a1a" stroke-width="0.8">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="4" y1="27" x2="6" y2="25" stroke="#3a2a1a" stroke-width="0.8">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
  </line>
</g>

</svg>