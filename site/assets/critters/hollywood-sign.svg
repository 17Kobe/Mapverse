<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffd79a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffb86b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#cfa968"/>
      <stop offset="55%" stop-color="#ab8148"/>
      <stop offset="100%" stop-color="#7c5a33"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#9c7640"/>
      <stop offset="100%" stop-color="#5e3f22"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#eceae4"/>
      <stop offset="100%" stop-color="#c9c6bd"/>
    </linearGradient>
  </defs>

  <circle cx="54" cy="14" r="26" fill="url(#skyGlow)"/>

  <!-- back hill -->
  <path d="M0,58 C10,50 25,45 40,47 C55,49 65,45 80,49 L80,80 L0,80 Z" fill="url(#hillGrad1)" stroke="#6b4a29" stroke-width="0.4"/>

  <!-- scrub vegetation on back hill -->
  <g fill="#4e5a2e" opacity="0.85">
    <ellipse cx="9" cy="55" rx="2.6" ry="1.3"/>
    <ellipse cx="19" cy="51" rx="2.2" ry="1.1"/>
    <ellipse cx="61" cy="49" rx="2.4" ry="1.2"/>
    <ellipse cx="72" cy="53" rx="2.8" ry="1.3"/>
    <ellipse cx="33" cy="52" rx="1.8" ry="0.9"/>
  </g>

  <!-- support struts for the sign -->
  <g stroke="#cbc8c0" stroke-width="0.8" opacity="0.9">
    <line x1="14" y1="42" x2="14.5" y2="49"/>
    <line x1="21" y1="42" x2="21.6" y2="49"/>
    <line x1="28" y1="42" x2="28.4" y2="48"/>
    <line x1="35" y1="42" x2="35.2" y2="47"/>
    <line x1="42" y1="42" x2="42" y2="47"/>
    <line x1="49" y1="42" x2="48.8" y2="47"/>
    <line x1="56" y1="42" x2="55.6" y2="48"/>
    <line x1="63" y1="42" x2="62.4" y2="49"/>
    <line x1="69" y1="42" x2="68" y2="49"/>
  </g>

  <!-- HOLLYWOOD sign block letters -->
  <text x="40.6" y="40.9" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="9.4" letter-spacing="0.6" text-anchor="middle" fill="#4a463e" opacity="0.55">HOLLYWOOD</text>
  <text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="9.4" letter-spacing="0.6" text-anchor="middle" fill="url(#letterGrad)" stroke="#71695b" stroke-width="0.35">HOLLYWOOD</text>

  <!-- glint sweeping across the letters -->
  <circle cy="38" r="1.6" fill="#ffffff">
    <animate attributeName="cx" values="11;69;11" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- bird flying past -->
  <g stroke="#2e2a24" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M-3,0 Q-1.4,-2.4 0,0 Q1.4,-2.4 3,0">
      <animateTransform attributeName="transform" type="translate" values="2,18;30,10;58,20" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- front hill (foreground, closer to viewer) -->
  <path d="M0,68 C18,62 34,65 48,61 C63,57 74,63 80,65 L80,80 L0,80 Z" fill="url(#hillGrad2)" stroke="#452f1a" stroke-width="0.4"/>

  <!-- scrub vegetation on front hill -->
  <g fill="#3c4a24" opacity="0.9">
    <ellipse cx="12" cy="70" rx="3.2" ry="1.6"/>
    <ellipse cx="26" cy="67" rx="2.6" ry="1.3"/>
    <ellipse cx="46" cy="64" rx="2.4" ry="1.2"/>
    <ellipse cx="59" cy="60" rx="2" ry="1"/>
    <ellipse cx="70" cy="66" rx="3" ry="1.5"/>
    <ellipse cx="7" cy="76" rx="2.4" ry="1.2"/>
    <ellipse cx="37" cy="74" rx="2.8" ry="1.3"/>
    <ellipse cx="64" cy="75" rx="3" ry="1.4"/>
  </g>
</svg>
