<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset="0.6" stop-color="#4a2c16"/>
      <stop offset="1" stop-color="#2e1b0d"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c7a52"/>
      <stop offset="0.55" stop-color="#47532f"/>
      <stop offset="1" stop-color="#262f17"/>
    </linearGradient>
    <linearGradient id="spikeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a48"/>
      <stop offset="1" stop-color="#121210"/>
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#7a2a1c"/>
      <stop offset="1" stop-color="#d98a3d"/>
    </linearGradient>
    <radialGradient id="waterGrad" cx="0.5" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#6fb6dd"/>
      <stop offset="1" stop-color="#145a82"/>
    </radialGradient>
  </defs>

  <!-- water -->
  <ellipse cx="41" cy="75" rx="39" ry="9" fill="url(#waterGrad)"/>
  <ellipse cx="41" cy="75" rx="30" ry="5.5" fill="#1c5e86" opacity="0.4"/>

  <g stroke="#dff2fb" stroke-width="0.8" fill="none">
    <ellipse cx="20" cy="76" rx="9" ry="2.2" opacity="0.55">
      <animate attributeName="rx" values="7;11;7" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="46" cy="78" rx="11" ry="2.4" opacity="0.5">
      <animate attributeName="rx" values="9;14;9" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.08;0.5" dur="3.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="65" cy="75.5" rx="7" ry="1.8" opacity="0.5">
      <animate attributeName="rx" values="5;9;5" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.08;0.5" dur="2.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- oars -->
  <g stroke="#3a2614" stroke-width="2" stroke-linecap="round">
    <line x1="14" y1="63" x2="3" y2="72">
      <animateTransform attributeName="transform" type="rotate" values="-6 14 63; 8 14 63; -6 14 63" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="68" y1="64" x2="78" y2="73">
      <animateTransform attributeName="transform" type="rotate" values="6 68 64; -8 68 64; 6 68 64" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- hull -->
  <path d="M9,51 Q5,62 11,73 Q22,79 41,79 Q60,79 71,73 Q77,62 73,51 Q58,56 41,56 Q24,56 9,51 Z"
        fill="url(#hullGrad)" stroke="#20120a" stroke-width="0.6"/>
  <path d="M12,54 Q41,60 70,54" fill="none" stroke="#26150b" stroke-width="1" opacity="0.6"/>

  <!-- shell dome -->
  <path d="M15,51 Q13,26 41,19 Q69,26 67,51 Q54,57 41,57 Q28,57 15,51 Z"
        fill="url(#shellGrad)" stroke="#161f0f" stroke-width="0.6"/>

  <!-- shell scute lines -->
  <g fill="none" stroke="#1d2614" stroke-width="0.6" opacity="0.7">
    <path d="M20,47 Q41,53 62,47"/>
    <path d="M18,38 Q41,45 64,38"/>
    <path d="M22,29 Q41,35 60,29"/>
    <path d="M30,22 L30,50"/>
    <path d="M52,22 L52,50"/>
    <path d="M41,20 L41,56"/>
  </g>

  <!-- iron spikes -->
  <g fill="url(#spikeGrad)" stroke="#060606" stroke-width="0.3">
    <path d="M23,41 L26,33 L29,41 Z"/>
    <path d="M31,31 L34,23 L37,31 Z"/>
    <path d="M38,26 L41,18 L44,26 Z"/>
    <path d="M45,25 L48,19 L51,26 Z"/>
    <path d="M52,29 L55,22 L58,30 Z"/>
    <path d="M58,36 L61,29 L63,37 Z"/>
    <path d="M18,48 L21,41 L24,48 Z"/>
    <path d="M62,44 L65,38 L67,47 Z"/>
  </g>

  <!-- dragon head bow -->
  <path d="M22,43 C15,38 7,37 2,43 C0,46 1,49 4,50 C1,52 1,55 4,58 C9,61 16,59 22,55 Z"
        fill="url(#dragonGrad)" stroke="#4a1810" stroke-width="0.5"/>
  <path d="M4,50 C8,52 13,52 18,50" fill="none" stroke="#4a1810" stroke-width="0.6" opacity="0.7"/>
  <path d="M3,44 L0,47 L3,49 Z" fill="#f2e6c8" stroke="#4a1810" stroke-width="0.3"/>
  <circle cx="13" cy="44" r="2" fill="#ffd84d"/>
  <circle cx="12.6" cy="44" r="0.9" fill="#231007"/>
  <path d="M15,37 L17,31 L19,38 Z" fill="url(#spikeGrad)" stroke="#060606" stroke-width="0.3"/>

  <!-- subtle hull waterline shimmer -->
  <path d="M9,51 Q5,62 11,73" fill="none" stroke="#8a5a2e" stroke-width="0.6" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
