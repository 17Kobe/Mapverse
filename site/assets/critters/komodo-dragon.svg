<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8368"/>
      <stop offset="1" stop-color="#564d3e"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7260"/>
      <stop offset="1" stop-color="#4c4335"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <ellipse cx="40" cy="66" rx="34" ry="3.5" fill="#c9a86a" opacity="0.35"/>

  <!-- tail (gentle sway) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 22 50;4 22 50;-3 22 50" dur="4.5s" repeatCount="indefinite"/>
    <path d="M22,47 C15,46 9,47 5,49.5 C3,50.7 3,52 4.5,52.6 C9,54 15,53 21,51.5 C23.5,50.5 24,48.5 22,47 Z"
          fill="url(#bodyGrad)" stroke="#352d22" stroke-width="0.6"/>
    <ellipse cx="14" cy="49.5" rx="2" ry="1" fill="#423a2d" opacity="0.4" transform="rotate(-8 14 49.5)"/>
    <ellipse cx="9" cy="51.5" rx="1.6" ry="0.8" fill="#423a2d" opacity="0.4" transform="rotate(-4 9 51.5)"/>
  </g>

  <!-- hind leg -->
  <path d="M23,48 C21,52 21,57 22,61 C22.5,64 26,65 29,63.5 C31,62 30.5,58 29.5,54 C29,50.5 27,47.5 23,48 Z"
        fill="url(#legGrad)" stroke="#352d22" stroke-width="0.6"/>
  <ellipse cx="27" cy="55.5" rx="1.7" ry="0.9" fill="#403727" opacity="0.4"/>
  <path d="M22,63 L20.5,65 M25,64 L24.5,66.2 M28,63.5 L28.5,65.8" stroke="#2c2519" stroke-width="0.8" stroke-linecap="round" fill="none"/>

  <!-- torso -->
  <path d="M20,50 C17,40 24,30 38,27 C48,25 56,28 60,34 C62,37 61,42 56,46 C48,51 32,53 22,52 Z"
        fill="url(#bodyGrad)" stroke="#352d22" stroke-width="0.65"/>
  <path d="M22,52 C30,54 46,54 56,50 C52,55 36,57 24,56 Z" fill="#3b3326" opacity="0.25"/>

  <!-- dorsal ridge highlight -->
  <path d="M24,33 C32,28 44,26 54,29" fill="none" stroke="#a89a7c" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>

  <!-- torso texture mottling -->
  <ellipse cx="32" cy="34" rx="3" ry="1.4" fill="#413a2d" opacity="0.35" transform="rotate(-10 32 34)"/>
  <ellipse cx="44" cy="30.5" rx="2.6" ry="1.2" fill="#413a2d" opacity="0.3" transform="rotate(6 44 30.5)"/>
  <ellipse cx="50" cy="40" rx="2.2" ry="1" fill="#413a2d" opacity="0.3" transform="rotate(-5 50 40)"/>
  <ellipse cx="38" cy="44" rx="2.4" ry="1.1" fill="#6c6150" opacity="0.3" transform="rotate(3 38 44)"/>

  <!-- front leg -->
  <path d="M50,47 C48,51 48,56 49,61 C49.5,64 53,65 56,63.5 C58,62 57.5,58 56.5,54 C56,50.5 54,47.5 50,47 Z"
        fill="url(#legGrad)" stroke="#352d22" stroke-width="0.6"/>
  <ellipse cx="54" cy="55" rx="1.7" ry="0.9" fill="#403727" opacity="0.4"/>
  <path d="M49,61.5 L47.5,64 M52.5,63 L52,65.3 M55.5,62 L56.3,64.4" stroke="#2c2519" stroke-width="0.8" stroke-linecap="round" fill="none"/>

  <!-- head -->
  <path d="M49,37 C55,31 64,30 69,34 C72,37 71,41 67,44 C61,47 54,47 49,44 C46,42 46,39 49,37 Z"
        fill="url(#bodyGrad)" stroke="#352d22" stroke-width="0.6"/>
  <ellipse cx="62" cy="37" rx="1.8" ry="0.9" fill="#413a2d" opacity="0.3"/>
  <ellipse cx="54" cy="40.5" rx="1.6" ry="0.8" fill="#413a2d" opacity="0.3"/>

  <!-- mouth line -->
  <path d="M51,42 C58,45 65,45 70,41" fill="none" stroke="#352d22" stroke-width="0.8" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="58" cy="35" r="2.3" fill="#1c1712"/>
  <circle cx="57.3" cy="34.2" r="0.5" fill="#cbc0a4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8;0.8;0.8" keyTimes="0;0.04;0.08;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- nostril -->
  <ellipse cx="67" cy="35" rx="0.8" ry="0.5" fill="#2a2318"/>

  <!-- tongue flick -->
  <g transform="translate(70,41)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0;0.55;0.65;0.78;0.88;1" dur="3.2s" repeatCount="indefinite"/>
      <path d="M0,0 L6,0.5 M6,0.5 L9.5,-1.3 M6,0.5 L9.5,2.3" fill="none" stroke="#7a2230" stroke-width="0.9" stroke-linecap="round"/>
    </g>
  </g>
</svg>
