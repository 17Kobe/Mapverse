<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa6b4"/><stop offset=".55" stop-color="#667384"/><stop offset="1" stop-color="#3f4a58"/></linearGradient>
    <linearGradient id="wk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- 水面下的黑影（身體） -->
  <ellipse cx="68" cy="112" rx="50" ry="8" fill="#12304d" opacity=".4"/>
  <!-- 背鰭後面拖出的 V 形水痕 -->
  <path d="M58 110 L124 98" stroke="url(#wk)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M58 112 L124 124" stroke="url(#wk)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 尾鰭尖端 -->
  <path d="M100 111 L110 90 C112 98 118 105 124 111 Z" fill="url(#fin)"/>
  <!-- 背鰭：前緣微凸、後緣凹，尖端往後傾 -->
  <path d="M26 111 C38 90 50 58 62 28 C64 62 78 92 92 111 Z" fill="url(#fin)"/>
  <path d="M30 108 C42 86 52 60 61 34" stroke="#c9d2dc" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- 鰭根部的白色浪花 -->
  <ellipse cx="59" cy="111" rx="38" ry="4.2" fill="#fff" opacity=".78"/>
  <ellipse cx="36" cy="111" rx="9" ry="3" fill="#fff" opacity=".9"/>
</svg>
