<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="wrSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d6a8"/><stop offset="100%" stop-color="#c9ab6e"/>
    </linearGradient>
    <linearGradient id="wrWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ead2"/><stop offset="100%" stop-color="#d6c296"/>
    </linearGradient>
    <linearGradient id="wrWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a97847"/><stop offset="100%" stop-color="#6e4726"/>
    </linearGradient>
  </defs>

  <!-- 北卡羅萊納小鷹鎮沙丘，萊特飛行者一號起飛的地方 -->
  <path d="M0,74 Q20,66 40,72 Q60,76 80,70 L80,80 L0,80 Z" fill="url(#wrSand)" stroke="#a9875a" stroke-width="0.4"/>

  <!-- 機身骨架與尾翼 -->
  <path d="M8,56 L62,52" stroke="url(#wrWood)" stroke-width="2" stroke-linecap="round"/>
  <path d="M60,46 L70,44 L70,50 L62,52 Z" fill="url(#wrWing)" stroke="#8a6a3c" stroke-width="0.5"/>
  <path d="M60,52 L70,50 L70,56 L62,56 Z" fill="url(#wrWing)" stroke="#8a6a3c" stroke-width="0.5"/>

  <!-- 雙層主機翼（上下兩片，木製支柱相連，萊特飛行者的招牌造型） -->
  <path d="M10,46 L50,42 L50,48 L10,52 Z" fill="url(#wrWing)" stroke="#8a6a3c" stroke-width="0.6"/>
  <path d="M10,58 L50,54 L50,60 L10,64 Z" fill="url(#wrWing)" stroke="#8a6a3c" stroke-width="0.6"/>
  <g stroke="url(#wrWood)" stroke-width="1.6" stroke-linecap="round">
    <line x1="14" y1="49" x2="14" y2="61"/>
    <line x1="24" y1="47.5" x2="24" y2="59.5"/>
    <line x1="34" y1="46" x2="34" y2="58"/>
    <line x1="44" y1="44.5" x2="44" y2="56.5"/>
  </g>

  <!-- 滑橇式起落架，貼地支撐 -->
  <path d="M16,64 L16,72 M44,60 L44,72" stroke="url(#wrWood)" stroke-width="1.4"/>
  <path d="M10,73 L50,70" stroke="url(#wrWood)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 螺旋槳與引擎，轉動動畫 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 7 54;360 7 54" dur="0.6s" repeatCount="indefinite"/>
    <line x1="7" y1="47" x2="7" y2="61" stroke="#3a2a18" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <circle cx="7" cy="54" r="2" fill="#3a2a18"/>

  <!-- 駕駛員俯臥操控，貼在下翼上 -->
  <ellipse cx="22" cy="57" rx="7" ry="2.6" fill="#2a2a2a" opacity="0.85"/>
  <circle cx="16" cy="56.5" r="2.2" fill="#caa06a" stroke="#8a6a3c" stroke-width="0.3"/>

  <!-- 風中揚起的沙塵 -->
  <g stroke="#e8d6a8" stroke-width="0.6" opacity="0.5" fill="none">
    <path d="M2,70 Q6,68 10,70">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
