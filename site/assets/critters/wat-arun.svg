    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
  </path>
  <path d="M20,75 h18" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.7">
