  <path d="M46,77 h16" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.7">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </path>
