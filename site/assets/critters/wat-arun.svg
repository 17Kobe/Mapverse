    <polygon points="4,59 15,59 13,54 6,54" fill="url(#prangBody)"/>
    <path d="M6,54 C5,49 6,44 9.5,37 C13,44 14,49 13,54 Z" fill="url(#prangBody)"/>
    <line x1="9.5" y1="37" x2="9.5" y2="33" stroke="url(#gold)" stroke-width="1"/>
    <circle cx="9.5" cy="33" r="1" fill="url(#gold)"/>
  </g>
  <use href="#miniPrang"/>
  <g transform="translate(80,0) scale(-1,1)">
    <use href="#miniPrang"/>
  </g>

  <g stroke="#8a5a36" stroke-width="0.5">
    <polygon points="18,64 62,64 55,53 25,53" fill="url(#prangBody)"/>
    <polygon points="18,55 24,55 21,47" fill="url(#prangBody)"/>
    <polygon points="62,55 56,55 59,47" fill="url(#prangBody)"/>
    <polygon points="25,53 55,53 48,43 32,43" fill="url(#prangBody)"/>
    <path d="M32,43 C29,37 29,30 33,22 C35,18 38,14 40,9 C42,14 45,18 47,22 C51,30 51,37 48,43 Z" fill="url(#prangBody)"/>
  </g>

  <circle cx="21" cy="50" r="1.1" fill="#fef6ec"/>
  <circle cx="59" cy="50" r="1" fill="#f5c268"/>
  <circle cx="30" cy="48" r="1" fill="#f08a6c"/>
  <circle cx="50" cy="48" r="1.1" fill="#4fa8a0"/>
  <circle cx="36" cy="38" r="1" fill="#fef6ec"/>
  <circle cx="44" cy="38" r="1" fill="#f5c268"/>
  <circle cx="38" cy="30" r="0.9" fill="#f08a6c"/>
  <circle cx="42" cy="30" r="0.9" fill="#4fa8a0"/>
  <circle cx="39" cy="22" r="0.8" fill="#fef6ec"/>
  <circle cx="34" cy="59" r="1.1" fill="#f5c268"/>
  <circle cx="46" cy="59" r="1.1" fill="#fef6ec"/>
  <circle cx="40" cy="60" r="1" fill="#f08a6c"/>

  <line x1="40" y1="9" x2="40" y2="3" stroke="url(#gold)" stroke-width="1.2"/>
