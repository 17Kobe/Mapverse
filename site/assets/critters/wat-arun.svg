    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="62" width="80" height="18" fill="url(#riverGrad)"/>
  <ellipse cx="40" cy="68" rx="26" ry="6" fill="url(#prangBody)" opacity="0.22"/>

  <path d="M8,67 h12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.6s" repeatCount="indefinite"/>
  </path>
