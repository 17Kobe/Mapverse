<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="dawnGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffe0a8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ff9e6d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff9e6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prangBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ddc4"/>
      <stop offset="50%" stop-color="#e3b48a"/>
      <stop offset="100%" stop-color="#b9824f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#d79a35"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb6d6"/>
      <stop offset="100%" stop-color="#2d6c8c"/>
    </linearGradient>
  </defs>

  <ellipse cx="40" cy="30" rx="36" ry="30" fill="url(#dawnGlow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <g id="miniPrang" stroke="#8a5a36" stroke-width="0.4">
