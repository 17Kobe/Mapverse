<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="gkPeakA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f9a6a"/>
      <stop offset="45%" stop-color="#5a8a63"/>
      <stop offset="100%" stop-color="#3f6350"/>
    </linearGradient>
    <linearGradient id="gkPeakB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa870"/>
      <stop offset="45%" stop-color="#63925f"/>
      <stop offset="100%" stop-color="#406048"/>
    </linearGradient>
    <linearGradient id="gkPeakC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a9168"/>
      <stop offset="45%" stop-color="#557f5e"/>
      <stop offset="100%" stop-color="#395a4a"/>
    </linearGradient>
    <linearGradient id="gkWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fc1c8"/>
      <stop offset="55%" stop-color="#3f93a0"/>
      <stop offset="100%" stop-color="#1f5d6e"/>
    </linearGradient>
    <linearGradient id="gkRaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9bd78"/>
      <stop offset="100%" stop-color="#a9823f"/>
    </linearGradient>
    <linearGradient id="gkShirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f7cb0"/>
      <stop offset="100%" stop-color="#355e8c"/>
    </linearGradient>
    <linearGradient id="gkHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5a0"/>
      <stop offset="100%" stop-color="#bb9a55"/>
    </linearGradient>
  </defs>

  <!-- river -->
  <rect x="0" y="44" width="80" height="36" fill="url(#gkWater)"/>

  <!-- blurred reflections of the peaks -->
  <g opacity="0.3">
    <g transform="translate(0,92) scale(1,-1)">
      <path d="M4,48 C2,38 6,28 10,22 C12,18 16,18 18,22 C22,28 26,38 24,48 Z" fill="url(#gkPeakA)"/>
      <path d="M28,48 C25,36 30,22 36,16 C40,11 46,11 50,16 C56,22 59,36 56,48 Z" fill="url(#gkPeakB)"/>
      <path d="M50,48 C48,38 52,30 58,25 C61,22 67,22 70,25 C74,31 76,39 74,48 Z" fill="url(#gkPeakC)"/>
    </g>
  </g>
  <!-- soft ripple lines across the water -->
  <g stroke="#bfeef2" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M2,54 Q10,52 18,54 T34,54 T50,54 T66,54 T80,54"/>
    <path d="M0,60 Q8,58 16,60 T32,60 T48,60 T64,60 T80,60"/>
  </g>

  <!-- karst peaks -->
  <g stroke="#2d4636" stroke-width="0.5">
    <path d="M4,48 C2,38 6,28 10,22 C12,18 16,18 18,22 C22,28 26,38 24,48 Z" fill="url(#gkPeakA)"/>
    <ellipse cx="13" cy="21" rx="4.5" ry="2.6" fill="#4d7a52" opacity="0.8" stroke="none"/>
  </g>
  <g stroke="#263f30" stroke-width="0.5">
    <path d="M28,48 C25,36 30,22 36,16 C40,11 46,11 50,16 C56,22 59,36 56,48 Z" fill="url(#gkPeakB)"/>
    <ellipse cx="42" cy="15" rx="5" ry="2.8" fill="#5a8a5f" opacity="0.8" stroke="none"/>
    <path d="M34,40 Q36,30 40,22" stroke="#2d4a38" stroke-width="0.6" fill="none" opacity="0.6"/>
    <path d="M50,42 Q48,32 44,24" stroke="#2d4a38" stroke-width="0.6" fill="none" opacity="0.6"/>
  </g>
  <g stroke="#223a2e" stroke-width="0.5" opacity="0.92">
    <path d="M50,48 C48,38 52,30 58,25 C61,22 67,22 70,25 C74,31 76,39 74,48 Z" fill="url(#gkPeakC)"/>
    <ellipse cx="63" cy="25" rx="4.2" ry="2.3" fill="#4a7050" opacity="0.8" stroke="none"/>
  </g>

  <!-- water line blending over peak bases -->
  <rect x="0" y="46" width="80" height="4" fill="url(#gkWater)" opacity="0.55"/>

  <!-- bamboo raft with pole-man, gently bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,1.1; 0,0; 0,-0.6; 0,0" dur="3.2s" repeatCount="indefinite"/>

    <!-- raft shadow/wake -->
    <ellipse cx="42" cy="73" rx="19" ry="4.2" fill="#0d3a44" opacity="0.3"/>

    <!-- bamboo poles -->
    <g stroke="#7a5c2c" stroke-width="0.4">
      <rect x="23" y="63.5" width="36" height="2" rx="1" fill="url(#gkRaft)"/>
      <rect x="22" y="65.6" width="38" height="2" rx="1" fill="url(#gkRaft)"/>
      <rect x="21" y="67.7" width="40" height="2.1" rx="1" fill="url(#gkRaft)"/>
      <rect x="22" y="69.9" width="38" height="2" rx="1" fill="url(#gkRaft)"/>
      <rect x="24" y="72" width="34" height="1.9" rx="1" fill="url(#gkRaft)"/>
    </g>
    <line x1="30" y1="62.5" x2="33" y2="73.5" stroke="#5c3f1c" stroke-width="0.6"/>
    <line x1="52" y1="62.5" x2="49" y2="73.5" stroke="#5c3f1c" stroke-width="0.6"/>

    <!-- push pole into the water -->
    <line x1="47" y1="42" x2="58" y2="79" stroke="#6b4a24" stroke-width="1.1" stroke-linecap="round"/>

    <!-- figure -->
    <g>
      <!-- legs -->
      <path d="M37,66 L39,55 L43,55 L42,66 Z" fill="#2e3f52" stroke="#1d2a38" stroke-width="0.3"/>
      <!-- body -->
      <path d="M36,56 Q36,44 40,42 Q44,44 44,56 Z" fill="url(#gkShirt)" stroke="#294568" stroke-width="0.4"/>
      <!-- arms to pole -->
      <path d="M42,46 L48,43" stroke="#355e8c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M39,47 L36,52" stroke="#355e8c" stroke-width="2" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="40" cy="39" r="3" fill="#e3b685" stroke="#9c7450" stroke-width="0.3"/>
      <!-- conical hat -->
      <path d="M34,38 Q40,28 46,38 Z" fill="url(#gkHat)" stroke="#8a7138" stroke-width="0.4"/>
    </g>
  </g>

  <!-- gentle ripples spreading from the raft -->
  <g fill="none" stroke="#cdeef0">
    <ellipse cx="42" cy="75" rx="14" ry="3" opacity="0.5" stroke-width="0.5">
      <animate attributeName="rx" values="10;22;10" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.05;0.55" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="42" cy="75" rx="7" ry="1.8" opacity="0.6" stroke-width="0.5">
      <animate attributeName="rx" values="5;15;5" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.05;0.6" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
