<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bdRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a84a"/><stop offset="100%" stop-color="#b9742a"/>
    </linearGradient>
    <linearGradient id="bdRobeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9842e"/><stop offset="100%" stop-color="#8a521a"/>
    </linearGradient>
    <radialGradient id="bdFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8c79a"/><stop offset="100%" stop-color="#c0945e"/>
    </radialGradient>
    <radialGradient id="bdAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2c0" stop-opacity="0.85"/><stop offset="100%" stop-color="#fff2c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="40" cy="77" rx="17" ry="3.2" fill="#2a2016" opacity="0.3"/>

  <!-- 柔和金色光暈，表現寧靜莊嚴，不特指任何單一宗派符號 -->
  <circle cx="40" cy="30" r="22" fill="url(#bdAura)">
    <animate attributeName="opacity" values="0.4;0.75;0.4" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.8; 0,0" dur="3.4s" repeatCount="indefinite"/>

    <!-- 盤坐冥想姿勢，雙腿交疊 -->
    <path d="M18,66 Q22,58 32,58 L48,58 Q58,58 62,66 Q58,72 40,73 Q22,72 18,66 Z" fill="url(#bdRobeDark)" stroke="#6e4214" stroke-width="0.5"/>
    <path d="M24,62 Q40,68 56,62" fill="none" stroke="#a9682a" stroke-width="0.6" opacity="0.6"/>

    <!-- 袈裟式長袍，一角搭過左肩 -->
    <path d="M26,38 C20,46 18,54 22,61 C30,66 50,66 58,61 C62,54 60,46 54,38 C48,33 32,33 26,38 Z"
          fill="url(#bdRobe)" stroke="#8a521a" stroke-width="0.5"/>
    <path d="M26,38 C22,44 24,52 30,58 L34,56 C29,50 28,44 31,39 Z" fill="url(#bdRobeDark)" opacity="0.9"/>

    <!-- 雙手安置於腿上結手印 -->
    <ellipse cx="32" cy="62" rx="4.4" ry="2.8" fill="url(#bdFace)" stroke="#9a6a3a" stroke-width="0.4"/>
    <ellipse cx="48" cy="62" rx="4.4" ry="2.8" fill="url(#bdFace)" stroke="#9a6a3a" stroke-width="0.4"/>

    <rect x="37" y="30" width="6" height="6" fill="url(#bdFace)"/>
    <circle cx="40" cy="25" r="7.6" fill="url(#bdFace)" stroke="#9a6a3a" stroke-width="0.4"/>

    <!-- 螺髮肉髻（頭頂隆起）與垂肩長耳垢，佛像常見的莊嚴特徵 -->
    <ellipse cx="40" cy="15.5" rx="4.2" ry="4.6" fill="url(#bdFace)" stroke="#9a6a3a" stroke-width="0.3"/>
    <circle cx="40" cy="10.5" r="1.3" fill="#c0945e"/>
    <g fill="#8a6a40" opacity="0.6">
      <circle cx="35" cy="19" r="0.9"/><circle cx="38" cy="17.5" r="0.9"/><circle cx="42" cy="17.5" r="0.9"/><circle cx="45" cy="19" r="0.9"/>
    </g>
    <path d="M33,24 Q31,32 33,37" fill="none" stroke="url(#bdFace)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M47,24 Q49,32 47,37" fill="none" stroke="url(#bdFace)" stroke-width="2.6" stroke-linecap="round"/>

    <path d="M35,23.2 Q36,22.4 37,23.2" stroke="#6a4a2a" stroke-width="0.7" fill="none"/>
    <path d="M43,23.2 Q44,22.4 45,23.2" stroke="#6a4a2a" stroke-width="0.7" fill="none"/>
    <path d="M40,26 Q39,27.5 40,28.6" stroke="#9a6a3a" stroke-width="0.5" fill="none"/>
    <path d="M36,30 Q40,32 44,30" stroke="#6a4a2a" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="27" r="0.5" fill="#7a5a30" opacity="0.7"/>
  </g>
</svg>
