<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bd" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#4a5a78"/><stop offset="1" stop-color="#151b2e"/></radialGradient>
