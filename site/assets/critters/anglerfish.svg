  <path d="M20 86 Q24 52 62 50 Q98 52 108 74 Q98 100 62 104 Q36 106 24 96Z" fill="url(#bd)" stroke="#5a6a8c" stroke-width="1.4"/>
  <path d="M28 66 Q40 52 62 54" stroke="#6a7aa0" stroke-width="1.6" fill="none" opacity=".7"/>
  <path d="M62 50 L70 38 L78 52 M82 52 L92 42 L98 58" fill="#202840" stroke="#3a4668" stroke-width="1.2"/>
  <!-- 嘴與牙 -->
