  <circle cx="42" cy="68" r="7" fill="#d8fff0"/><circle cx="41" cy="68" r="3.6" fill="#0a1018"/><circle cx="39.6" cy="66.4" r="1.2" fill="#fff"/>
  <!-- 小氣泡 -->
  <g fill="none" stroke="#9fe8ff" stroke-width="1.2" opacity=".7"><circle cx="10" cy="86" r="2.6"/><circle cx="6" cy="76" r="1.8"/></g>
