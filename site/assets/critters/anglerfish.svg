  </defs>
  <!-- 馬里亞納海溝的深海鮟鱇魚：頭上掛著發光的誘餌，張著利齒（朝左） -->
  <path d="M30 40 Q34 18 52 10 Q64 4 70 14" stroke="#2a3248" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="22" cy="40" r="22" fill="url(#gl)"><animate attributeName="opacity" values=".9;.4;.9" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="22" cy="40" r="5.5" fill="#e6fff6"/>
  <!-- 魚尾 -->
  <path d="M104 74 L126 52 L122 74 L126 98Z" fill="#202840" stroke="#3a4668" stroke-width="1.4"/>
