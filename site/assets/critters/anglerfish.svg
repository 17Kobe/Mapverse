  <g fill="#f4f6fa"><path d="M24 85 L27 92 L30 86 L33 94 L36 88 L40 95 L43 89 L47 96 L50 90 L54 96 L57 91 L61 96 L64 92Z"/></g>
  <path d="M26 83 L29 76 L32 83 M36 86 L39 78 L42 86 M46 88 L49 80 L52 88" fill="#f4f6fa"/>
