<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="mgCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a768"/>
      <stop offset="55%" stop-color="#b9823f"/>
      <stop offset="100%" stop-color="#8a5c28"/>
    </linearGradient>
    <linearGradient id="mgDune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d998"/>
      <stop offset="60%" stop-color="#e0ad5c"/>
      <stop offset="100%" stop-color="#c38a37"/>
    </linearGradient>
    <linearGradient id="mgLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdeee0"/>
      <stop offset="100%" stop-color="#2f9e8f"/>
    </linearGradient>
  </defs>

  <!-- crescent lake at the base -->
  <path d="M4,80 Q14,66 34,68 Q54,70 76,80 Z" fill="url(#mgLake)" stroke="#1c6b60" stroke-width="0.5"/>
  <path d="M10,74 Q30,64 50,69 Q62,72 70,78" fill="none" stroke="#e7fffa" stroke-width="0.9" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- sand dune curving behind the lake -->
  <path d="M0,74 Q16,54 34,60 Q50,65 64,52 Q74,44 80,46 L80,80 L0,80 Z" fill="url(#mgDune)" stroke="#a97b30" stroke-width="0.5"/>
  <g stroke="#d0a152" stroke-width="0.5" fill="none" opacity="0.6">
    <path d="M8,66 Q20,58 32,62"/>
    <path d="M40,60 Q50,56 58,50"/>
  </g>

  <!-- Mogao cliff face honeycombed with grotto openings -->
  <path d="M2,52 L2,16 L46,16 L46,52 Q24,58 2,52 Z" fill="url(#mgCliff)" stroke="#6b4420" stroke-width="0.6"/>
  <!-- wooden plank galleries -->
  <g stroke="#5a3a1c" stroke-width="0.7" opacity="0.7">
    <line x1="2" y1="26" x2="46" y2="26"/>
    <line x1="2" y1="36" x2="46" y2="36"/>
    <line x1="2" y1="45" x2="46" y2="45"/>
  </g>
  <!-- grotto window openings, irregular grid -->
  <g fill="#3f2a14" opacity="0.85">
    <rect x="6" y="20" width="5" height="4.5" rx="0.6"/>
    <rect x="14" y="19" width="5" height="5" rx="0.6"/>
    <rect x="22" y="21" width="5" height="4" rx="0.6"/>
    <rect x="30" y="19.5" width="5" height="4.5" rx="0.6"/>
    <rect x="38" y="20.5" width="5" height="4.5" rx="0.6"/>
    <rect x="8" y="29" width="5" height="5" rx="0.6"/>
    <rect x="17" y="29.5" width="5" height="4.5" rx="0.6"/>
    <rect x="26" y="29" width="5" height="5" rx="0.6"/>
    <rect x="35" y="29.5" width="5" height="4.5" rx="0.6"/>
    <rect x="5" y="39" width="5" height="4.5" rx="0.6"/>
    <rect x="13" y="38.5" width="5" height="5" rx="0.6"/>
    <rect x="21" y="39" width="5" height="4.5" rx="0.6"/>
    <rect x="29" y="38.5" width="5" height="5" rx="0.6"/>
    <rect x="37" y="39" width="5" height="4.5" rx="0.6"/>
  </g>
  <!-- one grotto glows softly, as if a lamp burns within -->
  <rect x="17" y="29.5" width="5" height="4.5" rx="0.6" fill="#ffcf6b" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- a line of small camels crossing the dune silhouette -->
  <g fill="#6b4a26" opacity="0.85">
    <path d="M52,58 q2,-4 4,-1 q1,-2 2,0 l0,5 l-6,0 Z"/>
    <path d="M60,60 q2,-4 4,-1 q1,-2 2,0 l0,5 l-6,0 Z"/>
  </g>
</svg>
