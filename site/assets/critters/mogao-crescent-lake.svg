<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="mgCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a768"/>
      <stop offset="55%" stop-color="#b9823f"/>
      <stop offset="100%" stop-color="#8a5c28"/>
    </linearGradient>
    <linearGradient id="mgDune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d998"/>
      <stop offset="60%" stop-color="#e0ad5c"/>
      <stop offset="100%" stop-color="#c38a37"/>
    </linearGradient>
    <linearGradient id="mgLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdeee0"/>
      <stop offset="100%" stop-color="#2f9e8f"/>
    </linearGradient>
    <linearGradient id="mgRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0432f"/>
      <stop offset="100%" stop-color="#7a2316"/>
    </linearGradient>
    <linearGradient id="mgWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a6a38"/>
      <stop offset="100%" stop-color="#6b4420"/>
    </linearGradient>
  </defs>

  <!-- crescent lake at the base -->
  <path d="M4,80 Q14,66 34,68 Q54,70 76,80 Z" fill="url(#mgLake)" stroke="#1c6b60" stroke-width="0.5"/>
  <path d="M10,74 Q30,64 50,69 Q62,72 70,78" fill="none" stroke="#e7fffa" stroke-width="0.9" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- sand dune curving behind the lake -->
  <path d="M0,74 Q16,54 34,60 Q50,65 64,52 Q74,44 80,46 L80,80 L0,80 Z" fill="url(#mgDune)" stroke="#a97b30" stroke-width="0.5"/>
  <g stroke="#d0a152" stroke-width="0.5" fill="none" opacity="0.6">
    <path d="M8,66 Q20,58 32,62"/>
    <path d="M40,60 Q50,56 58,50"/>
  </g>

  <!-- Mogao cliff face, mostly plain rock with a scatter of grotto openings -->
  <path d="M2,52 L2,16 L46,16 L46,52 Q24,58 2,52 Z" fill="url(#mgCliff)" stroke="#6b4420" stroke-width="0.6"/>
  <g fill="#3f2a14" opacity="0.7">
    <rect x="5" y="20" width="4" height="4" rx="0.5"/>
    <rect x="12" y="19.5" width="4" height="4" rx="0.5"/>
    <rect x="6" y="30" width="4" height="4" rx="0.5"/>
    <rect x="13" y="38" width="4" height="4" rx="0.5"/>
    <rect x="6" y="44" width="4" height="4" rx="0.5"/>
  </g>
  <g stroke="#5a3a1c" stroke-width="0.5" opacity="0.5">
    <line x1="2" y1="26" x2="18" y2="26"/>
    <line x1="2" y1="36" x2="20" y2="36"/>
    <line x1="2" y1="45" x2="18" y2="45"/>
  </g>

  <!-- 九層樓：依山而建的多層木構樓閣，是莫高窟最著名的識別畫面 -->
  <rect x="20" y="24" width="24" height="54" fill="url(#mgWood)" stroke="#4a2f16" stroke-width="0.6"/>
  <g stroke="#4a2f16" stroke-width="0.4" opacity="0.6">
    <line x1="20" y1="32" x2="44" y2="32"/>
    <line x1="20" y1="40" x2="44" y2="40"/>
    <line x1="20" y1="48" x2="44" y2="48"/>
    <line x1="20" y1="56" x2="44" y2="56"/>
    <line x1="20" y1="64" x2="44" y2="64"/>
    <line x1="20" y1="71" x2="44" y2="71"/>
  </g>
  <!-- 各層飛簷屋頂，往上漸縮，兩端微微翹起 -->
  <g fill="url(#mgRoof)" stroke="#5a1a10" stroke-width="0.4">
    <path d="M17,78 L47,78 L45,74 L19,74 Z"/>
    <path d="M18,70 L46,70 L44,66 L20,66 Z"/>
    <path d="M18.5,62 L45.5,62 L43.5,58 L20.5,58 Z"/>
    <path d="M19,54 L45,54 L43,50 L21,50 Z"/>
    <path d="M19.5,46 L44.5,46 L42.5,42 L21.5,42 Z"/>
    <path d="M20,38 L44,38 L42,34 L22,34 Z"/>
    <path d="M20.5,30 L43.5,30 L41.5,26 L22.5,26 Z"/>
  </g>
  <!-- 窗洞一盞燈火隱約亮著 -->
  <rect x="29" y="51" width="4" height="4" fill="#ffcf6b" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <!-- 樓頂小旗幡 -->
  <line x1="32" y1="26" x2="32" y2="18" stroke="#6b4420" stroke-width="0.8"/>
  <path d="M32,18 L38,20 L32,22 Z" fill="#c0432f">
    <animate attributeName="d" values="M32,18 L38,20 L32,22 Z;M32,18 L37,19 L32,22 Z;M32,18 L38,20 L32,22 Z" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- a line of small camels crossing the dune silhouette -->
  <g fill="#6b4a26" opacity="0.85">
    <path d="M52,58 q2,-4 4,-1 q1,-2 2,0 l0,5 l-6,0 Z"/>
    <path d="M60,60 q2,-4 4,-1 q1,-2 2,0 l0,5 l-6,0 Z"/>
  </g>
</svg>
