<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="uyuniMirrorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#bfe4f7"/>
    <stop offset="45%" stop-color="#f0f8fb"/>
    <stop offset="55%" stop-color="#f0f8fb"/>
    <stop offset="100%" stop-color="#bfe4f7"/>
  </linearGradient>
  <clipPath id="uyuniLakeClip">
    <ellipse cx="40" cy="40" rx="32" ry="25"/>
  </clipPath>
  <radialGradient id="uyuniCloudGrad" cx="40%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#d7e9f0"/>
  </radialGradient>
  <radialGradient id="uyuniSunGrad" cx="40%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#ffe9a8"/>
    <stop offset="100%" stop-color="#e8a23a"/>
  </radialGradient>
</defs>

<ellipse cx="40" cy="40" rx="32" ry="25" fill="url(#uyuniMirrorGrad)"/>

<g clip-path="url(#uyuniLakeClip)">
  <line x1="6" y1="40" x2="74" y2="40" stroke="#a9d3e8" stroke-width="1" opacity="0.6"/>

  <!-- salt crust hexagon cracks -->
  <polygon points="25,28.5 29.76,31.25 29.76,36.75 25,39.5 20.24,36.75 20.24,31.25" fill="none" stroke="#bcd9e8" stroke-width="0.8" opacity="0.55"/>
  <polygon points="42,39.5 47.63,42.75 47.63,49.25 42,52.5 36.37,49.25 36.37,42.75" fill="none" stroke="#bcd9e8" stroke-width="0.8" opacity="0.5"/>
  <polygon points="55,24.5 58.9,26.75 58.9,31.25 55,33.5 51.1,31.25 51.1,26.75" fill="none" stroke="#bcd9e8" stroke-width="0.7" opacity="0.5"/>
  <polygon points="25,43.5 28.9,45.75 28.9,50.25 25,52.5 21.1,50.25 21.1,45.75" fill="none" stroke="#bcd9e8" stroke-width="0.7" opacity="0.35"/>
  <polygon points="57,45.8 60.64,47.9 60.64,52.1 57,54.2 53.36,52.1 53.36,47.9" fill="none" stroke="#bcd9e8" stroke-width="0.7" opacity="0.35"/>

  <!-- mirrored reflection of cloud (below horizon) -->
  <g opacity="0.3">
    <ellipse cx="58" cy="55" rx="7" ry="4" fill="white"/>
    <ellipse cx="63" cy="57" rx="5" ry="3.5" fill="white"/>
    <ellipse cx="53" cy="56" rx="4.5" ry="3" fill="white"/>
  </g>

  <!-- mirrored reflection of sun (below horizon) -->
  <circle cx="40" cy="60" r="6" fill="#ffd36b" opacity="0.35"/>

  <!-- cloud above horizon -->
  <g>
    <ellipse cx="58" cy="25" rx="7" ry="4" fill="url(#uyuniCloudGrad)" stroke="#bcd0da" stroke-width="0.4"/>
    <ellipse cx="63" cy="23" rx="5" ry="3.5" fill="url(#uyuniCloudGrad)" stroke="#bcd0da" stroke-width="0.4"/>
    <ellipse cx="53" cy="24" rx="4.5" ry="3" fill="url(#uyuniCloudGrad)" stroke="#bcd0da" stroke-width="0.4"/>
  </g>

  <!-- sun above horizon -->
  <circle cx="40" cy="20" r="6" fill="url(#uyuniSunGrad)" stroke="#c9962a" stroke-width="0.5"/>

  <!-- shimmering light glints on mirror surface -->
  <circle cx="18" cy="36" r="1.4" fill="white" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="30" cy="50" r="1.2" fill="white" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="51" cy="31" r="1.3" fill="white" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle cx="60" cy="47" r="1.3" fill="white" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.6s" repeatCount="indefinite" begin="1.6s"/>
  </circle>
  <circle cx="40" cy="40" r="1.5" fill="white" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.95;0.1" dur="2.3s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
</g>

<ellipse cx="40" cy="40" rx="32" ry="25" fill="none" stroke="#7fa8c2" stroke-width="0.6"/>
</svg>