<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9bdcb"/>
      <stop offset="1" stop-color="#637889"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c93a3"/>
      <stop offset="1" stop-color="#425262"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8fe0"/>
      <stop offset="1" stop-color="#1e4e8c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb3dd"/>
      <stop offset="1" stop-color="#17415c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="64" width="80" height="16" fill="url(#river)"/>

  <g opacity="0.18">
    <rect x="12" y="66" width="18" height="12" fill="#5e7384"/>
    <rect x="50" y="66" width="18" height="12" fill="#5e7384"/>
  </g>

  <g stroke="#dff1fb" stroke-width="1" stroke-linecap="round">
    <line x1="4" y1="70" x2="16" y2="70" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="34" y1="73" x2="46" y2="73" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="71" x2="74" y2="71" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="76" x2="30" y2="76" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <rect x="12" y="48" width="18" height="25" fill="url(#stoneDark)" stroke="#36434e" stroke-width="0.4"/>
  <rect x="50" y="48" width="18" height="25" fill="url(#stoneDark)" stroke="#36434e" stroke-width="0.4"/>

  <g>
    <path d="M30,47 L40,49 L40,57 L30,55 Z" fill="url(#deck)" stroke="#123b63" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 30 51;-4 30 51;0 30 51" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g>
    <path d="M50,47 L40,49 L40,57 L50,55 Z" fill="url(#deck)" stroke="#123b63" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 50 51;4 50 51;0 50 51" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g stroke="#2f3f4c" stroke-width="0.6" opacity="0.7">
    <line x1="15" y1="16" x2="30" y2="49"/>
    <line x1="27" y1="16" x2="40" y2="47"/>
    <line x1="65" y1="16" x2="50" y2="49"/>
    <line x1="53" y1="16" x2="40" y2="47"/>
  </g>

  <g>
    <rect x="12" y="14" width="18" height="36" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.5"/>
    <rect x="10" y="7" width="5" height="9" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.4"/>
    <polygon points="10,7 12.5,1 15,7" fill="#5e7384" stroke="#3f4f5c" stroke-width="0.4"/>
    <rect x="25" y="7" width="5" height="9" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.4"/>
    <polygon points="25,7 27.5,1 30,7" fill="#5e7384" stroke="#3f4f5c" stroke-width="0.4"/>
    <rect x="16" y="20" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
    <rect x="21" y="20" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
    <rect x="16" y="34" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
    <rect x="21" y="34" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
  </g>

  <g>
    <rect x="50" y="14" width="18" height="36" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.5"/>
    <rect x="65" y="7" width="5" height="9" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.4"/>
    <polygon points="65,7 67.5,1 70,7" fill="#5e7384" stroke="#3f4f5c" stroke-width="0.4"/>
    <rect x="50" y="7" width="5" height="9" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.4"/>
    <polygon points="50,7 52.5,1 55,7" fill="#5e7384" stroke="#3f4f5c" stroke-width="0.4"/>
    <rect x="59" y="20" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
    <rect x="54" y="20" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
    <rect x="59" y="34" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
    <rect x="54" y="34" width="5" height="8" rx="2" fill="#1e3a4c" opacity="0.85"/>
  </g>

  <rect x="30" y="17" width="20" height="7" fill="url(#stone)" stroke="#3f4f5c" stroke-width="0.5"/>
  <rect x="33" y="19" width="2.5" height="3.5" fill="#1e3a4c" opacity="0.8"/>
  <rect x="37" y="19" width="2.5" height="3.5" fill="#1e3a4c" opacity="0.8"/>
  <rect x="41" y="19" width="2.5" height="3.5" fill="#1e3a4c" opacity="0.8"/>
  <rect x="45" y="19" width="2.5" height="3.5" fill="#1e3a4c" opacity="0.8"/>
</svg>
