<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="trSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e3eff0"/>
    <stop offset="1" stop-color="#c3dde0"/>
  </linearGradient>
  <linearGradient id="trCliffL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfe0c9"/>
    <stop offset="0.55" stop-color="#8bb08c"/>
    <stop offset="1" stop-color="#4c7350"/>
  </linearGradient>
  <linearGradient id="trCliffR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4c7350"/>
    <stop offset="0.45" stop-color="#8bb08c"/>
    <stop offset="1" stop-color="#cfe0c9"/>
  </linearGradient>
  <linearGradient id="trRoad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d8d8d"/>
    <stop offset="1" stop-color="#5c5c5c"/>
  </linearGradient>
  <linearGradient id="trGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd977"/>
    <stop offset="1" stop-color="#d79a1f"/>
  </linearGradient>
  <linearGradient id="trRed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d4493a"/>
    <stop offset="1" stop-color="#8f1f17"/>
  </linearGradient>
  <linearGradient id="trStone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f2ec"/>
    <stop offset="1" stop-color="#c9c4b8"/>
  </linearGradient>
</defs>

<!-- 天空 / 薄霧 -->
<rect x="0" y="0" width="80" height="80" fill="url(#trSky)"/>

<!-- 左側：兩道又高又窄的陡峭綠色峭壁，中間留出峽谷縫隙（太魯閣大理石峽谷的地形特徵） -->
<path d="M16,80 L12,46 L8,24 L4,8 L2,8 L2,80 Z" fill="url(#trCliffL)" stroke="#355138" stroke-width="0.5"/>
<path d="M26,80 L23,50 L20,30 L17,15 L14,15 L17,34 L15,56 L18,80 Z" fill="url(#trCliffL)" stroke="#355138" stroke-width="0.5" opacity="0.92"/>
<g stroke="#2e4a32" stroke-width="0.5" fill="none" opacity="0.4">
  <path d="M4,14 C2,24 5,34 3,46 C5,58 2,68 4,80"/>
  <path d="M18,22 C16,32 19,42 17,52 C19,62 16,70 18,80"/>
</g>

<!-- 右側：對稱的兩道峭壁 -->
<path d="M66,80 L70,50 L73,30 L76,15 L79,15 L76,34 L78,56 L75,80 Z" fill="url(#trCliffR)" stroke="#355138" stroke-width="0.5" opacity="0.92"/>
<path d="M64,80 L68,46 L72,24 L76,8 L78,8 L78,80 Z" fill="url(#trCliffR)" stroke="#355138" stroke-width="0.5"/>
<g stroke="#2e4a32" stroke-width="0.5" fill="none" opacity="0.4">
  <path d="M76,14 C78,24 75,34 77,46 C75,58 78,68 76,80"/>
  <path d="M62,22 C64,32 61,42 63,52 C61,62 64,70 62,80"/>
</g>

<!-- 柏油路面：貫穿峽谷縫隙 -->
<path d="M26,66 Q45,61 64,66 L64,80 L26,80 Z" fill="url(#trRoad)"/>
<path d="M30,68 Q45,64 60,68" stroke="#e8d85a" stroke-width="0.8" stroke-dasharray="3,2" fill="none" opacity="0.8"/>

<!-- 右：白色大理石界碑 -->
<path d="M57,66 L55,38 L58,33 L62,33 L65,38 L63,66 Z" fill="url(#trStone)" stroke="#8d8676" stroke-width="0.6"/>
<g stroke="#4a4438" stroke-width="0.8" opacity="0.7">
  <line x1="58" y1="40" x2="58" y2="58"/>
  <line x1="61" y1="40" x2="61" y2="58"/>
</g>

<!-- 左：太魯閣牌樓入口（紅柱金頂飛簷，最具代表性的識別特徵） -->
<g>
  <rect x="28" y="48" width="3.2" height="18" fill="url(#trRed)" stroke="#5c120c" stroke-width="0.4"/>
  <rect x="46" y="48" width="3.2" height="18" fill="url(#trRed)" stroke="#5c120c" stroke-width="0.4"/>
  <rect x="27" y="46" width="23" height="2.6" fill="url(#trGold)" stroke="#8a5c10" stroke-width="0.4"/>
  <path d="M23,46 Q36.5,34 50,46 L46,46 Q36.5,38 27,46 Z" fill="url(#trGold)" stroke="#8a5c10" stroke-width="0.5"/>
  <path d="M21,47 L25,42 L27,44 L23,49 Z" fill="url(#trRed)" stroke="#5c120c" stroke-width="0.4"/>
  <path d="M52,47 L48,42 L46,44 L50,49 Z" fill="url(#trRed)" stroke="#5c120c" stroke-width="0.4"/>
  <circle cx="36.5" cy="50" r="2.3" fill="#e0392c" stroke="#7a1a10" stroke-width="0.4"/>
</g>
</svg>
