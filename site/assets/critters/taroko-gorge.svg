<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
<linearGradient id="leftCliff" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#f8f5f0"/>
<stop offset="0.55" stop-color="#ddd6cb"/>
<stop offset="1" stop-color="#a39b92"/>
</linearGradient>
<linearGradient id="rightCliff" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a39b92"/>
<stop offset="0.45" stop-color="#ddd6cb"/>
<stop offset="1" stop-color="#f8f5f0"/>
</linearGradient>
<linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8fe6df"/>
<stop offset="0.5" stop-color="#28aea6"/>
<stop offset="1" stop-color="#0d7873"/>
</linearGradient>
<linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e3573f"/>
<stop offset="1" stop-color="#9a2b1c"/>
</linearGradient>
<linearGradient id="ledge" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#d2cbc0"/>
<stop offset="1" stop-color="#998f84"/>
</linearGradient>
</defs>

<!-- 河流：從兩座高山中間的縫隙貫穿而下 -->
<path d="M37,0 L34,20 L37,38 L33,54 L36,66 L34,80 L48,80 L46,66 L50,54 L45,38 L49,20 L45,0 Z" fill="url(#river)"/>
<g stroke-linecap="round" fill="none">
<path d="M36,14 C35,26 36,36 35,48" stroke="#d6fbf5" stroke-width="1" opacity="0.5">
<animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" repeatCount="indefinite"/>
</path>
<path d="M46,18 C47,30 46,40 47,52" stroke="#d6fbf5" stroke-width="0.9" opacity="0.4">
<animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.6s" repeatCount="indefinite"/>
</path>
<path d="M39,58 C38,66 40,72 39,80" stroke="#e9fffa" stroke-width="1" opacity="0.5">
<animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.9s" repeatCount="indefinite"/>
</path>
</g>

<!-- 左側：兩座又高又窄的尖峰，峰與峰之間、峰與畫面邊緣之間都留空，不是整塊實心牆 -->
<path d="M16,80 L12,46 L8,24 L4,8 L2,8 L2,80 Z" fill="url(#leftCliff)" stroke="#8a837a" stroke-width="0.5"/>
<path d="M26,80 L23,50 L20,30 L17,15 L14,15 L17,34 L15,56 L18,80 Z" fill="url(#leftCliff)" stroke="#8a837a" stroke-width="0.5" opacity="0.92"/>
<g stroke="#8c857b" stroke-width="0.5" fill="none" opacity="0.4" stroke-linecap="round">
<path d="M4,14 C2,24 5,34 3,46 C5,58 2,68 4,80"/>
<path d="M18,22 C16,32 19,42 17,52 C19,62 16,70 18,80"/>
</g>

<!-- 右側：對稱的兩座尖峰 -->
<path d="M66,80 L70,50 L73,30 L76,15 L79,15 L76,34 L78,56 L75,80 Z" fill="url(#rightCliff)" stroke="#8a837a" stroke-width="0.5" opacity="0.92"/>
<path d="M64,80 L68,46 L72,24 L76,8 L78,8 L78,80 Z" fill="url(#rightCliff)" stroke="#8a837a" stroke-width="0.5"/>
<g stroke="#8c857b" stroke-width="0.5" fill="none" opacity="0.4" stroke-linecap="round">
<path d="M76,14 C78,24 75,34 77,46 C75,58 78,68 76,80"/>
<path d="M62,22 C64,32 61,42 63,52 C61,62 64,70 62,80"/>
</g>

<!-- 右側山腰的小涼亭 -->
<path d="M57,37 L68,33 L69,37 L58,41 Z" fill="#716a62" opacity="0.3"/>
<path d="M58,35 L67,31 L68,34 L59,38 Z" fill="url(#ledge)" stroke="#7d766d" stroke-width="0.4"/>

<rect x="61" y="28" width="1.5" height="7" fill="#5a1b12"/>
<rect x="67" y="26" width="1.5" height="7" fill="#5a1b12"/>
<rect x="60" y="27" width="10" height="1.4" fill="#7a2416"/>

<path d="M59,27 L65,20 L71,26 L68,27.3 L65,23 L61,27.5 Z" fill="url(#roof)" stroke="#6c1c10" stroke-width="0.4"/>
<path d="M59,27 L56.5,25.3 L59,28.5 Z" fill="url(#roof)" stroke="#6c1c10" stroke-width="0.3"/>
<path d="M71,26 L73.5,24.3 L71,29 Z" fill="url(#roof)" stroke="#6c1c10" stroke-width="0.3"/>
</svg>
