<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="ib-ice" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#eaf8ff"/>
      <stop offset="45%" stop-color="#aee3f0"/>
      <stop offset="100%" stop-color="#5bb4d4"/>
    </linearGradient>
    <linearGradient id="ib-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d6c87" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2d6c87" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ib-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8fa8"/>
      <stop offset="100%" stop-color="#145a72"/>
    </linearGradient>
    <linearGradient id="ib-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eafcff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eafcff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- submerged ice base glowing through the water -->
  <path d="M8 58 Q20 68 40 68 Q60 68 70 56 L68 72 Q50 80 30 80 Q14 80 10 70 Z" fill="url(#ib-glow)" opacity="0.6"/>

  <!-- sea surrounding the berg -->
  <rect x="0" y="56" width="80" height="24" fill="url(#ib-sea)"/>

  <!-- main iceberg mass, jagged crystalline silhouette -->
  <path d="M10 58 L16 34 L24 40 L30 18 L40 32 L48 14 L58 36 L66 30 L72 56 Q74 60 68 60 L14 60 Q8 60 10 58 Z"
    fill="url(#ib-ice)" stroke="#2d6c87" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- shaded right flank -->
  <path d="M48 14 L58 36 L66 30 L72 56 Q74 60 68 60 L52 60 L50 32 Z" fill="url(#ib-shade)"/>

  <!-- crystalline facets -->
  <path d="M24 40 L30 18 M40 32 L48 14 M30 18 L40 32 M58 36 L52 60" stroke="#ffffff" stroke-width="0.6" opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M16 34 L24 40 L22 60" stroke="#2d6c87" stroke-width="0.5" opacity="0.4" fill="none"/>

  <!-- bright highlight catching the sun -->
  <path d="M30 18 L34 22 L26 30 Z" fill="#ffffff" opacity="0.7"/>

  <!-- waterline ripple -->
  <ellipse cx="40" cy="59" rx="34" ry="3.2" fill="#eafcff" opacity="0.4">
    <animate attributeName="rx" values="34;36;34" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- gentle sparkle -->
  <circle cx="44" cy="24" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="46" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- small lapping waves at the base -->
  <g stroke="#bdeef6" stroke-width="0.9" fill="none" opacity="0.5">
    <path d="M4 66 Q14 64 24 66 T44 66">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M4 66 Q14 64 24 66 T44 66;
                M4 67 Q14 69 24 67 T44 67;
                M4 66 Q14 64 24 66 T44 66"/>
    </path>
    <path d="M38 72 Q50 70 62 72 T82 72">
      <animate attributeName="d" dur="3.6s" repeatCount="indefinite"
        values="M38 72 Q50 70 62 72 T82 72;
                M38 73 Q50 75 62 73 T82 73;
                M38 72 Q50 70 62 72 T82 72"/>
    </path>
  </g>
</svg>
