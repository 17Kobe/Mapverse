    <text x="37" y="45" font-size="6" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">F1</text>

    <rect x="33" y="25" width="6" height="5" fill="url(#msFace)"/>
    <circle cx="36" cy="21" r="7.3" fill="url(#msFace)" stroke="#b08354" stroke-width="0.45"/>
    <path d="M31.8,23.8 Q36,26 40.2,23.8" fill="none" stroke="#9a6a46" stroke-width="0.7" stroke-linecap="round"/>
