    <path d="M24,32 L19,47 L24,49 L29,34 Z" fill="url(#msSuit)" stroke="#5c0f0c" stroke-width="0.5"/>
    <circle cx="20" cy="47.5" r="3" fill="url(#msFace)" stroke="#b08354" stroke-width="0.4"/>

    <path d="M44,32 C49,34 52,38 51,44 L45,45 C45,40 43,37 40,34 Z" fill="url(#msSuit)" stroke="#5c0f0c" stroke-width="0.5"/>
    <circle cx="48" cy="44.5" r="3" fill="url(#msFace)" stroke="#b08354" stroke-width="0.4"/>

