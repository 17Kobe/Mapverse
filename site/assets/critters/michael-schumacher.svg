    <rect x="22" y="63" width="11" height="15" rx="3" fill="url(#msShoe)" stroke="#000" stroke-width="0.5"/>
    <rect x="38" y="63" width="11" height="15" rx="3" fill="url(#msShoe)" stroke="#000" stroke-width="0.5"/>

    <path d="M24,49 C19,54 19,60 23,64 L33,64 L33,55 L39,55 L39,64 L48,64 C52,60 52,54 47,49 Z"
