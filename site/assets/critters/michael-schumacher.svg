      <path d="M-7,-1 L7,-1 L6,2.5 L-6,2.5 Z" fill="#1c1c20" opacity="0.85"/>
      <path d="M-3,-5.5 Q0,-7.5 3,-5.5" stroke="#8a1410" stroke-width="1" fill="none"/>
