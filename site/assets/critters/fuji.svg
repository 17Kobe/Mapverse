<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="fj-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ab4e8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a8d4f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fj-mt" x1="0.3" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a7080"/>
      <stop offset="100%" stop-color="#78929e"/>
    </linearGradient>
    <linearGradient id="fj-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a5060" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a5060" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- 淡藍天空暗示（只佔上方 1/3） -->
  <rect x="0" y="0" width="80" height="28" fill="url(#fj-sky)"/>

  <!-- 山體 -->
  <polygon points="40,6 4,72 76,72"
    fill="url(#fj-mt)" stroke="#3c525f" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- 山體右側暗面 -->
  <polygon points="40,6 76,72 58,72"
    fill="url(#fj-dark)" stroke="none"/>

  <!-- 山壁岩紋（細微紋理） -->
  <path d="M30 30 L20 56 M36 24 L30 54 M50 36 L62 60" stroke="#48606e" stroke-width="0.5" stroke-opacity="0.4" fill="none" stroke-linecap="round"/>

  <!-- 白雪山頂（乾淨三角＋底部波浪鋸齒） -->
  <path d="M40,6 L22,34 Q25,31 27,34 Q29,30 31,33 Q33,29 35,32 Q37,28 40,31 Q43,28 45,32 Q47,29 49,33 Q51,30 53,34 Q55,31 58,34 Z"
    fill="#f4f8fb" stroke="#bcd0da" stroke-width="0.4" stroke-linejoin="round"/>

  <!-- 雪面光澤線 -->
  <line x1="40" y1="8" x2="36" y2="22" stroke="#eef5fa" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="40" y1="8" x2="44" y2="20" stroke="#eef5fa" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- 山腰雲霧帶 1 -->
  <ellipse cx="32" cy="47" rx="18" ry="3.5" fill="#f4f8fb" fill-opacity="0.75"/>
  <!-- 雲帶陰影 -->
  <ellipse cx="32" cy="49" rx="16" ry="2" fill="#c0ccd4" fill-opacity="0.35"/>

  <!-- 山腰雲霧帶 2 -->
  <ellipse cx="48" cy="59" rx="20" ry="3.5" fill="#f4f8fb" fill-opacity="0.6"/>
  <ellipse cx="48" cy="61" rx="18" ry="2" fill="#c0ccd4" fill-opacity="0.3"/>
</svg>
