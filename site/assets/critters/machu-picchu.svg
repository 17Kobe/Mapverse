<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">

<defs>
  <linearGradient id="mpMtn1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5a6a7a"/><stop offset="1" stop-color="#333f4a"/>
  </linearGradient>
  <linearGradient id="mpMtn2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a5a6a"/><stop offset="1" stop-color="#2a333d"/>
  </linearGradient>
  <linearGradient id="mpT1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a9a4a"/><stop offset="1" stop-color="#466b2a"/>
  </linearGradient>
  <linearGradient id="mpT2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5e8a40"/><stop offset="1" stop-color="#375420"/>
  </linearGradient>
  <linearGradient id="mpT3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4e7d38"/><stop offset="1" stop-color="#2f4f1f"/>
  </linearGradient>
  <linearGradient id="mpT4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#44702e"/><stop offset="1" stop-color="#27401b"/>
  </linearGradient>
  <linearGradient id="mpStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ab9476"/><stop offset="1" stop-color="#8a7358"/>
  </linearGradient>
  <linearGradient id="mpRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d4b890"/><stop offset="1" stop-color="#a88a5e"/>
  </linearGradient>
</defs>

<!-- 背後山峰（深藍灰，尖錐） -->
<polygon points="20,62 38,18 56,62" fill="url(#mpMtn1)" stroke="#2a333d" stroke-width="0.6" stroke-linejoin="round"/>
<!-- 第二座小尖峰 -->
<polygon points="44,62 57,28 68,62" fill="url(#mpMtn2)" stroke="#232b33" stroke-width="0.5" stroke-linejoin="round"/>

<!-- 梯田層（從底部往上，左寬右窄） -->
<!-- 第1層（最底） -->
<rect x="14" y="56" width="44" height="6" rx="1" fill="url(#mpT1)" stroke="#33491f" stroke-width="0.5"/>
<!-- 第2層 -->
<rect x="18" y="50" width="38" height="6" rx="1" fill="url(#mpT2)" stroke="#2b3f18" stroke-width="0.5"/>
<!-- 第3層 -->
<rect x="22" y="44" width="32" height="6" rx="1" fill="url(#mpT3)" stroke="#223a16" stroke-width="0.5"/>
<!-- 第4層（最高梯田平台） -->
<rect x="26" y="38" width="26" height="6" rx="1" fill="url(#mpT4)" stroke="#1c3012" stroke-width="0.5"/>

<!-- 石屋群（建在第4層梯田上） -->
<!-- 屋子1（左） -->
<rect x="27" y="29" width="8" height="9" rx="1" fill="url(#mpStone)" stroke="#6b5940" stroke-width="0.5"/>
<rect x="29" y="32" width="3" height="3" fill="#2a1a0a"/>
<!-- 屋子2 -->
<rect x="36" y="27" width="7" height="11" rx="1" fill="url(#mpStone)" stroke="#6b5940" stroke-width="0.5"/>
<rect x="38" y="30" width="2.5" height="3" fill="#2a1a0a"/>
<!-- 屋子3（最高） -->
<rect x="44" y="25" width="6" height="13" rx="1" fill="url(#mpStone)" stroke="#6b5940" stroke-width="0.5"/>
<rect x="45.5" y="28" width="2" height="3" fill="#2a1a0a"/>

<!-- 屋頂（簡單三角） -->
<polygon points="27,29 31,24 35,29" fill="url(#mpRoof)" stroke="#8a6f4a" stroke-width="0.4"/>
<polygon points="36,27 39.5,22 43,27" fill="url(#mpRoof)" stroke="#8a6f4a" stroke-width="0.4"/>
<polygon points="44,25 47,19.5 50,25" fill="url(#mpRoof)" stroke="#8a6f4a" stroke-width="0.4"/>

</svg>
