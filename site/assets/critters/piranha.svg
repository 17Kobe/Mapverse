<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <radialGradient id="prBody" cx="40%" cy="30%" r="80%">
    <stop offset="0" stop-color="#d4dce2"/>
    <stop offset="0.6" stop-color="#aab4bc"/>
    <stop offset="1" stop-color="#848e96"/>
  </radialGradient>
  <linearGradient id="prBelly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e06b3e"/>
    <stop offset="1" stop-color="#b5401f"/>
  </linearGradient>
  <g id="piranha">
    <!-- tail fin -->
    <path d="M -18,0 L -32,-11 L -21,0 L -32,11 Z" fill="#4a4a4a" stroke="#242424" stroke-width="0.4"/>
    <!-- dorsal fin -->
    <path d="M -3,-10 L 3,-21 L 10,-9 Z" fill="#4a4a4a" stroke="#242424" stroke-width="0.4"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="20" ry="11" fill="url(#prBody)" stroke="#5e6a72" stroke-width="0.4"/>
    <!-- belly -->
    <path d="M -11,3 C -3,13 9,13 16,4 C 9,10 -4,10 -11,3 Z" fill="url(#prBelly)" stroke="#7a2c14" stroke-width="0.4"/>
    <!-- eye -->
    <circle cx="11" cy="-3" r="2.6" fill="white" stroke="#333333" stroke-width="0.5"/>
    <circle cx="12" cy="-3" r="1.2" fill="#1a1a1a"/>
    <!-- mouth -->
    <path d="M14,3 Q19,5 20,2" fill="none" stroke="#6b3a2a" stroke-width="1.3" stroke-linecap="round"/>
    <!-- teeth -->
    <path d="M14.5,2 L16.5,2 L15.5,4.3 Z" fill="white" stroke="#888888" stroke-width="0.4"/>
    <path d="M16.5,4 L18.5,4 L17.5,1.7 Z" fill="white" stroke="#888888" stroke-width="0.4"/>
    <path d="M18,2.2 L19.8,2.2 L18.9,4.3 Z" fill="white" stroke="#888888" stroke-width="0.4"/>
  </g>
</defs>

<!-- fish 1 (large, front) -->
<g transform="translate(44,42)">
  <g>
    <use href="#piranha"/>
    <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </g>
</g>

<!-- fish 2 (medium, upper-left) -->
<g transform="translate(29,24) scale(0.72)">
  <g>
    <use href="#piranha"/>
    <animateTransform attributeName="transform" type="rotate" values="5 0 0;-5 0 0;5 0 0" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </g>
</g>

<!-- fish 3 (small, lower-left) -->
<g transform="translate(22,59) scale(0.55)">
  <g>
    <use href="#piranha"/>
    <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" keyTimes="0;0.5;1" dur="1.3s" repeatCount="indefinite"/>
  </g>
</g>

<!-- bubbles -->
<circle cx="58" cy="62" r="2" fill="white" opacity="0.8">
  <animate attributeName="cy" values="62;12" dur="2.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.85;0" dur="2.6s" repeatCount="indefinite"/>
</circle>
<circle cx="66" cy="50" r="1.4" fill="white" opacity="0.7">
  <animate attributeName="cy" values="50;8" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.8;0" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
</circle>
<circle cx="14" cy="66" r="1.8" fill="white" opacity="0.75">
  <animate attributeName="cy" values="66;20" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.8;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
</circle>
<circle cx="52" cy="14" r="1.3" fill="white" opacity="0.7">
  <animate attributeName="cy" values="14;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.8;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
</circle>

</svg>