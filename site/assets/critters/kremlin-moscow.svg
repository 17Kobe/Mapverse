    <rect x="30" y="58" width="22" height="36" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/>
    <path d="M34 94 V70 Q38 64 42 70 V94 M43 94 V70 Q47 64 51 70 V94" fill="#8d2c20"/>
