    <use href="#on" transform="translate(63 66) scale(1)" fill="url(#gd)"/><path d="M63 42 V48" stroke="#e8b43a" stroke-width="1.4"/>
    <rect x="22" y="76" width="9" height="18" fill="#efe3cb" stroke="#cdbf9f" stroke-width="1"/>
    <use href="#on" transform="translate(26.5 74) scale(.75)" fill="url(#gd)"/>
