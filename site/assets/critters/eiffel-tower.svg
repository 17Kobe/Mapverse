<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
<linearGradient id="et-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#565a62"/><stop offset="1" stop-color="#2a2d32"/></linearGradient>
<linearGradient id="et-mid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f6678"/><stop offset="1" stop-color="#363b48"/></linearGradient>
<linearGradient id="et-spire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e7588"/><stop offset="1" stop-color="#3f4552"/></linearGradient>
<linearGradient id="et-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aab3a"/><stop offset="1" stop-color="#35661c"/></linearGradient>
</defs>

<!-- ── Left leg (外八大腳) ── -->
<polygon points="10,72 22,72 30,44 18,44"
  fill="url(#et-dark)" stroke="#24262a" stroke-width="0.6" stroke-linejoin="round"/>

<!-- ── Right leg (外八大腳) ── -->
<polygon points="70,72 58,72 50,44 62,44"
  fill="url(#et-dark)" stroke="#24262a" stroke-width="0.6" stroke-linejoin="round"/>

<!-- ── Left leg lattice ── -->
<g stroke="#8090a8" stroke-width="0.7" opacity="0.9">
  <line x1="12" y1="64" x2="20" y2="50"/>
  <line x1="16" y1="68" x2="22" y2="55"/>
  <line x1="19" y1="63" x2="13" y2="51"/>
  <line x1="20" y1="72" x2="22" y2="54"/>
</g>
<!-- ── Right leg lattice ── -->
<g stroke="#8090a8" stroke-width="0.7" opacity="0.9">
  <line x1="68" y1="64" x2="60" y2="50"/>
  <line x1="64" y1="68" x2="58" y2="55"/>
  <line x1="61" y1="63" x2="67" y2="51"/>
  <line x1="60" y1="72" x2="58" y2="54"/>
</g>

<!-- ── First platform (底部橫台) ── -->
<rect x="15" y="41" width="50" height="6" rx="1.5"
  fill="url(#et-mid)" stroke="#2a2e38" stroke-width="0.5"/>
<!-- Platform arch details -->
<g fill="none" stroke="#8090b0" stroke-width="0.8">
  <path d="M20,47 Q23,44 26,47"/>
  <path d="M30,47 Q33,44 36,47"/>
  <path d="M44,47 Q47,44 50,47"/>
  <path d="M54,47 Q57,44 60,47"/>
</g>

<!-- ── Mid tower body (中段收腰) ── -->
<polygon points="24,41 56,41 50,22 30,22"
  fill="url(#et-dark)" stroke="#1f2126" stroke-width="0.6" stroke-linejoin="round"/>

<!-- ── Mid body lattice detail ── -->
<g stroke="#7080a0" stroke-width="0.7" opacity="0.85">
  <line x1="27" y1="41" x2="33" y2="25"/>
  <line x1="35" y1="41" x2="39" y2="25"/>
  <line x1="45" y1="41" x2="41" y2="25"/>
  <line x1="53" y1="41" x2="47" y2="25"/>
  <!-- Cross diagonals -->
  <line x1="28" y1="33" x2="52" y2="33"/>
  <line x1="53" y1="41" x2="35" y2="24"/>
  <line x1="27" y1="41" x2="45" y2="24"/>
</g>

<!-- ── Second platform (中段橫台) ── -->
<rect x="27" y="20" width="26" height="5" rx="1"
  fill="url(#et-mid)" stroke="#2a2e38" stroke-width="0.5"/>
<g fill="none" stroke="#8090b0" stroke-width="0.7">
  <path d="M30,25 Q32,22 34,25"/>
  <path d="M38,25 Q40,22 42,25"/>
  <path d="M46,25 Q48,22 50,25"/>
</g>

<!-- ── Upper tower (頂段收窄) ── -->
<polygon points="31,20 49,20 44,10 36,10"
  fill="url(#et-dark)" stroke="#1f2126" stroke-width="0.6" stroke-linejoin="round"/>
<!-- Upper lattice -->
<g stroke="#7080a0" stroke-width="0.6" opacity="0.8">
  <line x1="33" y1="20" x2="37" y2="11"/>
  <line x1="40" y1="20" x2="40" y2="11"/>
  <line x1="47" y1="20" x2="43" y2="11"/>
  <line x1="32" y1="16" x2="48" y2="16"/>
</g>

<!-- ── Spire base ── -->
<polygon points="36,10 44,10 41,5 39,5"
  fill="url(#et-spire)" stroke="#2a303c" stroke-width="0.5" stroke-linejoin="round"/>

<!-- ── Needle spire ── -->
<polygon points="39,5 41,5 40.3,1.5 39.7,1.5"
  fill="url(#et-spire)" stroke="#2a303c" stroke-width="0.4" stroke-linejoin="round"/>

<!-- ── Antenna tip ── -->
<line x1="40" y1="1.5" x2="40" y2="0" stroke="#3a3d42" stroke-width="0.7"/>
<circle cx="40" cy="0.5" r="1.2" fill="#e8c84a" stroke="#9a7a1f" stroke-width="0.3"/>

<!-- ── Ground ellipse (小半橢圓草地) ── -->
<ellipse cx="40" cy="74" rx="28" ry="4.5"
  fill="url(#et-ground)" stroke="#2f5a1a" stroke-width="0.5"/>
</svg>
