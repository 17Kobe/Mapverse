<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
<linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffe9c2"/>
<stop offset="1" stop-color="#ffd9a0"/>
</linearGradient>
<linearGradient id="ochre" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f3c468"/>
<stop offset="1" stop-color="#d79b3e"/>
</linearGradient>
<linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#e68a5c"/>
<stop offset="1" stop-color="#c4603a"/>
</linearGradient>
<linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#eeb3ad"/>
<stop offset="1" stop-color="#d1807c"/>
</linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f1d48b"/>
<stop offset="1" stop-color="#d8ad57"/>
</linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3f9ba3"/>
<stop offset="0.5" stop-color="#2d7e8a"/>
<stop offset="1" stop-color="#1b5862"/>
</linearGradient>
<linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2d2a28"/>
<stop offset="1" stop-color="#0c0b0a"/>
</linearGradient>
<radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="80" height="48" fill="url(#skyGlow)" opacity="0.35"/>

<!-- back bridge -->
<g>
<path d="M30,40 Q40,26 50,40 L50,48 L30,48 Z" fill="#cfc6b8" stroke="#8d8373" stroke-width="0.5"/>
<path d="M34,41 Q40,32 46,41 Q46,46 44,46 Q40,38 36,46 Q34,46 34,41 Z" fill="#aab7b8" opacity="0.8"/>
</g>

<!-- left buildings -->
<g stroke="#5b3a1e" stroke-width="0.4">
<rect x="0" y="12" width="15" height="36" fill="url(#ochre)"/>
<rect x="14" y="4" width="18" height="44" fill="url(#terracotta)"/>
</g>
<g fill="#3a2a1f" opacity="0.85">
<rect x="3" y="18" width="4" height="6" rx="1.5"/>
<rect x="9" y="18" width="4" height="6" rx="1.5"/>
<rect x="3" y="30" width="4" height="6" rx="1.5"/>
<rect x="9" y="30" width="4" height="6" rx="1.5"/>
<rect x="18" y="10" width="4" height="7" rx="1.8"/>
<rect x="25" y="10" width="4" height="7" rx="1.8"/>
<rect x="18" y="23" width="4" height="7" rx="1.8"/>
<rect x="25" y="23" width="4" height="7" rx="1.8"/>
<rect x="18" y="36" width="4" height="7" rx="1.8"/>
<rect x="25" y="36" width="4" height="7" rx="1.8"/>
</g>
<g fill="#fff3d8" opacity="0.25">
<rect x="3.3" y="18.3" width="1.3" height="5.4"/>
<rect x="18.3" y="10.3" width="1.3" height="6.4"/>
</g>

<!-- right buildings -->
<g stroke="#6b2f27" stroke-width="0.4">
<rect x="50" y="6" width="17" height="42" fill="url(#pink)"/>
<rect x="66" y="14" width="14" height="34" fill="url(#gold)"/>
</g>
<g fill="#3a2a1f" opacity="0.85">
<rect x="53" y="12" width="4" height="7" rx="1.8"/>
<rect x="60" y="12" width="4" height="7" rx="1.8"/>
<rect x="53" y="25" width="4" height="7" rx="1.8"/>
<rect x="60" y="25" width="4" height="7" rx="1.8"/>
<rect x="53" y="38" width="4" height="7" rx="1.8"/>
<rect x="60" y="38" width="4" height="7" rx="1.8"/>
<rect x="69" y="20" width="4" height="6" rx="1.5"/>
<rect x="69" y="32" width="4" height="6" rx="1.5"/>
</g>
<g fill="#fff3d8" opacity="0.25">
<rect x="53.3" y="12.3" width="1.3" height="6.4"/>
<rect x="69.3" y="20.3" width="1.3" height="5.4"/>
</g>

<!-- water -->
<rect x="0" y="47" width="80" height="33" fill="url(#water)"/>

<!-- reflections -->
<g opacity="0.22">
<rect x="0" y="48" width="15" height="10" fill="#d79b3e"/>
<rect x="14" y="48" width="18" height="13" fill="#c4603a"/>
<rect x="50" y="48" width="17" height="12" fill="#d1807c"/>
<rect x="66" y="48" width="14" height="9" fill="#d8ad57"/>
</g>

<!-- ripples -->
<g stroke="#bfe9ec" stroke-width="0.6" fill="none" opacity="0.4">
<path d="M2,55 Q10,53 18,55 T34,55 T50,55 T66,55 T82,55">
<animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.6s" repeatCount="indefinite"/>
</path>
<path d="M-4,63 Q6,61 16,63 T36,63 T56,63 T76,63 T96,63">
<animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.1s" repeatCount="indefinite"/>
</path>
<path d="M0,72 Q12,70 24,72 T48,72 T72,72 T96,72">
<animate attributeName="opacity" values="0.2;0.45;0.2" dur="2.3s" repeatCount="indefinite"/>
</path>
</g>

<circle cx="62" cy="52" r="5" fill="url(#glint)">
<animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/>
</circle>

<!-- gondola -->
<g>
<animateTransform attributeName="transform" type="translate" values="0,0;0,-1.4;0,0.3;0,0" dur="3.2s" repeatCount="indefinite"/>

<path d="M16,61 Q14,58 18,52 Q20,50 21,52 L21,60 Z" fill="url(#hull)" stroke="#000" stroke-width="0.4"/>
<path d="M18,56 Q19.5,52.5 20.6,52.6" stroke="#2c2a28" stroke-width="1" fill="none" stroke-linecap="round"/>

<path d="M18,62 Q24,58 40,58 L60,59 Q65,60 63,64 Q55,68 38,68 Q24,68 18,62 Z" fill="url(#hull)" stroke="#000" stroke-width="0.4"/>
<path d="M20,61 Q38,58.5 58,59.5" stroke="#4a4642" stroke-width="0.6" fill="none" opacity="0.6"/>

<rect x="36" y="56" width="7" height="2.4" rx="0.8" fill="#8b2e2e"/>

<g>
<rect x="38.4" y="46" width="1.3" height="12" fill="#6b4a33"/>
<ellipse cx="39" cy="51" rx="3.4" ry="4.4" fill="#2b2b2b"/>
<rect x="36.6" y="46.5" width="4.8" height="2.6" rx="1" fill="#e8c79a"/>
</g>
</g>

</svg>
