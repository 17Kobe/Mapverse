    fill="#d0d0cc" stroke="white" stroke-width="1.5"/>
  <rect x="14" y="62" width="52" height="5" rx="1.5"
    fill="#c4c4c0" stroke="white" stroke-width="1.2"/>

  <!-- 貝殼組 1（最小，左側） -->
  <path d="M22,62 Q22,48 28,40 Q32,36 34,36 Q30,40 28,48 Q26,56 26,62 Z"
