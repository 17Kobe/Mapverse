  <path d="M46,62 Q50,46 56,32 Q60,22 64,18"
    fill="none" stroke="#d4a020" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 屋頂高光弧線 -->
  <path d="M50,62 Q54,46 60,30 Q63,21 66,16"
    fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M38,62 Q40,48 44,34 Q46,26 50,25"
