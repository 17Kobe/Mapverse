  <rect x="55" y="42" width="18" height="6" rx="1.5" fill="#f6f6f6" stroke="#9a9a9a" stroke-width=".9"/>
  <path d="M56 62 H72" stroke="#ffd9a0" stroke-width="1.6"/>
  <!-- 底座建築 -->
  <rect x="38" y="116" width="52" height="8" fill="#e8dcc0" stroke="#bfae8a" stroke-width=".9"/>
</svg>
