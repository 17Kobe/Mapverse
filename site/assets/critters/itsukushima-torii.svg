<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f0"/>
      <stop offset="1" stop-color="#eaf6ee"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c7a5e"/>
      <stop offset="1" stop-color="#36523a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3cf"/>
      <stop offset="0.5" stop-color="#5fa3b4"/>
      <stop offset="1" stop-color="#3c7f92"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a2a1d"/>
      <stop offset="0.5" stop-color="#c0492c"/>
      <stop offset="1" stop-color="#8f331f"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e2015"/>
      <stop offset="0.5" stop-color="#9c3a22"/>
      <stop offset="1" stop-color="#6c2717"/>
    </linearGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sea -->
  <rect x="0" y="40" width="80" height="40" fill="url(#water)"/>

  <!-- soft light glint on water -->
  <ellipse cx="40" cy="48" rx="20" ry="6" fill="url(#glint)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ripples -->
  <g stroke="#e8f6f7" stroke-width="0.6" fill="none" opacity="0.5">
    <path d="M10 56 Q 16 54 22 56 T 34 56">
      <animate attributeName="d" values="M10 56 Q 16 54 22 56 T 34 56;M10 56 Q 16 58 22 56 T 34 56;M10 56 Q 16 54 22 56 T 34 56" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M44 60 Q 50 58 56 60 T 68 60">
      <animate attributeName="d" values="M44 60 Q 50 58 56 60 T 68 60;M44 60 Q 50 62 56 60 T 68 60;M44 60 Q 50 58 56 60 T 68 60" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M6 66 Q 14 63 22 66 T 38 66">
      <animate attributeName="d" values="M6 66 Q 14 63 22 66 T 38 66;M6 66 Q 14 69 22 66 T 38 66;M6 66 Q 14 63 22 66 T 38 66" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M46 70 Q 54 67 62 70 T 76 70">
      <animate attributeName="d" values="M46 70 Q 54 67 62 70 T 76 70;M46 70 Q 54 73 62 70 T 76 70;M46 70 Q 54 67 62 70 T 76 70" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- torii reflection (wavy, faint) -->
  <g opacity="0.28">
    <path d="M24 60 L 22 78 L 27 78 L 29 62 Z" fill="#8f331f"/>
    <path d="M56 60 L 58 78 L 53 78 L 51 62 Z" fill="#8f331f"/>
    <rect x="22" y="62" width="36" height="5" fill="#8f331f"/>
    <animateTransform attributeName="transform" type="skewX" values="0;3;0;-3;0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- ===== Torii gate ===== -->
  <!-- left pillar pair -->
  <path d="M22 30 L 27 30 L 28 68 L 21 68 Z" fill="url(#wood)" stroke="#4a1a10" stroke-width="0.5"/>
  <path d="M30 32 L 34 32 L 35 66 L 29 66 Z" fill="url(#woodDark)" stroke="#4a1a10" stroke-width="0.5" opacity="0.95"/>

  <!-- right pillar pair -->
  <path d="M58 30 L 53 30 L 52 68 L 59 68 Z" fill="url(#wood)" stroke="#4a1a10" stroke-width="0.5"/>
  <path d="M50 32 L 46 32 L 45 66 L 51 66 Z" fill="url(#woodDark)" stroke="#4a1a10" stroke-width="0.5" opacity="0.95"/>

  <!-- diagonal brace beam (nukigata) -->
  <path d="M22 44 L 58 44 L 58 48 L 22 48 Z" fill="url(#woodDark)" stroke="#4a1a10" stroke-width="0.5"/>

  <!-- lower horizontal tie beam -->
  <rect x="24" y="52" width="32" height="3.5" fill="#8f331f" stroke="#4a1a10" stroke-width="0.4"/>

  <!-- kasagi top sweeping beam -->
  <path d="M14 30 Q 40 22 66 30 L 65 25 Q 40 17 15 25 Z" fill="url(#wood)" stroke="#4a1a10" stroke-width="0.6"/>
  <!-- shimaki under-beam -->
  <path d="M17 31 Q 40 25 63 31 L 62.5 34 Q 40 28.5 17.5 34 Z" fill="url(#woodDark)" stroke="#4a1a10" stroke-width="0.5"/>

  <!-- second beam below kasagi (shimagi/gakuzuka support) -->
  <rect x="21" y="36" width="38" height="4" fill="#8f331f" stroke="#4a1a10" stroke-width="0.4"/>

  <!-- central support plaque (gakuzuka) -->
  <rect x="37" y="37" width="6" height="11" fill="#5e2015" stroke="#3c140c" stroke-width="0.4"/>

  <!-- sun glint sweep across the kasagi beam -->
  <path d="M15 27 Q 40 19 65 27" stroke="#ffd9a8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <!-- base rocks just under water line to ground pillars -->
  <ellipse cx="25" cy="63" rx="7" ry="3" fill="#3f6670" opacity="0.5"/>
  <ellipse cx="55" cy="63" rx="7" ry="3" fill="#3f6670" opacity="0.5"/>
</svg>
