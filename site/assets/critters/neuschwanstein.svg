<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="nsSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe8f7"/><stop offset="1" stop-color="#eaf5fc"/>
  </linearGradient>
  <linearGradient id="nsHill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e6a3c"/><stop offset="1" stop-color="#153a20"/>
  </linearGradient>
  <linearGradient id="nsTreeA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f7350"/><stop offset="1" stop-color="#1c3a26"/>
  </linearGradient>
  <linearGradient id="nsTreeB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#49905f"/><stop offset="1" stop-color="#244a32"/>
  </linearGradient>
  <linearGradient id="nsWall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f7f3ec"/><stop offset="1" stop-color="#d9cfbd"/>
  </linearGradient>
  <linearGradient id="nsRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7788a0" stop-opacity="1"/><stop offset="1" stop-color="#3c4a5c"/>
  </linearGradient>
  <linearGradient id="nsFlag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffde70"/><stop offset="1" stop-color="#d9a020"/>
  </linearGradient>
</defs>

<ellipse cx="40" cy="30" rx="32" ry="26" fill="url(#nsSky)" opacity="0.4"/>

<path d="M2,80 Q2,56 40,56 Q78,56 78,80 Z" fill="url(#nsHill)" stroke="#12301b" stroke-width="0.6"/>
<path d="M44,80 Q44,60 68,61 Q75,68 75,80 Z" fill="#2f6b43" opacity="0.55"/>

<path d="M2,74 L7,58 L12,74 Z" fill="url(#nsTreeA)" stroke="#1c3a26" stroke-width="0.5"/>
<path d="M3,66 L7,54 L11,66 Z" fill="url(#nsTreeB)" stroke="#1c3a26" stroke-width="0.5"/>
<rect x="6" y="73" width="2" height="5" fill="#5a3d28"/>

<path d="M68,74 L73,58 L78,74 Z" fill="url(#nsTreeA)" stroke="#1c3a26" stroke-width="0.5"/>
<path d="M69,66 L73,54 L77,66 Z" fill="url(#nsTreeB)" stroke="#1c3a26" stroke-width="0.5"/>
<rect x="72" y="73" width="2" height="5" fill="#5a3d28"/>

<rect x="20" y="44" width="40" height="18" rx="1.5" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.5"/>
<rect x="21" y="40" width="4" height="4" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.4"/>
<rect x="28" y="40" width="4" height="4" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.4"/>
<rect x="53" y="40" width="4" height="4" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.4"/>
<rect x="60" y="40" width="4" height="4" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.4"/>

<rect x="14" y="25" width="12" height="37" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.5"/>
<path d="M13,25 L20,13 L27,25 Z" fill="url(#nsRoof)" stroke="#2f3942" stroke-width="0.5"/>
<rect x="18" y="36" width="4" height="7" rx="2" fill="#2b3a45"/>

<rect x="54" y="25" width="12" height="37" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.5"/>
<path d="M53,25 L60,13 L67,25 Z" fill="url(#nsRoof)" stroke="#2f3942" stroke-width="0.5"/>
<rect x="58" y="36" width="4" height="7" rx="2" fill="#2b3a45"/>

<rect x="31" y="16" width="18" height="46" fill="url(#nsWall)" stroke="#b7ab96" stroke-width="0.6"/>
<path d="M29,16 L40,4 L51,16 Z" fill="url(#nsRoof)" stroke="#2f3942" stroke-width="0.5"/>
<rect x="36" y="24" width="6" height="9" rx="3" fill="#2b3a45"/>
<rect x="36" y="40" width="6" height="9" rx="3" fill="#2b3a45"/>

<path d="M37,62 L37,55 Q37,51 40,51 Q43,51 43,55 L43,62 Z" fill="#2b3a45"/>

<line x1="40" y1="4" x2="40" y2="0" stroke="#5a3d28" stroke-width="1.2"/>
<path d="M40,0 L47,2.5 L40,5 Z" fill="url(#nsFlag)" stroke="#b5891c" stroke-width="0.5" stroke-linejoin="round">
  <animateTransform attributeName="transform" type="rotate" values="0 40 2.5;12 40 2.5;0 40 2.5;-12 40 2.5;0 40 2.5" dur="3s" repeatCount="indefinite"/>
</path>

<circle cx="58" cy="18" r="1.4" fill="#fff6c4">
  <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="22" cy="20" r="1.1" fill="#fff6c4">
  <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
</circle>
</svg>
