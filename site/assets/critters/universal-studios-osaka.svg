<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="usGlobeOcean" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8fd4f5"/>
      <stop offset="60%" stop-color="#2f8fd1"/>
      <stop offset="100%" stop-color="#145a94"/>
    </radialGradient>
    <linearGradient id="usRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe29a"/>
      <stop offset="50%" stop-color="#ffb02e"/>
      <stop offset="100%" stop-color="#d1790f"/>
    </linearGradient>
    <linearGradient id="usGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6b7a"/>
      <stop offset="100%" stop-color="#2e3a44"/>
    </linearGradient>
    <linearGradient id="usPlaza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d3c5"/>
      <stop offset="100%" stop-color="#a69c87"/>
    </linearGradient>
  </defs>

  <!-- entry plaza ground -->
  <ellipse cx="40" cy="76" rx="37" ry="5.5" fill="url(#usPlaza)" stroke="#7a7161" stroke-width="0.5"/>

  <!-- side gate pylons -->
  <rect x="6" y="40" width="7" height="34" rx="1.5" fill="url(#usGate)" stroke="#1d262e" stroke-width="0.5"/>
  <rect x="67" y="40" width="7" height="34" rx="1.5" fill="url(#usGate)" stroke="#1d262e" stroke-width="0.5"/>
  <rect x="4" y="37" width="11" height="4" rx="1" fill="#1d262e"/>
  <rect x="65" y="37" width="11" height="4" rx="1" fill="#1d262e"/>

  <!-- tilted ring holding the rotating globe -->
  <g transform="translate(40,38)">
    <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="url(#usRing)" stroke-width="3.2" transform="rotate(-12)"/>
    <!-- rotating earth globe -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="20" fill="url(#usGlobeOcean)" stroke="#0d3a63" stroke-width="0.6"/>
      <g fill="#59c26b" opacity="0.9">
        <path d="M-14,-6 Q-8,-11 -2,-7 Q2,-3 -4,2 Q-10,5 -14,-1 Z"/>
        <path d="M2,8 Q9,5 14,10 Q12,15 5,14 Q0,12 2,8 Z"/>
        <path d="M-6,-14 Q-1,-16 3,-13 Q0,-10 -4,-11 Z"/>
      </g>
      <g stroke="#ffffff" stroke-width="0.6" opacity="0.35" fill="none">
        <ellipse cx="0" cy="0" rx="20" ry="7"/>
        <ellipse cx="0" cy="0" rx="20" ry="14"/>
        <line x1="0" y1="-20" x2="0" y2="20"/>
      </g>
    </g>
    <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="url(#usRing)" stroke-width="3.2" opacity="0.65" transform="rotate(-12) scale(1,-1)"/>
  </g>

  <!-- sparkle accents -->
  <circle cx="18" cy="26" r="1.4" fill="#fff6c8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="63" cy="22" r="1.1" fill="#fff6c8">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
