<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="gh-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efd8"/>
      <stop offset="1" stop-color="#d9c89e"/>
    </linearGradient>
    <linearGradient id="gh-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a46"/>
      <stop offset="1" stop-color="#453a2c"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <ellipse cx="40" cy="74" rx="28" ry="5" fill="#7ab648" stroke="#4f8a30" stroke-width="0.6"/>

  <!-- Main wall body -->
  <rect x="18" y="46" width="44" height="22" rx="1" fill="url(#gh-wall)" stroke="#9c8a62" stroke-width="0.6"/>

  <!-- Wood beam details on wall -->
  <line x1="18" y1="52" x2="62" y2="52" stroke="#8b6914" stroke-width="1"/>
  <line x1="18" y1="60" x2="62" y2="60" stroke="#8b6914" stroke-width="1"/>
  <line x1="28" y1="46" x2="28" y2="68" stroke="#8b6914" stroke-width="1"/>
  <line x1="52" y1="46" x2="52" y2="68" stroke="#8b6914" stroke-width="1"/>

  <!-- Windows (warm glow) -->
  <rect x="22" y="54" width="8" height="8" rx="1" fill="#ffd060" stroke="#8b6914" stroke-width="1"/>
  <rect x="36" y="54" width="8" height="8" rx="1" fill="#ffd060" stroke="#8b6914" stroke-width="1"/>
  <rect x="50" y="54" width="8" height="8" rx="1" fill="#ffd060" stroke="#8b6914" stroke-width="1"/>

  <!-- Door -->
  <rect x="34" y="58" width="12" height="10" rx="1" fill="#7a5c3a" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Main steep thatched roof -->
  <polygon points="40,8 10,48 70,48" fill="url(#gh-roof)" stroke="#2e2318" stroke-width="0.6"/>

  <!-- Thatch texture lines -->
  <line x1="17" y1="42" x2="63" y2="42" stroke="#7a6a5a" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="36" x2="60" y2="36" stroke="#7a6a5a" stroke-width="1" opacity="0.6"/>
  <line x1="23" y1="30" x2="57" y2="30" stroke="#7a6a5a" stroke-width="1" opacity="0.6"/>
  <line x1="27" y1="24" x2="53" y2="24" stroke="#7a6a5a" stroke-width="1" opacity="0.6"/>
  <line x1="31" y1="18" x2="49" y2="18" stroke="#7a6a5a" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="13" x2="45" y2="13" stroke="#7a6a5a" stroke-width="1" opacity="0.6"/>

  <!-- Snow on roof top -->
  <polygon points="40,8 28,22 52,22" fill="#ffffff" opacity="0.92"/>
  <!-- Snow ridge cap -->
  <ellipse cx="40" cy="8" rx="3" ry="2" fill="#ffffff" opacity="0.92"/>

  <!-- Snowflake 1 -->
  <circle cx="15" cy="10" r="1.5" fill="white" opacity="0.85">
    <animate attributeName="cy" values="5;75" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Snowflake 2 -->
  <circle cx="65" cy="10" r="1.2" fill="white" opacity="0.8">
    <animate attributeName="cy" values="5;75" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Snowflake 3 -->
  <circle cx="10" cy="10" r="1" fill="white" opacity="0.75">
    <animate attributeName="cy" values="5;75" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Snowflake 4 -->
  <circle cx="55" cy="10" r="1.3" fill="white" opacity="0.8">
    <animate attributeName="cy" values="5;75" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Snowflake 5 -->
  <circle cx="35" cy="10" r="1.1" fill="white" opacity="0.7">
    <animate attributeName="cy" values="5;75" dur="3.8s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3.8s" begin="3s" repeatCount="indefinite"/>
  </circle>

</svg>
