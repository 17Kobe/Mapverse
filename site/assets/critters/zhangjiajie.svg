<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 地面 -->
  <ellipse cx="40" cy="73" rx="32" ry="5" fill="#5a7a3a" stroke="white" stroke-width="1.5"/>

  <!-- 後排較矮石柱（遠景，偏暗） -->
  <path d="M8,70 L10,34 L14,30 L17,34 L16,70 Z" fill="#9a6a52" stroke="white" stroke-width="1.3"/>
  <path d="M62,70 L64,28 L68,23 L72,28 L70,70 Z" fill="#9a6a52" stroke="white" stroke-width="1.3"/>

  <!-- 中景石柱 -->
  <path d="M46,70 L48,24 L52,18 L57,24 L55,70 Z" fill="#b57858" stroke="white" stroke-width="1.5"/>

  <!-- 前景主石柱（最高最顯眼，略微錐狀收窄） -->
  <path d="M22,71 L24,16 L30,7 L37,16 L35,71 Z" fill="#c8886a" stroke="white" stroke-width="2"/>
  <!-- 主石柱縱向紋理 -->
  <line x1="27" y1="20" x2="26" y2="68" stroke="#9a6248" stroke-width="1" opacity="0.6"/>
  <line x1="31" y1="15" x2="31" y2="69" stroke="#9a6248" stroke-width="1" opacity="0.5"/>

  <!-- 石柱頂部植被（不規則小叢，不是整齊圓形） -->
  <path d="M21,16 Q24,10 30,8 Q36,10 38,16 Q33,13 30,13 Q26,13 21,16Z" fill="#3d7a2e" stroke="white" stroke-width="1"/>
  <ellipse cx="53" cy="19" rx="6" ry="4" fill="#4a8f38" stroke="white" stroke-width="0.9"/>
  <ellipse cx="13" cy="31" rx="4.5" ry="3.2" fill="#4a8f38" stroke="white" stroke-width="0.8"/>
  <ellipse cx="68" cy="24" rx="4.5" ry="3.2" fill="#4a8f38" stroke="white" stroke-width="0.8"/>

  <!-- 雲霧飄帶：細長柔和的半透明橢圓，不是整條色塊 -->
  <g opacity="0.75">
    <ellipse cx="28" cy="44" rx="26" ry="3.2" fill="white"/>
    <ellipse cx="50" cy="50" rx="18" ry="2.6" fill="white" opacity="0.8"/>
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="4.5s" repeatCount="indefinite"/>
  </g>
</svg>
