<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="zjGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FA052"/>
      <stop offset="100%" stop-color="#3F5C28"/>
    </linearGradient>
    <linearGradient id="zjRock" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8B890"/>
      <stop offset="100%" stop-color="#788A64"/>
    </linearGradient>
    <linearGradient id="zjGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EA042"/>
      <stop offset="100%" stop-color="#2E5A20"/>
    </linearGradient>
  </defs>
  <!-- 地面 -->
  <ellipse cx="40" cy="74" rx="34" ry="4.5" fill="url(#zjGround)" stroke="#2C421C" stroke-width="0.5"/>

  <!-- 山體：一整座山脊，中央被天門洞貫穿 -->
  <path d="M4,70 L10,42 L18,30 L26,38 L32,20 Q40,8 48,20 L54,38 L62,30 L70,42 L76,70 Z"
    fill="url(#zjRock)" stroke="#3F4A32" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- 山體暗面（右側） -->
  <path d="M48,20 L54,38 L62,30 L70,42 L76,70 L58,70 Q50,45 48,20 Z"
    fill="#6e7e5c" opacity="0.55"/>
  <!-- 山體岩紋（風化紋理） -->
  <path d="M14,52 Q18,44 24,40 M58,50 Q62,42 68,38" stroke="#5C6E48" stroke-width="0.8" opacity="0.5" fill="none"/>

  <!-- 天門洞：貫穿山體的巨大橢圓孔洞，露出後方天空 -->
  <ellipse cx="40" cy="44" rx="13" ry="17" fill="#8ec8e8"/>
  <!-- 洞口邊緣岩石描邊，增加厚度感 -->
  <ellipse cx="40" cy="44" rx="13" ry="17" fill="none" stroke="#3F4A32" stroke-width="0.7"/>
  <ellipse cx="40" cy="44" rx="10.5" ry="14.3" fill="none" stroke="#5a6a48" stroke-width="1.4" opacity="0.6"/>
  <!-- 洞內遠方的雲朵，增加縱深感 -->
  <ellipse cx="37" cy="40" rx="4.5" ry="2.2" fill="white" opacity="0.75"/>
  <ellipse cx="43" cy="49" rx="3.5" ry="1.8" fill="white" opacity="0.6"/>

  <!-- 天梯石階：從山腳蜿蜒而上通往洞口 -->
  <path d="M26,70 Q29,60 32,52 Q35,47 37,44"
    fill="none" stroke="#c8c0a0" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M26,70 Q29,60 32,52 Q35,47 37,44"
    fill="none" stroke="#F0E6C0" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- 山頂植被 -->
  <ellipse cx="18" cy="29" rx="5" ry="3.2" fill="url(#zjGrass)" stroke="#223E18" stroke-width="0.4"/>
  <ellipse cx="62" cy="29" rx="5" ry="3.2" fill="url(#zjGrass)" stroke="#223E18" stroke-width="0.4"/>
  <ellipse cx="40" cy="12" rx="6" ry="3.5" fill="url(#zjGrass)" stroke="#223E18" stroke-width="0.4"/>

  <!-- 雲霧飄帶：柔和橫越山腰 -->
  <g opacity="0.7">
    <ellipse cx="16" cy="58" rx="12" ry="2.6" fill="white"/>
    <ellipse cx="64" cy="55" rx="11" ry="2.4" fill="white" opacity="0.8"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4.5s" repeatCount="indefinite"/>
  </g>
</svg>
