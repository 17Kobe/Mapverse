<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">

  <!-- Ground shadow -->
  <ellipse cx="40" cy="74" rx="28" ry="5" fill="#5a4a3a" opacity="0.4"/>
  
  <!-- Back pillars (shorter, darker) -->
  <!-- Back pillar 1 - far left -->
  <rect x="8" y="28" width="8" height="38" rx="2" fill="#6b5c4a" stroke="white" stroke-width="1.5"/>
  <line x1="10" y1="30" x2="10" y2="64" stroke="#5a4a38" stroke-width="0.7" opacity="0.6"/>
  <line x1="13" y1="30" x2="13" y2="64" stroke="#5a4a38" stroke-width="0.7" opacity="0.6"/>
  <!-- Vegetation top -->
  <ellipse cx="12" cy="28" rx="6" ry="4" fill="#3d7a2e" stroke="white" stroke-width="1.2"/>
  <ellipse cx="9" cy="27" rx="4" ry="3" fill="#4a8f38"/>
  <ellipse cx="15" cy="27" rx="4" ry="3" fill="#4a8f38"/>

  <!-- Back pillar 2 - far right -->
  <rect x="62" y="22" width="9" height="44" rx="2" fill="#6b5c4a" stroke="white" stroke-width="1.5"/>
  <line x1="64" y1="24" x2="64" y2="64" stroke="#5a4a38" stroke-width="0.7" opacity="0.6"/>
  <line x1="68" y1="24" x2="68" y2="64" stroke="#5a4a38" stroke-width="0.7" opacity="0.6"/>
  <!-- Vegetation top -->
  <ellipse cx="66" cy="22" rx="6" ry="4" fill="#3d7a2e" stroke="white" stroke-width="1.2"/>
  <ellipse cx="63" cy="21" rx="4" ry="3" fill="#4a8f38"/>
  <ellipse cx="69" cy="21" rx="4" ry="3" fill="#4a8f38"/>

  <!-- Mid pillar -->
  <rect x="47" y="30" width="10" height="36" rx="2" fill="#7a6a58" stroke="white" stroke-width="1.5"/>
  <line x1="50" y1="32" x2="50" y2="64" stroke="#6a5a48" stroke-width="0.8" opacity="0.6"/>
  <line x1="54" y1="32" x2="54" y2="64" stroke="#6a5a48" stroke-width="0.8" opacity="0.6"/>
  <!-- Vegetation top -->
  <ellipse cx="52" cy="30" rx="7" ry="4.5" fill="#3d7a2e" stroke="white" stroke-width="1.2"/>
  <ellipse cx="48" cy="28" rx="5" ry="3.5" fill="#4a8f38"/>
  <ellipse cx="56" cy="28" rx="5" ry="3.5" fill="#4a8f38"/>

  <!-- Front tall pillar (main) -->
  <rect x="23" y="15" width="13" height="52" rx="2.5" fill="#8a7a68" stroke="white" stroke-width="1.5"/>
  <line x1="27" y1="18" x2="27" y2="65" stroke="#7a6a58" stroke-width="0.9" opacity="0.6"/>
  <line x1="32" y1="18" x2="32" y2="65" stroke="#7a6a58" stroke-width="0.9" opacity="0.6"/>
  <!-- Wider vegetation top -->
  <ellipse cx="29" cy="15" rx="9" ry="5.5" fill="#3d7a2e" stroke="white" stroke-width="1.3"/>
  <ellipse cx="24" cy="13" rx="6" ry="4" fill="#4a8f38"/>
  <ellipse cx="34" cy="13" rx="6" ry="4" fill="#4a8f38"/>
  <ellipse cx="29" cy="11" rx="5" ry="3.5" fill="#5aaa42"/>

  <!-- Cloud / mist band layer 1 -->
  <g>
    <rect x="4" y="43" width="72" height="9" rx="4.5" fill="white" opacity="0.55"/>
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Cloud / mist band layer 2 (offset timing) -->
  <g>
    <rect x="0" y="47" width="80" height="6" rx="3" fill="white" opacity="0.35"/>
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="5.5s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- Ground base small bumps -->
  <ellipse cx="40" cy="68" rx="30" ry="5" fill="#7a6a4a" stroke="white" stroke-width="1.2"/>
  <ellipse cx="25" cy="67" rx="8" ry="3" fill="#8a7a5a"/>
  <ellipse cx="55" cy="67" rx="7" ry="3" fill="#8a7a5a"/>

</svg>