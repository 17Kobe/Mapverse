<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6a23a" stop-opacity=".0"/><stop offset="1" stop-color="#f6a23a" stop-opacity=".35"/></linearGradient>
    <symbol id="wb" viewBox="0 0 30 22">
      <path d="M4 10 Q4 4 12 4 L22 4 Q28 4 28 10 L27 14 L24 14 L24 20 L21 20 L20 14 L11 14 L10 20 L7 20 L8 14 L5 14Z" fill="#4a3a30"/>
      <path d="M4 8 Q0 8 0 12 Q0 16 4 14 L6 10Z" fill="#3a2a22"/>
      <path d="M2 6 L1 2 M4 6 L5 1" stroke="#2a1c14" stroke-width="1.2"/>
    </symbol>
  </defs>
  <!-- 塞倫蓋提：金合歡樹下，數百萬隻角馬（還有斑馬）橫越草原的大遷徙 -->
  <circle cx="126" cy="22" r="12" fill="#ffd86a" opacity=".9"/>
  <rect x="0" y="0" width="160" height="70" fill="url(#sk)"/>
  <path d="M0 72 Q40 66 80 70 T160 68 V100 H0Z" fill="#c8a85a"/>
  <path d="M0 86 Q40 82 80 86 T160 84 V100 H0Z" fill="#b8944a"/>
  <!-- 金合歡 -->
  <g>
    <path d="M24 72 Q24 52 20 40 M24 56 Q34 48 44 46 M24 52 Q14 46 8 42" stroke="#5a4028" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="22" cy="36" rx="22" ry="7" fill="#5f8a3a"/><ellipse cx="40" cy="42" rx="14" ry="5" fill="#6f9a44"/><ellipse cx="8" cy="40" rx="10" ry="4" fill="#527a32"/>
  </g>
  <!-- 遷徙的角馬群（往右移動並循環） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-70 0;0 0" dur="9s" repeatCount="indefinite"/>
    <use href="#wb" x="60" y="70" width="26" height="19"/><use href="#wb" x="86" y="74" width="24" height="17"/><use href="#wb" x="104" y="68" width="26" height="19"/><use href="#wb" x="124" y="76" width="22" height="16"/>
    <use href="#wb" x="30" y="78" width="26" height="19"/><use href="#wb" x="52" y="82" width="24" height="17"/><use href="#wb" x="146" y="70" width="24" height="17"/><use href="#wb" x="136" y="82" width="24" height="17"/>
    <g fill="#f4f4f4" stroke="#2a2a33" stroke-width="1.2"><ellipse cx="96" cy="86" rx="8" ry="4.6"/><path d="M89 83 V88 M93 82 V88 M98 82 V88 M102 84 V88" stroke="#2a2a33"/></g>
  </g>
  <!-- 塵土 -->
  <g fill="#e0c98a" opacity=".6"><ellipse cx="60" cy="92" rx="14" ry="3"><animate attributeName="cx" values="30;110" dur="9s" repeatCount="indefinite"/></ellipse></g>
</svg>
