<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2c35"/><stop offset="1" stop-color="#0c0c11"/></linearGradient>
  </defs>
  <!-- 日本的「黑船」：1853 年培里提督的蒸汽明輪軍艦，黑色船身、冒煙的煙囪、兩側有明輪 -->
  <!-- 煙 -->
  <g fill="#8f95a3"><circle cx="62" cy="30" r="8" opacity=".75"/><circle cx="50" cy="20" r="9" opacity=".6"/><circle cx="36" cy="12" r="10" opacity=".45"/><circle cx="22" cy="8" r="9" opacity=".3"/></g>
  <!-- 桅杆與收起的帆 -->
  <g fill="#2a2a33"><rect x="19" y="36" width="2.6" height="48"/><rect x="42" y="30" width="2.8" height="54"/><rect x="100" y="40" width="2.6" height="42"/></g>
  <g fill="#e6e3da" stroke="#9c998c" stroke-width="1"><rect x="8" y="44" width="25" height="6" rx="3"/><rect x="10" y="60" width="21" height="6" rx="3"/><rect x="30" y="38" width="28" height="6" rx="3"/><rect x="32" y="56" width="24" height="6" rx="3"/><rect x="90" y="48" width="22" height="6" rx="3"/></g>
  <path d="M2 82 L19 52 L19 80Z" fill="#e6e3da" stroke="#9c998c" stroke-width="1"/>
  <!-- 煙囪 -->
  <rect x="62" y="34" width="14" height="48" fill="#17171d"/>
  <rect x="62" y="34" width="14" height="5" fill="#c0302a"/>
  <!-- 船身：黑色，舷側一排砲門 -->
  <path d="M2 84 L124 78 L120 100 Q110 114 90 116 L24 116 Q8 110 2 84Z" fill="url(#h)"/>
  <path d="M6 93 L118 90" stroke="#e8d28a" stroke-width="4"/>
  <g fill="#0c0c11"><rect x="12" y="91" width="5" height="4"/><rect x="24" y="91" width="5" height="4"/><rect x="36" y="91" width="5" height="4"/><rect x="82" y="91" width="5" height="4"/><rect x="94" y="91" width="5" height="4"/><rect x="106" y="91" width="5" height="4"/></g>
  <!-- 明輪 -->
  <path d="M50 88 A19 19 0 0 1 88 88Z" fill="#3a3b46" stroke="#17171d" stroke-width="2"/>
  <g stroke="#d9d6cb" stroke-width="1.6"><path d="M69 88 L69 71 M69 88 L56 76 M69 88 L82 76"/></g>
  <!-- 星條旗 -->
  <rect x="115" y="50" width="2" height="30" fill="#2a2a33"/>
  <rect x="106" y="50" width="9" height="8" fill="#f4f4f4"/>
  <g fill="#c0302a"><rect x="106" y="50" width="9" height="1.6"/><rect x="106" y="53.2" width="9" height="1.6"/><rect x="106" y="56.4" width="9" height="1.6"/></g>
  <rect x="106" y="50" width="4.4" height="4.4" fill="#2a4a9a"/>
</svg>
