<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="gcGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7b35a"/>
      <stop offset="100%" stop-color="#8f7a30"/>
    </linearGradient>
    <linearGradient id="gcHorse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#4a2e16"/>
    </linearGradient>
    <linearGradient id="gcPoncho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d94f3c"/>
      <stop offset="100%" stop-color="#8a2a1e"/>
    </linearGradient>
  </defs>

  <!-- pampas grassland -->
  <path d="M0,80 L0,68 Q40,63 80,68 L80,80 Z" fill="url(#gcGrass)"/>
  <g stroke="#a89040" stroke-width="0.6" opacity="0.6">
    <line x1="8" y1="68" x2="6" y2="61"/>
    <line x1="68" y1="69" x2="70" y2="62"/>
  </g>

  <!-- the horse, walking -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="1.1s" repeatCount="indefinite"/>

    <!-- legs -->
    <g stroke="url(#gcHorse)" stroke-width="2.6" stroke-linecap="round">
      <line x1="20" y1="60" x2="17" y2="75">
        <animateTransform attributeName="transform" type="rotate" values="8 20 60;-10 20 60;8 20 60" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="30" y1="62" x2="33" y2="76">
        <animateTransform attributeName="transform" type="rotate" values="-8 30 62;10 30 62;-8 30 62" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="48" y1="60" x2="51" y2="75">
        <animateTransform attributeName="transform" type="rotate" values="-8 48 60;10 48 60;-8 48 60" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="56" y1="61" x2="54" y2="76">
        <animateTransform attributeName="transform" type="rotate" values="8 56 61;-10 56 61;8 56 61" dur="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- body -->
    <path d="M16,50 C14,42 22,36 36,36 C50,36 58,42 58,50 C58,58 48,62 36,62 C24,62 17,58 16,50 Z"
          fill="url(#gcHorse)" stroke="#2e1a0b" stroke-width="0.5"/>
    <!-- tail -->
    <path d="M58,48 C64,52 66,60 63,68" fill="none" stroke="#2e1a0b" stroke-width="2.4" stroke-linecap="round"/>
    <!-- neck + head -->
    <path d="M14,46 C9,42 5,38 4,32 C8,30 13,33 16,38 C18,42 17,45 14,46 Z" fill="url(#gcHorse)" stroke="#2e1a0b" stroke-width="0.5"/>
    <path d="M4,32 L7,27" stroke="url(#gcHorse)" stroke-width="2" stroke-linecap="round"/>
    <!-- mane -->
    <path d="M10,34 C7,31 6,27 8,23" fill="none" stroke="#1f120a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="4" cy="31" rx="1.1" ry="0.8" fill="#1a0f08"/>

    <!-- rider: the gaucho, with wide-brimmed hat and poncho -->
    <g transform="translate(34,20)">
      <!-- legs astride -->
      <path d="M-4,18 L-7,32" stroke="#3a2a1c" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M4,18 L7,32" stroke="#3a2a1c" stroke-width="2.6" stroke-linecap="round"/>
      <!-- poncho body -->
      <path d="M-8,6 C-8,0 -3,-4 3,-4 C8,-4 11,0 10,6 L8,20 L-6,20 Z" fill="url(#gcPoncho)" stroke="#5c1a12" stroke-width="0.5"/>
      <!-- fringe along poncho hem -->
      <g stroke="#5c1a12" stroke-width="0.8" opacity="0.7">
        <line x1="-5" y1="20" x2="-5" y2="23"/>
        <line x1="-1" y1="20" x2="-1" y2="23"/>
        <line x1="3" y1="20" x2="3" y2="23"/>
        <line x1="7" y1="20" x2="7" y2="23"/>
      </g>
      <!-- arm holding reins -->
      <path d="M-7,4 L-12,10" stroke="url(#gcPoncho)" stroke-width="2.6" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="1" cy="-7" r="4" fill="#d9a271" stroke="#9c6a40" stroke-width="0.3"/>
      <!-- wide-brimmed hat -->
      <ellipse cx="1" cy="-11" rx="7.5" ry="2" fill="#5c4326" stroke="#2e2010" stroke-width="0.4"/>
      <path d="M-3,-11 Q1,-17 5,-11 Z" fill="#5c4326" stroke="#2e2010" stroke-width="0.4"/>
    </g>
  </g>
</svg>
