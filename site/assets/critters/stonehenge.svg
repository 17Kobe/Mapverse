<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#b9bcb4"/><stop offset=".5" stop-color="#8f938c"/><stop offset="1" stop-color="#666a64"/></linearGradient>
    <radialGradient id="sn" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".4" stop-color="#ffd86a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd86a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- 英國巨石陣（約西元前 3000 年）：圓環排列的巨大立石與橫梁，日出時陽光穿過石縫 -->
  <circle cx="64" cy="70" r="50" fill="url(#sn)"><animate attributeName="opacity" values=".8;1;.8" dur="4s" repeatCount="indefinite"/></circle>
  <path d="M0 98 Q32 90 64 94 T128 96 V128 H0Z" fill="#7aa05a"/>
  <!-- 後排小立石 -->
  <g fill="url(#st)" stroke="#555953" stroke-width="1">
    <rect x="12" y="84" width="9" height="16" rx="2"/><rect x="26" y="82" width="8" height="18" rx="2"/><rect x="94" y="82" width="8" height="18" rx="2"/><rect x="108" y="84" width="9" height="16" rx="2"/>
  </g>
  <!-- 三石塔（兩根立石 + 一根橫梁） -->
  <g fill="url(#st)" stroke="#555953" stroke-width="1.2">
    <rect x="30" y="52" width="12" height="54" rx="2"/><rect x="50" y="52" width="12" height="54" rx="2"/><rect x="28" y="44" width="36" height="10" rx="2"/>
    <rect x="68" y="56" width="12" height="50" rx="2"/><rect x="88" y="56" width="12" height="50" rx="2"/><rect x="66" y="48" width="36" height="10" rx="2"/>
    <rect x="52" y="78" width="10" height="30" rx="2"/>
  </g>
  <g stroke="#555953" stroke-width="1" opacity=".5" fill="none"><path d="M34 58 V100 M54 58 V100 M72 62 V100 M92 62 V100 M33 48 H58 M71 52 H96"/></g>
  <path d="M0 108 H128" stroke="#5f8a46" stroke-width="2"/>
</svg>
