<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="pillarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2443a"/>
      <stop offset="45%" stop-color="#b4241c"/>
      <stop offset="100%" stop-color="#7c130f"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a24"/>
      <stop offset="100%" stop-color="#2e1c10"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1c10"/>
      <stop offset="100%" stop-color="#140b05"/>
    </linearGradient>
    <radialGradient id="lanternGrad" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ff9a5c"/>
      <stop offset="35%" stop-color="#ef4426"/>
      <stop offset="75%" stop-color="#c81e1e"/>
      <stop offset="100%" stop-color="#8f0f0f"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffe08a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff8a4c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a14"/>
      <stop offset="100%" stop-color="#050302"/>
    </linearGradient>
  </defs>

  <!-- base stones -->
  <rect x="4" y="74" width="20" height="6" rx="2" fill="#4a4038" stroke="#2b2620" stroke-width="0.5"/>
  <rect x="56" y="74" width="20" height="6" rx="2" fill="#4a4038" stroke="#2b2620" stroke-width="0.5"/>

  <!-- pillars -->
  <rect x="8" y="14" width="11" height="64" rx="3" fill="url(#pillarGrad)" stroke="#5c0f0a" stroke-width="0.6"/>
  <rect x="61" y="14" width="11" height="64" rx="3" fill="url(#pillarGrad)" stroke="#5c0f0a" stroke-width="0.6"/>

  <!-- gate beam + roof -->
  <rect x="6" y="9" width="68" height="9" rx="2" fill="url(#beamGrad)" stroke="#1a0f08" stroke-width="0.5"/>
  <rect x="3" y="3" width="74" height="6" rx="2" fill="url(#roofGrad)" stroke="#0a0604" stroke-width="0.5"/>

  <!-- swaying lantern -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 40 16; 3 40 16; -3 40 16" dur="4.5s" repeatCount="indefinite"/>

    <rect x="37" y="14" width="6" height="9" fill="#1c1410"/>

    <ellipse cx="40" cy="24" rx="15" ry="5" fill="url(#capGrad)" stroke="#000000" stroke-width="0.4"/>

    <path d="M25,24 C14,30 14,56 25,62 L55,62 C66,56 66,30 55,24 Z" fill="url(#lanternGrad)" stroke="#6e0c0c" stroke-width="0.5"/>

    <line x1="23" y1="30" x2="57" y2="30" stroke="#1a0906" stroke-width="1.1" opacity="0.85"/>
    <line x1="17" y1="37" x2="63" y2="37" stroke="#1a0906" stroke-width="1.4" opacity="0.85"/>
    <line x1="15" y1="45" x2="65" y2="45" stroke="#1a0906" stroke-width="1.4" opacity="0.85"/>
    <line x1="17" y1="53" x2="63" y2="53" stroke="#1a0906" stroke-width="1.1" opacity="0.85"/>

    <ellipse cx="40" cy="42" rx="16" ry="18" fill="url(#glowGrad)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="40" cy="62" rx="15" ry="5" fill="url(#capGrad)" stroke="#000000" stroke-width="0.4"/>

    <line x1="40" y1="67" x2="40" y2="74" stroke="#1c1410" stroke-width="2"/>
    <path d="M33,74 Q40,81 47,74 Q44,78.5 40,78.5 Q36,78.5 33,74 Z" fill="#1c1410"/>
  </g>
</svg>
