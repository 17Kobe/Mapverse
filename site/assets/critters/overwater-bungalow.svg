<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">

  <!-- Water surface -->
  <ellipse cx="40" cy="68" rx="36" ry="6" fill="#5bb8f5" stroke="white" stroke-width="1"/>
  
  <!-- Water shimmer lines -->
  <g opacity="0.6">
    <path d="M10 66 Q18 63 26 66" fill="none" stroke="#a8d8f0" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M14 70 Q22 67 30 70" fill="none" stroke="#a8d8f0" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M30 68 Q40 65 50 68" fill="none" stroke="#a8d8f0" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M46 70 Q54 67 62 70" fill="none" stroke="#a8d8f0" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M50 66 Q58 63 66 66" fill="none" stroke="#a8d8f0" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Support poles (4 stilts) -->
  <rect x="32" y="50" width="3" height="18" rx="1" fill="#7a4a20" stroke="white" stroke-width="1"/>
  <rect x="39" y="50" width="3" height="18" rx="1" fill="#7a4a20" stroke="white" stroke-width="1"/>
  <rect x="46" y="50" width="3" height="18" rx="1" fill="#7a4a20" stroke="white" stroke-width="1"/>
  <rect x="53" y="50" width="3" height="18" rx="1" fill="#7a4a20" stroke="white" stroke-width="1"/>

  <!-- Platform floor -->
  <rect x="28" y="48" width="32" height="5" rx="2" fill="#c89060" stroke="white" stroke-width="1.5"/>

  <!-- Cabin walls -->
  <rect x="32" y="33" width="24" height="18" rx="2" fill="#c89060" stroke="white" stroke-width="1.5"/>
  
  <!-- Cabin door -->
  <rect x="40" y="42" width="8" height="9" rx="1" fill="#7a4a20" stroke="white" stroke-width="1"/>
  
  <!-- Cabin window -->
  <rect x="34" y="37" width="6" height="5" rx="1" fill="#ffe4a0" stroke="white" stroke-width="1"/>

  <!-- Thatched roof base -->
  <polygon points="28,34 56,34 62,24 22,24" fill="#8b6914" stroke="white" stroke-width="1.5"/>
  <!-- Thatched roof peak -->
  <polygon points="22,24 62,24 54,14 30,14" fill="#a07820" stroke="white" stroke-width="1.5"/>
  <!-- Roof ridge -->
  <polygon points="30,14 54,14 50,10 34,10" fill="#c8a030" stroke="white" stroke-width="1.5"/>
  <!-- Thatch texture lines -->
  <line x1="30" y1="24" x2="26" y2="34" stroke="#6b5010" stroke-width="0.8" opacity="0.6"/>
  <line x1="36" y1="24" x2="34" y2="34" stroke="#6b5010" stroke-width="0.8" opacity="0.6"/>
  <line x1="42" y1="24" x2="42" y2="34" stroke="#6b5010" stroke-width="0.8" opacity="0.6"/>
  <line x1="48" y1="24" x2="50" y2="34" stroke="#6b5010" stroke-width="0.8" opacity="0.6"/>
  <line x1="54" y1="24" x2="58" y2="34" stroke="#6b5010" stroke-width="0.8" opacity="0.6"/>

  <!-- Hammock rope left post -->
  <line x1="15" y1="50" x2="15" y2="62" stroke="#7a4a20" stroke-width="2" stroke-linecap="round"/>
  <!-- Hammock rope right attachment to cabin pole -->
  <line x1="29" y1="50" x2="29" y2="62" stroke="#7a4a20" stroke-width="2" stroke-linecap="round"/>
  <!-- Hammock sling -->
  <path d="M15 54 Q22 62 29 54" fill="none" stroke="#d4a860" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-3,22,57;3,22,57;-3,22,57" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- Hammock bottom curve (fabric) -->
  <path d="M15 54 Q22 63 29 54" fill="#e8c878" stroke="none" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="-3,22,57;3,22,57;-3,22,57" dur="3s" repeatCount="indefinite"/>
  </path>

</svg>