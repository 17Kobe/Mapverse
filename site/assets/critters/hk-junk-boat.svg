<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="hjSail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2a66a"/>
      <stop offset="100%" stop-color="#c2642f"/>
    </linearGradient>
    <linearGradient id="hjHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a2e20"/>
      <stop offset="100%" stop-color="#4a1811"/>
    </linearGradient>
    <linearGradient id="hjWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fe0ec"/>
      <stop offset="100%" stop-color="#2d7ea0"/>
    </linearGradient>
  </defs>

  <!-- harbour water -->
  <path d="M0,80 L0,62 Q20,57 40,61 Q60,65 80,59 L80,80 Z" fill="url(#hjWater)"/>
  <g stroke="#eaf8fc" stroke-width="0.6" fill="none" opacity="0.6">
    <path d="M4,68 Q12,66 20,68"/>
    <path d="M50,70 Q58,68 66,70"/>
  </g>

  <!-- gentle rocking of the whole junk -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.5 40 62;1.5 40 62;-1.5 40 62" dur="3.4s" repeatCount="indefinite"/>

    <!-- hull, upswept bow and stern -->
    <path d="M10,58 Q8,66 14,70 L50,70 Q58,68 62,58 Q56,61 44,61 L18,61 Q12,61 10,58 Z"
          fill="url(#hjHull)" stroke="#2a0f0a" stroke-width="0.6"/>
    <path d="M10,58 C6,54 6,48 12,46" fill="none" stroke="url(#hjHull)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M62,58 C67,56 69,50 65,46" fill="none" stroke="url(#hjHull)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M8,62 L64,62" stroke="#2a0f0a" stroke-width="0.8" opacity="0.5"/>

    <!-- mast -->
    <line x1="34" y1="60" x2="34" y2="14" stroke="#4a3018" stroke-width="1.4"/>
    <line x1="48" y1="60" x2="48" y2="24" stroke="#4a3018" stroke-width="1.1"/>

    <!-- large battened mainsail with the characteristic horizontal bamboo ribs -->
    <path d="M34,16 L58,24 L56,52 L34,58 Z" fill="url(#hjSail)" stroke="#7c3a1c" stroke-width="0.6"/>
    <g stroke="#7c3a1c" stroke-width="0.6" opacity="0.7">
      <line x1="35" y1="23" x2="57" y2="27"/>
      <line x1="35" y1="31" x2="57" y2="34"/>
      <line x1="35" y1="39" x2="56" y2="41"/>
      <line x1="35" y1="47" x2="56" y2="48"/>
    </g>

    <!-- smaller foresail -->
    <path d="M48,26 L63,32 L61,50 L48,54 Z" fill="url(#hjSail)" stroke="#7c3a1c" stroke-width="0.5" opacity="0.95"/>
    <g stroke="#7c3a1c" stroke-width="0.5" opacity="0.6">
      <line x1="49" y1="33" x2="62" y2="35"/>
      <line x1="49" y1="41" x2="61" y2="42"/>
    </g>

    <!-- red lanterns at the stern -->
    <g>
      <ellipse cx="14" cy="52" rx="2.2" ry="2.8" fill="#e23b2f" stroke="#7a1a12" stroke-width="0.4"/>
      <ellipse cx="18" cy="56" rx="1.8" ry="2.3" fill="#e23b2f" stroke="#7a1a12" stroke-width="0.4"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- gulls over the harbour -->
  <path d="M60,16 Q63,13 66,16 Q63,15 60,16 Z" fill="none" stroke="#5c5c5c" stroke-width="0.8">
    <animate attributeName="d" values="M60,16 Q63,13 66,16 Q63,15 60,16 Z;M60,16 Q63,18 66,16 Q63,15 60,16 Z;M60,16 Q63,13 66,16 Q63,15 60,16 Z" dur="1.4s" repeatCount="indefinite"/>
  </path>
</svg>
