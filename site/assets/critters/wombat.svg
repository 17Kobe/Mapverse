<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c7a579"/>
    <stop offset="100%" stop-color="#8a6945"/>
  </linearGradient>
  <linearGradient id="moundGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7f6044"/>
    <stop offset="100%" stop-color="#4a3824"/>
  </linearGradient>
  <radialGradient id="furGrad" cx="35%" cy="25%" r="80%">
    <stop offset="0%" stop-color="#a9916f"/>
    <stop offset="100%" stop-color="#6b5640"/>
  </radialGradient>
</defs>
<g>
  <!-- 地面小丘（半橢圓，非整版背景) -->
  <path d="M8,70 A32,10 0 0 1 72,70 L72,80 L8,80 Z" fill="url(#groundGrad)" stroke="#6e5234" stroke-width="0.6"/>
  <!-- 挖出的土堆 -->
  <path d="M8,61 A15,12 0 0 1 38,60 L38,72 L8,72 Z" fill="url(#moundGrad)" stroke="#2e2113" stroke-width="0.5"/>
  <!-- 土堆質感土塊 -->
  <circle cx="14" cy="60" r="2.3" fill="#523c28"/>
  <circle cx="22" cy="57" r="2" fill="#523c28"/>
  <circle cx="30" cy="59" r="2.1" fill="#523c28"/>

  <!-- 袋熊身體（後半身） -->
  <ellipse cx="45" cy="49" rx="21" ry="15" fill="url(#furGrad)" stroke="#4a3828" stroke-width="0.6"/>
  <!-- 腹部淺色區塊 -->
  <ellipse cx="50" cy="58" rx="12.5" ry="7" fill="#c9b89a"/>
  <!-- 短尾 -->
  <circle cx="65" cy="45" r="6" fill="url(#furGrad)" stroke="#4a3828" stroke-width="0.5"/>

  <!-- 洞口（蓋住前半身，製造鑽入土洞的效果） -->
  <ellipse cx="26" cy="53" rx="15" ry="12" fill="#2e1f14" stroke="#17100a" stroke-width="0.5"/>

  <!-- 後腿 1（刨土動作） -->
  <g>
    <ellipse cx="38" cy="63" rx="7.3" ry="6.3" fill="url(#furGrad)" stroke="#4a3828" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="-18 38 56;16 38 56;-18 38 56" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M34,68 L33,71 M38,69 L38,72 M42,68 L43,71" stroke="#3a2a1c" stroke-width="0.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-18 38 56;16 38 56;-18 38 56" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 後腿 2（刨土動作，反相擺動） -->
  <g>
    <ellipse cx="54" cy="64" rx="7.3" ry="6.3" fill="url(#furGrad)" stroke="#4a3828" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="14 54 57;-18 54 57;14 54 57" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M50,69 L49,72 M54,70 L54,73 M58,69 L59,72" stroke="#3a2a1c" stroke-width="0.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="14 54 57;-18 54 57;14 54 57" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 刨土飛起的塵土 -->
  <circle cx="29" cy="66" r="1.8" fill="#8a7560" opacity="0.7">
    <animate attributeName="cy" values="66;58;66" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="68" r="1.6" fill="#8a7560" opacity="0.6">
    <animate attributeName="cy" values="68;60;68" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
