<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8c257"/>
    <stop offset="100%" stop-color="#b8841a"/>
  </linearGradient>
  <linearGradient id="gazelleGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d9a06a"/>
    <stop offset="100%" stop-color="#9c6530"/>
  </linearGradient>
  <radialGradient id="shieldGrad" cx="35%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#e8524b"/>
    <stop offset="100%" stop-color="#9c1c1c"/>
  </radialGradient>
  <radialGradient id="helmGrad" cx="35%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#8a5a35"/>
    <stop offset="100%" stop-color="#4a2e14"/>
  </radialGradient>
  <linearGradient id="spearGrad" x1="16" y1="0" x2="20" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#a9763f"/>
    <stop offset="1" stop-color="#5c3a1a"/>
  </linearGradient>
</defs>
<!-- 地面：半橢圓草原地基（非滿版矩形） -->
<ellipse cx="40" cy="80" rx="34" ry="11" fill="url(#groundGrad)" stroke="#7a5a10" stroke-width="0.6"/>

<!-- 瞪羚輪廓 -->
<g transform="translate(55,46) scale(0.9)">
  <ellipse cx="10" cy="10" rx="8" ry="4" fill="url(#gazelleGrad)" stroke="#6b4420" stroke-width="0.5"/>
  <circle cx="17" cy="5" r="3" fill="url(#gazelleGrad)" stroke="#6b4420" stroke-width="0.45"/>
  <path d="M16,3 Q14.5,-2 12.5,-4" fill="none" stroke="#4A2E0F" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M18,3 Q20,-2 22,-4" fill="none" stroke="#4A2E0F" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="4" y1="13" x2="3" y2="19" stroke="#8A5A2E" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="7" y1="13" x2="7" y2="19" stroke="#8A5A2E" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13" y1="13" x2="13" y2="19" stroke="#8A5A2E" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="13" x2="17" y2="19" stroke="#8A5A2E" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(2,9)">
    <line x1="0" y1="0" x2="-3" y2="3" stroke="#8A5A2E" stroke-width="1.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-8 2 9;8 2 9;-8 2 9" dur="2s" repeatCount="indefinite"/>
  </g>
</g>

<!-- 後方戰士 B（鏡像、較小較高，營造景深） -->
<g transform="translate(50,11) scale(-0.95,0.95)">
  <g>
    <circle cx="18" cy="4" r="2.2" fill="#FFD60A" stroke="#8a6a00" stroke-width="0.5"/>
    <line x1="18" y1="6" x2="18" y2="51" stroke="url(#spearGrad)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-3 18 51;3 18 51;-3 18 51" dur="4.6s" repeatCount="indefinite"/>
  </g>
  <line x1="5" y1="18" x2="3" y2="30" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="18" x2="18" y2="33" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M4,16 L16,16 L19,38 L1,38 Z" fill="url(#shieldGrad)" stroke="#6e1414" stroke-width="0.6"/>
  <line x1="3" y1="22" x2="17" y2="22" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="2" y1="28" x2="18" y2="28" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="1.5" y1="34" x2="18.5" y2="34" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="7" y1="18" x2="7" y2="36" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="13" y1="18" x2="13" y2="36" stroke="#f3ead0" stroke-width="0.8"/>
  <rect x="5.5" y="38" width="3" height="14" rx="1.5" fill="#6B4226" stroke="#3a2412" stroke-width="0.4"/>
  <rect x="11.5" y="38" width="3" height="14" rx="1.5" fill="#6B4226" stroke="#3a2412" stroke-width="0.4"/>
  <ellipse cx="7" cy="52" rx="2.3" ry="1.3" fill="#3E2415"/>
  <ellipse cx="13" cy="52" rx="2.3" ry="1.3" fill="#3E2415"/>
  <ellipse cx="10" cy="14" rx="9" ry="3" fill="none" stroke="#E63946" stroke-width="2"/>
  <ellipse cx="10" cy="14" rx="7" ry="2.4" fill="none" stroke="#FFD60A" stroke-width="2"/>
  <ellipse cx="10" cy="14" rx="5" ry="1.8" fill="none" stroke="#1D7FD6" stroke-width="2"/>
  <circle cx="10" cy="6" r="5" fill="url(#helmGrad)" stroke="#2e1c0a" stroke-width="0.5"/>
  <rect x="5" y="2.5" width="10" height="2" rx="1" fill="#FFD60A"/>
</g>

<!-- 前方戰士 A（正常朝向、較大較低，為主視覺） -->
<g transform="translate(9,15)">
  <g>
    <circle cx="18" cy="4" r="2.2" fill="#E63946" stroke="#7a1a22" stroke-width="0.5"/>
    <line x1="18" y1="6" x2="18" y2="51" stroke="url(#spearGrad)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-3 18 51;3 18 51;-3 18 51" dur="4s" repeatCount="indefinite"/>
  </g>
  <line x1="5" y1="18" x2="3" y2="30" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="18" x2="18" y2="33" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M4,16 L16,16 L19,38 L1,38 Z" fill="url(#shieldGrad)" stroke="#6e1414" stroke-width="0.6"/>
  <line x1="3" y1="22" x2="17" y2="22" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="2" y1="28" x2="18" y2="28" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="1.5" y1="34" x2="18.5" y2="34" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="7" y1="18" x2="7" y2="36" stroke="#f3ead0" stroke-width="0.8"/>
  <line x1="13" y1="18" x2="13" y2="36" stroke="#f3ead0" stroke-width="0.8"/>
  <rect x="5.5" y="38" width="3" height="14" rx="1.5" fill="#6B4226" stroke="#3a2412" stroke-width="0.4"/>
  <rect x="11.5" y="38" width="3" height="14" rx="1.5" fill="#6B4226" stroke="#3a2412" stroke-width="0.4"/>
  <ellipse cx="7" cy="52" rx="2.3" ry="1.3" fill="#3E2415"/>
  <ellipse cx="13" cy="52" rx="2.3" ry="1.3" fill="#3E2415"/>
  <ellipse cx="10" cy="14" rx="9" ry="3" fill="none" stroke="#E63946" stroke-width="2"/>
  <ellipse cx="10" cy="14" rx="7" ry="2.4" fill="none" stroke="#FFD60A" stroke-width="2"/>
  <ellipse cx="10" cy="14" rx="5" ry="1.8" fill="none" stroke="#1D7FD6" stroke-width="2"/>
  <circle cx="10" cy="6" r="5" fill="url(#helmGrad)" stroke="#2e1c0a" stroke-width="0.5"/>
  <rect x="5" y="2.5" width="10" height="2" rx="1" fill="#E63946"/>
</g>

<!-- 前景草叢，隨風搖擺 -->
<g transform="translate(10,75)">
  <g>
    <path d="M-2,0 Q-3,-8 -1,-14" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2,0 Q3,-9 1,-15" fill="none" stroke="#8E7618" stroke-width="1.8" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="3s" begin="0s" repeatCount="indefinite"/>
  </g>
</g>
<g transform="translate(73,74)">
  <g>
    <path d="M-2,0 Q-3,-8 -1,-14" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2,0 Q3,-9 1,-15" fill="none" stroke="#8E7618" stroke-width="1.8" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
  </g>
</g>

</svg>
