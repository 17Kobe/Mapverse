<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">

  <!-- Ground shadow -->
  <ellipse cx="40" cy="74" rx="28" ry="5" fill="#2d5a1b" opacity="0.5"/>
  
  <!-- Green hillside/trees background -->
  <ellipse cx="20" cy="65" rx="18" ry="22" fill="#3a8c2f" stroke="white" stroke-width="1.5"/>
  <ellipse cx="12" cy="62" rx="10" ry="15" fill="#4aab3a" stroke="white" stroke-width="1.5"/>
  <ellipse cx="28" cy="60" rx="9" ry="13" fill="#4aab3a" stroke="white" stroke-width="1.5"/>
  
  <!-- Wooden support pillars (懸造) -->
  <rect x="36" y="52" width="3" height="22" fill="#6b3a1f" stroke="white" stroke-width="1"/>
  <rect x="43" y="49" width="3" height="25" fill="#6b3a1f" stroke="white" stroke-width="1"/>
  <rect x="50" y="52" width="3" height="22" fill="#6b3a1f" stroke="white" stroke-width="1"/>
  <rect x="57" y="55" width="3" height="19" fill="#6b3a1f" stroke="white" stroke-width="1"/>
  
  <!-- Cross braces on pillars -->
  <line x1="36" y1="60" x2="46" y2="55" stroke="#5a2e12" stroke-width="1.2"/>
  <line x1="43" y1="60" x2="53" y2="57" stroke="#5a2e12" stroke-width="1.2"/>
  <line x1="50" y1="62" x2="60" y2="60" stroke="#5a2e12" stroke-width="1.2"/>
  
  <!-- Stage platform (舞台) -->
  <rect x="33" y="48" width="32" height="6" rx="1" fill="#a0522d" stroke="white" stroke-width="1.5"/>
  
  <!-- Main building base -->
  <rect x="35" y="28" width="30" height="22" fill="#c83020" stroke="white" stroke-width="1.5"/>
  
  <!-- Windows/shoji screens -->
  <rect x="38" y="32" width="6" height="8" rx="0.5" fill="#f5e6c8" stroke="white" stroke-width="1"/>
  <rect x="47" y="32" width="6" height="8" rx="0.5" fill="#f5e6c8" stroke="white" stroke-width="1"/>
  <rect x="56" y="32" width="5" height="8" rx="0.5" fill="#f5e6c8" stroke="white" stroke-width="1"/>
  <!-- Grid lines on shoji -->
  <line x1="41" y1="32" x2="41" y2="40" stroke="#c8a87a" stroke-width="0.5"/>
  <line x1="38" y1="36" x2="44" y2="36" stroke="#c8a87a" stroke-width="0.5"/>
  <line x1="50" y1="32" x2="50" y2="40" stroke="#c8a87a" stroke-width="0.5"/>
  <line x1="47" y1="36" x2="53" y2="36" stroke="#c8a87a" stroke-width="0.5"/>
  
  <!-- Lower roof (lower eave) -->
  <polygon points="32,28 68,28 71,34 29,34" fill="#3a3a3a" stroke="white" stroke-width="1.5"/>
  <!-- Lower roof ridge detail -->
  <line x1="32" y1="28" x2="68" y2="28" stroke="#555" stroke-width="0.8"/>
  
  <!-- Upper building -->
  <rect x="38" y="14" width="24" height="16" fill="#c83020" stroke="white" stroke-width="1.5"/>
  
  <!-- Upper roof (main) -->
  <polygon points="34,14 66,14 70,21 30,21" fill="#3a3a3a" stroke="white" stroke-width="1.5"/>
  <!-- Roof curve upward at tips -->
  <path d="M30,21 Q29,19 31,17" fill="none" stroke="white" stroke-width="1"/>
  <path d="M70,21 Q71,19 69,17" fill="none" stroke="white" stroke-width="1"/>
  
  <!-- Top small roof -->
  <polygon points="37,9 63,9 66,14 34,14" fill="#3a3a3a" stroke="white" stroke-width="1.5"/>
  <!-- Roof tip ornament (鴟尾) -->
  <path d="M37,9 Q35,7 37,5 Q36,7 37,9" fill="#3a3a3a" stroke="white" stroke-width="1"/>
  <path d="M63,9 Q65,7 63,5 Q64,7 63,9" fill="#3a3a3a" stroke="white" stroke-width="1"/>
  <!-- Ridge ornament -->
  <rect x="48" y="5" width="4" height="5" rx="1" fill="#8b6914" stroke="white" stroke-width="1"/>
  
  <!-- Roof tiles detail lines -->
  <line x1="34" y1="17" x2="66" y2="17" stroke="#555" stroke-width="0.6"/>
  <line x1="30" y1="21" x2="70" y2="21" stroke="#555" stroke-width="0.6"/>
  
  <!-- Cherry blossom tree (small, right background hint) -->
  <rect x="63" y="55" width="2.5" height="12" fill="#8b4513" stroke="white" stroke-width="0.8"/>
  <circle cx="64" cy="52" r="7" fill="#f9a8c9" stroke="white" stroke-width="1"/>
  <circle cx="60" cy="55" r="5" fill="#f9c4d8" stroke="white" stroke-width="0.8"/>
  <circle cx="68" cy="55" r="5" fill="#f9c4d8" stroke="white" stroke-width="0.8"/>
  
  <!-- Falling cherry blossom petals animation -->
  <g opacity="0.9">
    <ellipse cx="25" cy="20" rx="2" ry="1.2" fill="#f9a8c9" transform="rotate(30 25 20)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="4 55" dur="4s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" from="1" to="0" dur="4s" repeatCount="indefinite" begin="0s"/>
    </ellipse>
    <ellipse cx="70" cy="10" rx="2" ry="1.2" fill="#f9c4d8" transform="rotate(-20 70 10)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-3 60" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" from="1" to="0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </ellipse>
    <ellipse cx="48" cy="5" rx="1.8" ry="1.1" fill="#f9a8c9" transform="rotate(15 48 5)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="5 65" dur="4.5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" from="1" to="0" dur="4.5s" repeatCount="indefinite" begin="0.8s"/>
    </ellipse>
    <ellipse cx="15" cy="30" rx="2" ry="1.2" fill="#f9c4d8" transform="rotate(-10 15 30)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="6 45" dur="3.8s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="opacity" from="1" to="0" dur="3.8s" repeatCount="indefinite" begin="2.5s"/>
    </ellipse>
  </g>

</svg>