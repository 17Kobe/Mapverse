<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="envTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f3ff"/>
      <stop offset="55%" stop-color="#cfe3ff"/>
      <stop offset="100%" stop-color="#a9c8f0"/>
    </linearGradient>
    <linearGradient id="stripeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f7fd9"/>
      <stop offset="100%" stop-color="#2f56a8"/>
    </linearGradient>
    <linearGradient id="stripeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#e3b753"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99355"/>
      <stop offset="100%" stop-color="#8a5a2c"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="45%" stop-color="#ffcf4d"/>
      <stop offset="100%" stop-color="#ff8a2e"/>
    </radialGradient>
    <linearGradient id="shadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-2.2; 0,0.6; 0,0" dur="4.5s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 40 34; 2 40 34; -2 40 34" dur="4.5s" repeatCount="indefinite"/>

      <!-- balloon envelope -->
      <path d="M40 6
               C 21 6 12 24 15 38
               C 17 49 27 56 33 58
               L 47 58
               C 53 56 63 49 65 38
               C 68 24 59 6 40 6 Z"
            fill="url(#envTop)" stroke="#5578b0" stroke-width="0.6"/>

      <!-- vertical gore stripes -->
      <path d="M40 6 C33 6 27 12 23 21 C27 40 33 52 38 58 L40 58 Z" fill="url(#stripeBlue)" opacity="0.9"/>
      <path d="M40 6 C35 6.5 30 14 27.5 24 C31 41 36 53 39.5 58 L40 58 Z" fill="url(#stripeGold)" opacity="0.85"/>
      <path d="M40 6 C45 6 51 12 55 21 C51 40 45 52 40 58 L40 6 Z" fill="url(#stripeBlue)" opacity="0.55"/>
      <path d="M40 6 C44 6.5 49 14 51.5 24 C48 41 43 53 40 58 L40 6 Z" fill="url(#stripeGold)" opacity="0.5"/>

      <!-- center seam highlight -->
      <path d="M40 6 L40 58" stroke="#f4f8ff" stroke-width="1.1" opacity="0.5"/>

      <!-- side shading for roundness -->
      <path d="M40 6
               C 21 6 12 24 15 38
               C 17 49 27 56 33 58
               L 47 58
               C 53 56 63 49 65 38
               C 68 24 59 6 40 6 Z"
            fill="url(#shadeGrad)"/>

      <!-- gold scalloped trim at balloon base -->
      <path d="M31 57 q2 4 4.5 4 q2.2 0 3.3 -3 q1.1 3 3.3 3 q2.5 0 4.9 -4"
            fill="none" stroke="#d9a63d" stroke-width="2" stroke-linecap="round"/>

      <!-- top crown ornament -->
      <circle cx="40" cy="6.5" r="2.4" fill="#e3b753" stroke="#a97c2b" stroke-width="0.5"/>

      <!-- rigging lines from envelope to basket -->
      <path d="M33 58 L26 73" stroke="#6b4a28" stroke-width="0.8"/>
      <path d="M47 58 L54 73" stroke="#6b4a28" stroke-width="0.8"/>
      <path d="M38 58 L31 73" stroke="#6b4a28" stroke-width="0.7"/>
      <path d="M42 58 L49 73" stroke="#6b4a28" stroke-width="0.7"/>
      <path d="M40 58 L40 73" stroke="#6b4a28" stroke-width="0.7"/>

      <!-- burner flame -->
      <path d="M40 65 C37.5 68.5 38 71.5 40 73 C42 71.5 42.5 68.5 40 65 Z" fill="url(#flameGrad)">
        <animate attributeName="d"
          values="M40 65 C37.5 68.5 38 71.5 40 73 C42 71.5 42.5 68.5 40 65 Z;
                   M40 64 C36.8 68 37.5 72 40 74 C42.5 72 43.2 68 40 64 Z;
                   M40 65 C37.5 68.5 38 71.5 40 73 C42 71.5 42.5 68.5 40 65 Z"
          dur="0.5s" repeatCount="indefinite"/>
      </path>

      <!-- wicker basket -->
      <path d="M28 73 L30 80 L50 80 L52 73 Z" fill="url(#basketGrad)" stroke="#5c3a1b" stroke-width="0.6"/>
      <path d="M28.6 74.5 L51.4 74.5" stroke="#6b4a28" stroke-width="0.6" opacity="0.8"/>
      <path d="M29.4 77 L50.6 77" stroke="#6b4a28" stroke-width="0.6" opacity="0.8"/>
      <path d="M31 73 L29.6 80" stroke="#6b4a28" stroke-width="0.5" opacity="0.6"/>
      <path d="M35 73 L34.2 80" stroke="#6b4a28" stroke-width="0.5" opacity="0.6"/>
      <path d="M40 73 L40 80" stroke="#6b4a28" stroke-width="0.5" opacity="0.6"/>
      <path d="M45 73 L45.8 80" stroke="#6b4a28" stroke-width="0.5" opacity="0.6"/>
      <path d="M49 73 L50.4 80" stroke="#6b4a28" stroke-width="0.5" opacity="0.6"/>
      <!-- basket rim -->
      <rect x="27.5" y="71.5" width="25" height="2.4" rx="1" fill="#a9763f" stroke="#5c3a1b" stroke-width="0.5"/>
    </g>
  </g>
</svg>
