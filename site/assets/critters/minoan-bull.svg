<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6ead0"/><stop offset="1" stop-color="#e6d3a8"/></linearGradient>
  </defs>
  <!-- 米諾斯躍牛壁畫（克里特島克諾索斯宮，約西元前 1600 年）：公牛奔跑，雜技者翻身躍過牛背 -->
  <rect x="4" y="10" width="120" height="108" rx="4" fill="url(#pl)" stroke="#8a4a22" stroke-width="3"/>
  <!-- 上下的米諾斯花邊 -->
  <g fill="#c0392b"><rect x="8" y="14" width="112" height="6"/><rect x="8" y="106" width="112" height="6"/></g>
  <g fill="#2f6fd1"><circle cx="16" cy="17" r="2"/><circle cx="32" cy="17" r="2"/><circle cx="48" cy="17" r="2"/><circle cx="64" cy="17" r="2"/><circle cx="80" cy="17" r="2"/><circle cx="96" cy="17" r="2"/><circle cx="112" cy="17" r="2"/><circle cx="16" cy="109" r="2"/><circle cx="32" cy="109" r="2"/><circle cx="48" cy="109" r="2"/><circle cx="64" cy="109" r="2"/><circle cx="80" cy="109" r="2"/><circle cx="96" cy="109" r="2"/><circle cx="112" cy="109" r="2"/></g>
  <rect x="8" y="22" width="112" height="3" fill="#f2c648"/><rect x="8" y="100" width="112" height="3" fill="#f2c648"/>
  <!-- 站著的少女（白皮膚） -->
  <g>
    <circle cx="20" cy="56" r="5" fill="#fff"/><path d="M15 52 Q20 46 25 52 L24 62 L16 62Z" fill="#2a1a10"/>
    <path d="M14 62 H26 L30 96 H10Z" fill="#c0392b"/><path d="M12 76 H28" stroke="#2f6fd1" stroke-width="3"/><path d="M12 86 H28" stroke="#f2c648" stroke-width="3"/>
    <rect x="12" y="96" width="5" height="4" fill="#fff"/><rect x="21" y="96" width="5" height="4" fill="#fff"/>
  </g>
  <!-- 公牛 -->
  <g>
    <path d="M44 78 Q46 58 70 58 Q88 56 96 66 Q100 76 96 84 L90 96 H84 L82 86 H62 L60 96 H54 L52 86 Q44 86 44 78Z" fill="#a8542a"/>
    <path d="M52 62 Q60 58 70 62 Q64 70 54 70Z" fill="#6a2f14"/>
    <circle cx="66" cy="72" r="2.6" fill="#f6ead0"/><circle cx="76" cy="66" r="2.2" fill="#f6ead0"/><circle cx="82" cy="76" r="2.4" fill="#f6ead0"/>
    <path d="M96 64 Q110 64 112 76 Q106 82 100 76" fill="#a8542a"/>
    <path d="M44 74 Q34 70 30 76 Q34 84 44 82Z" fill="#a8542a"/>
    <path d="M34 72 Q28 62 32 56 M38 70 Q38 60 44 56" stroke="#f6ead0" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="38" cy="75" r="1.6" fill="#17171d"/>
    <path d="M52 92 L48 98 M60 96 L64 100 M82 96 L86 100 M90 96 L96 98" stroke="#6a2f14" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 64 Q116 56 112 50" stroke="#6a2f14" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 躍牛者（紅褐色皮膚，在牛背上翻身，上下跳動） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .7 1;.3 0 .7 1" keyTimes="0;.5;1"/>
    <circle cx="60" cy="38" r="5" fill="#b8532a"/><path d="M54 36 Q50 30 46 32 M56 34 Q52 26 48 26" stroke="#2a1a10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M62 42 Q74 48 84 44 L90 52 Q76 56 62 50Z" fill="#b8532a"/>
    <path d="M84 44 Q96 38 100 44 Q96 50 90 52" fill="#b8532a"/><path d="M60 48 L50 56 L54 60 L66 52Z" fill="#b8532a"/>
    <path d="M70 46 H80 V52 H70Z" fill="#2f6fd1"/><path d="M70 49 H80" stroke="#f2c648" stroke-width="1.4"/>
  </g>
</svg>
