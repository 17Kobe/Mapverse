<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="mjJersey2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2362f"/>
      <stop offset="100%" stop-color="#9c1a16"/>
    </linearGradient>
    <linearGradient id="mjShorts2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="mjShoe2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1e8"/>
      <stop offset="100%" stop-color="#c8c4b6"/>
    </linearGradient>
    <radialGradient id="mjSkin2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9c6a44"/>
      <stop offset="100%" stop-color="#5c3a20"/>
    </radialGradient>
    <radialGradient id="mjBall2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8873c"/>
      <stop offset="100%" stop-color="#a0501a"/>
    </radialGradient>
  </defs>

  <!-- 跳起來，地面上只留一個橢圓陰影暗示騰空高度 -->
  <ellipse cx="38" cy="78" rx="14" ry="2.6" fill="#1a1008" opacity="0.3"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="1.3s" repeatCount="indefinite"/>

    <!-- 經典 Jumpman 剪影姿勢：前腿往前屈膝向下，後腿大幅往後上方屈起 -->
    <path d="M18,52 C12,58 8,66 10,74 L18,76 C19,67 23,59 28,54 Z" fill="url(#mjShorts2)" stroke="#000" stroke-width="0.4"/>
    <path d="M14,72 L20,71 L22,76 L13,78 Z" fill="url(#mjShoe2)" stroke="#9c988a" stroke-width="0.4"/>

    <path d="M38,56 C48,54 58,48 60,38 L53,35 C51,43 44,48 36,51 Z" fill="url(#mjShorts2)" stroke="#000" stroke-width="0.4"/>
    <path d="M55,32 L64,30 L66,36 L57,39 Z" fill="url(#mjShoe2)" stroke="#9c988a" stroke-width="0.4"/>

    <!-- 身體往前傾，帶出騰空感 -->
    <path d="M26,34 C22,42 23,50 29,55 C34,58 40,57 43,52 C46,46 44,38 38,33 C34,30 29,30 26,34 Z"
          fill="url(#mjJersey2)" stroke="#6e1511" stroke-width="0.5"/>
    <text x="35" y="48" font-size="7" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">23</text>

    <!-- 另一手自然往後下方帶，增加動態 -->
    <path d="M27,38 C21,40 16,44 14,50" fill="none" stroke="url(#mjSkin2)" stroke-width="3.6" stroke-linecap="round"/>

    <!-- 主要手臂高舉過頭，托著籃球，是整個姿勢的視覺重心 -->
    <path d="M40,32 C42,24 41,15 36,8" fill="none" stroke="url(#mjSkin2)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="34" cy="5" r="5.4" fill="url(#mjBall2)" stroke="#5c2e0c" stroke-width="0.5"/>
    <path d="M34,-0.4 L34,10.4 M28.6,5 L39.4,5 M29.6,1.5 Q34,5 29.6,8.5 M38.4,1.5 Q34,5 38.4,8.5" stroke="#2a1608" stroke-width="0.5" fill="none"/>

    <!-- 頭微微上仰 -->
    <circle cx="31" cy="24" r="7.2" fill="url(#mjSkin2)" stroke="#3c2614" stroke-width="0.45"/>
    <path d="M23.8,23 C23.5,18 26.8,15.3 31,15.3 C35.2,15.3 38.5,18 38.2,23 C36,20.5 33.5,20 31,20 C28.5,20 26,20.5 23.8,23 Z" fill="#0c0a08"/>
    <path d="M26.5,26.8 Q31,29 35.5,26.8" fill="none" stroke="#2a1a10" stroke-width="0.7" stroke-linecap="round"/>
  </g>
</svg>
