<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="ltGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe6f2"/>
      <stop offset="50%" stop-color="#9fc3dc"/>
      <stop offset="100%" stop-color="#6f93b4"/>
    </linearGradient>
    <linearGradient id="ltGlassDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fb3cc"/>
      <stop offset="100%" stop-color="#4f6f8c"/>
    </linearGradient>
    <linearGradient id="ltCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aa0b4"/>
      <stop offset="100%" stop-color="#5c6f80"/>
    </linearGradient>
  </defs>

  <!-- low city skyline at the base for scale -->
  <g fill="url(#ltCity)" opacity="0.9">
    <rect x="2" y="64" width="10" height="16"/>
    <rect x="14" y="58" width="9" height="22"/>
    <rect x="58" y="60" width="9" height="20"/>
    <rect x="68" y="66" width="10" height="14"/>
  </g>

  <!-- the tower's tapering, curved glass silhouette -->
  <path d="M34,80 L30,20 Q30,6 40,4 Q50,6 50,20 L46,80 Z"
        fill="url(#ltGlass)" stroke="#43617c" stroke-width="0.6"/>
  <path d="M40,80 L38,20 Q38,8 40,4 Q42,8 42,20 L44,80 Z" fill="url(#ltGlassDark)" opacity="0.6"/>

  <!-- curtain-wall grid of windows following the taper -->
  <g stroke="#3f5d78" stroke-width="0.35" opacity="0.55">
    <line x1="32" y1="64" x2="48" y2="64"/>
    <line x1="32.5" y1="52" x2="47.5" y2="52"/>
    <line x1="33" y1="40" x2="47" y2="40"/>
    <line x1="33.6" y1="28" x2="46.4" y2="28"/>
    <line x1="35" y1="16" x2="45" y2="16"/>
    <line x1="35" y1="10" x2="45" y2="76"/>
    <line x1="40" y1="6" x2="40" y2="78"/>
    <line x1="45" y1="10" x2="35" y2="76"/>
  </g>

  <!-- diagrid lattice pattern wrapping the tower, lightly animated shimmer -->
  <g stroke="#eaf4fb" stroke-width="0.4" opacity="0.35">
    <path d="M31,70 L49,58"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/></path>
    <path d="M31,46 L49,34"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></path>
    <path d="M32,22 L48,12"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" begin="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- tapering spire tip -->
  <line x1="40" y1="4" x2="40" y2="-2" stroke="#43617c" stroke-width="1.4"/>
  <circle cx="40" cy="4" r="1.3" fill="#fff6c8">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- warm window lights twinkling at dusk -->
  <g fill="#ffe9a0">
    <rect x="34" y="60" width="1.6" height="2" opacity="0.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="44" y="48" width="1.6" height="2" opacity="0.7"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="36" y="34" width="1.4" height="1.8" opacity="0.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.9s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>
</svg>
