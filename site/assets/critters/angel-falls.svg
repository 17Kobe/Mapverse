<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="afGround" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fa852"/>
    <stop offset="1" stop-color="#4f6e2c"/>
  </linearGradient>
  <linearGradient id="afRock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d7a68"/>
    <stop offset="1" stop-color="#5f5042"/>
  </linearGradient>
  <linearGradient id="afGrass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a9a3e"/>
    <stop offset="1" stop-color="#3b5c1e"/>
  </linearGradient>
  <linearGradient id="afWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef8fd"/>
    <stop offset="1" stop-color="#aed6e9"/>
  </linearGradient>
</defs>
<g>
  <!-- 地面 -->
  <ellipse cx="40" cy="70" rx="33" ry="6" fill="url(#afGround)" stroke="#3f5a24" stroke-width="0.6"/>

  <!-- 左側平頂山 -->
  <polygon points="9,60 38,60 33,16 15,20" fill="url(#afRock)" stroke="#4a3f34" stroke-width="0.6"/>
  <!-- 右側平頂山 -->
  <polygon points="47,60 71,60 65,20 47,16" fill="url(#afRock)" stroke="#4a3f34" stroke-width="0.6"/>

  <!-- 岩壁紋理 -->
  <path d="M20,28 L18,55" stroke="#4a3f34" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M29,24 L26,57" stroke="#4a3f34" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M55,24 L57,57" stroke="#4a3f34" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M63,28 L64,55" stroke="#4a3f34" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- 頂部植被 -->
  <ellipse cx="24" cy="17" rx="13" ry="5" fill="url(#afGrass)" stroke="#2c4616" stroke-width="0.5"/>
  <ellipse cx="57" cy="17" rx="13" ry="5" fill="url(#afGrass)" stroke="#2c4616" stroke-width="0.5"/>

  <!-- 瀑布主體（自平頂山頂端垂直落下） -->
  <path d="M35,15 L45,15 L50,60 L30,60 Z" fill="url(#afWater)" stroke="#8fbdd3" stroke-width="0.6"/>

  <!-- 水流動感線條 -->
  <line x1="36" y1="19" x2="35" y2="58" stroke="#f3fbff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="40" y1="17" x2="40" y2="59" stroke="#f3fbff" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="44" y1="19" x2="45" y2="58" stroke="#f3fbff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- 落水濺起的小水花 -->
  <path d="M30,60 Q40,66 50,60" stroke="#d7edf6" stroke-width="1.4" fill="none" opacity="0.8"/>

  <!-- 底部雲霧 -->
  <ellipse cx="40" cy="62" rx="15" ry="6" fill="#eaf6fb" opacity="0.55">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="32" cy="65" rx="10" ry="5" fill="#eaf6fb" opacity="0.5">
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="48" cy="65" rx="10" ry="5" fill="#eaf6fb" opacity="0.5">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>
</g>
</svg>
