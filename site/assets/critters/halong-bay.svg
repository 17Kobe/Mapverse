<path d="M16,70 C15,65 18,61 22,61 C26,61 28,65 27,70 C26,73 18,73 16,70 Z" fill="#5a7050" stroke="#ffffff" stroke-width="1.8"/>

<!-- 中央最高石灰岩塔（主體） -->
<path d="M38,66 C30,60 24,50 26,40 C28,30 30,20 38,15 C42,13 46,13 50,15 C56,20 58,30 58,40 C58,50 54,60 48,66 Z" fill="#5a7050" stroke="#ffffff" stroke-width="2.2"/>
