<ellipse cx="15" cy="48" rx="4" ry="8" fill="#7a9468" opacity="0.5"/>

<!-- 右後方小型石灰岩島 -->
<path d="M58,62 C55,56 55,48 58,42 C60,38 64,36 68,37 C72,38 74,44 73,50 C72,56 68,60 63,62 Z" fill="#5a7050" stroke="#ffffff" stroke-width="2"/>
