<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="stoneCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a4a"/>
      <stop offset="45%" stop-color="#d4a876"/>
      <stop offset="60%" stop-color="#e8c79a"/>
      <stop offset="100%" stop-color="#9c7850"/>
    </linearGradient>
    <linearGradient id="stoneColShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e5138"/>
      <stop offset="50%" stop-color="#a9825b"/>
      <stop offset="100%" stop-color="#7c5c3e"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfa877"/>
      <stop offset="40%" stop-color="#b08a5f"/>
      <stop offset="100%" stop-color="#7a5c3d"/>
    </linearGradient>
    <radialGradient id="sky" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#f3cf8f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3cf8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7c79b"/>
      <stop offset="100%" stop-color="#a9815a"/>
    </linearGradient>
    <linearGradient id="duststreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8d2a8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8d2a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8d2a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- distant warm haze glow -->
  <ellipse cx="40" cy="30" rx="38" ry="24" fill="url(#sky)"/>

  <!-- far-back low ruin silhouette -->
  <g opacity="0.45" fill="#b89368">
    <rect x="4" y="60" width="5" height="18" rx="1"/>
    <rect x="12" y="55" width="4" height="23" rx="1"/>
    <rect x="68" y="58" width="5" height="20" rx="1"/>
    <rect x="60" y="54" width="4" height="24" rx="1"/>
  </g>

  <!-- stone platform / podium, reaches to bottom edge -->
  <path d="M2 78 L6 62 L74 62 L78 78 Z" fill="url(#platform)" stroke="#5f4328" stroke-width="0.6"/>
  <!-- platform stepped courses -->
  <path d="M8 69 L72 69 L73.3 74 L6.7 74 Z" fill="#8c6a46" opacity="0.55" stroke="#5f4328" stroke-width="0.3"/>
  <path d="M5 76 L75 76 L76 78 L4 78 Z" fill="#6b4e32" opacity="0.6"/>
  <!-- broken rubble blocks on platform -->
  <g stroke="#5f4328" stroke-width="0.4">
    <rect x="9" y="58" width="9" height="6" rx="1" fill="#c6a176" transform="rotate(-3 13 61)"/>
    <rect x="58" y="57" width="10" height="6" rx="1" fill="#bd9a6e" transform="rotate(4 63 60)"/>
    <rect x="30" y="60" width="7" height="4.5" rx="1" fill="#caa47a" transform="rotate(2 33 62)"/>
  </g>

  <!-- relief-carved base band hint on platform face -->
  <g stroke="#5a3f27" stroke-width="0.5" opacity="0.6" fill="none">
    <path d="M10 66 q2 -2 4 0 q2 2 4 0 q2 -2 4 0 q2 2 4 0"/>
    <path d="M46 67 q2 -2 4 0 q2 2 4 0 q2 -2 4 0 q2 2 4 0"/>
  </g>

  <!-- ===== Columns (tall, standing on platform, bases near y=62) ===== -->
  <!-- Column 1: broken short stump -->
  <g>
    <rect x="12" y="46" width="5.5" height="16" rx="0.6" fill="url(#stoneColShade)" stroke="#5f4328" stroke-width="0.5"/>
    <path d="M12 46 L17.5 46 L16.5 44 L13 44.3 Z" fill="#7c5c3e" stroke="#5f4328" stroke-width="0.4"/>
    <!-- fluting lines -->
    <line x1="14.2" y1="47" x2="14.2" y2="61" stroke="#5f4328" stroke-width="0.35" opacity="0.6"/>
    <line x1="15.8" y1="47" x2="15.8" y2="61" stroke="#5f4328" stroke-width="0.35" opacity="0.6"/>
  </g>

  <!-- Column 2: tall, full double-bull-head capital -->
  <g>
    <rect x="21" y="16" width="7" height="46" rx="0.8" fill="url(#stoneCol)" stroke="#5f4328" stroke-width="0.6"/>
    <line x1="23.2" y1="18" x2="23.2" y2="61" stroke="#8a6a4a" stroke-width="0.4" opacity="0.7"/>
    <line x1="25.6" y1="18" x2="25.6" y2="61" stroke="#8a6a4a" stroke-width="0.4" opacity="0.7"/>
    <!-- capital base ring -->
    <rect x="19.5" y="14" width="10" height="3" rx="0.8" fill="url(#capGrad)" stroke="#6e5138" stroke-width="0.5"/>
    <!-- double bull/griffin heads back to back -->
    <g stroke="#6e5138" stroke-width="0.5" fill="url(#capGrad)">
      <path d="M19.5 14 Q14 13 13 8 Q12.3 5 15 4.3 Q16.5 4 17.3 6 Q18 8.5 20.5 10 Z"/>
      <path d="M29.5 14 Q35 13 36 8 Q36.7 5 34 4.3 Q32.5 4 31.7 6 Q31 8.5 28.5 10 Z"/>
      <!-- small horn curls -->
      <path d="M15 5.2 Q13.2 4.5 13.6 2.6" fill="none"/>
      <path d="M34 5.2 Q35.8 4.5 35.4 2.6" fill="none"/>
    </g>
    <!-- eyes -->
    <circle cx="15.6" cy="7.3" r="0.55" fill="#4a3420"/>
    <circle cx="33.4" cy="7.3" r="0.55" fill="#4a3420"/>
  </g>

  <!-- Column 3: tallest, central, full capital -->
  <g>
    <rect x="35" y="6" width="8" height="56" rx="0.9" fill="url(#stoneCol)" stroke="#5f4328" stroke-width="0.6"/>
    <line x1="37.5" y1="8" x2="37.5" y2="61" stroke="#8a6a4a" stroke-width="0.45" opacity="0.7"/>
    <line x1="40.2" y1="8" x2="40.2" y2="61" stroke="#8a6a4a" stroke-width="0.45" opacity="0.7"/>
    <!-- joints between drum segments -->
    <line x1="35" y1="22" x2="43" y2="22" stroke="#6e5138" stroke-width="0.4" opacity="0.5"/>
    <line x1="35" y1="38" x2="43" y2="38" stroke="#6e5138" stroke-width="0.4" opacity="0.5"/>
    <!-- capital -->
    <rect x="33" y="4" width="12" height="3" rx="0.8" fill="url(#capGrad)" stroke="#6e5138" stroke-width="0.5"/>
    <g stroke="#6e5138" stroke-width="0.55" fill="url(#capGrad)">
      <path d="M33 4 Q27 3 25.8 -2 Q25 -5 28 -5.8 Q29.7 -6.2 30.6 -3.8 Q31.4 -1 34 0.5 Z"/>
      <path d="M45 4 Q51 3 52.2 -2 Q53 -5 50 -5.8 Q48.3 -6.2 47.4 -3.8 Q46.6 -1 44 0.5 Z"/>
      <path d="M28 -4.6 Q25.8 -5.5 26.3 -7.8" fill="none"/>
      <path d="M50 -4.6 Q52.2 -5.5 51.7 -7.8" fill="none"/>
    </g>
    <circle cx="28.6" cy="-1.6" r="0.6" fill="#4a3420"/>
    <circle cx="49.4" cy="-1.6" r="0.6" fill="#4a3420"/>
  </g>

  <!-- Column 4: medium height, partial top (broken, no capital) -->
  <g>
    <rect x="48" y="24" width="6.5" height="38" rx="0.7" fill="url(#stoneColShade)" stroke="#5f4328" stroke-width="0.5"/>
    <path d="M48 24 L54.5 24 L53.3 21.5 L49.1 22 Z" fill="#7c5c3e" stroke="#5f4328" stroke-width="0.4"/>
    <line x1="50.1" y1="25" x2="50.1" y2="61" stroke="#5f4328" stroke-width="0.35" opacity="0.6"/>
    <line x1="52.4" y1="25" x2="52.4" y2="61" stroke="#5f4328" stroke-width="0.35" opacity="0.6"/>
  </g>

  <!-- Column 5: short rear stump -->
  <g opacity="0.95">
    <rect x="59" y="42" width="5.5" height="20" rx="0.6" fill="url(#stoneColShade)" stroke="#5f4328" stroke-width="0.5"/>
    <path d="M59 42 L64.5 42 L63.5 40 L60 40.3 Z" fill="#7c5c3e" stroke="#5f4328" stroke-width="0.4"/>
  </g>

  <!-- fallen carved block in foreground -->
  <path d="M42 68 L53 66.5 L55 72 L43 73.5 Z" fill="#b8936a" stroke="#5f4328" stroke-width="0.5"/>
  <path d="M44 69.5 q2 -1.4 4 0 q2 1.4 4 0" fill="none" stroke="#6e5138" stroke-width="0.4" opacity="0.6"/>

  <!-- small rubble pebbles grounding the base -->
  <g fill="#8c6a46" stroke="#5f4328" stroke-width="0.3">
    <circle cx="20" cy="75" r="1.6"/>
    <circle cx="36" cy="77" r="1.3"/>
    <circle cx="58" cy="76" r="1.8"/>
    <circle cx="66" cy="74" r="1.3"/>
  </g>

  <!-- heat shimmer haze streaks drifting across the ruins -->
  <rect x="0" y="30" width="80" height="6" fill="url(#duststreak)">
    <animateTransform attributeName="transform" type="translate" values="-20 0;20 0;-20 0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="48" width="80" height="5" fill="url(#duststreak)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="15 0;-15 0;15 0" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting dust motes -->
  <g fill="#e8d2a8">
    <circle cx="25" cy="40" r="0.6" opacity="0.5">
      <animate attributeName="cy" values="40;32;40" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="47" cy="30" r="0.7" opacity="0.5">
      <animate attributeName="cy" values="30;20;30" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="48" r="0.5" opacity="0.5">
      <animate attributeName="cy" values="48;41;48" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
