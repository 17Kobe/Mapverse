<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">

  <!-- 底部草地橢圓（非矩形，融入地景） -->
  <ellipse cx="40" cy="74" rx="26" ry="5" fill="#4a9e3a" opacity="0.8"/>

  <!-- 整塔傾斜群組：以底部中心 (40,68) 為旋轉軸，傾斜 +10 度 -->
  <g transform="rotate(10, 40, 68)">

    <!-- 底座 Layer 1：最寬 -->
    <rect x="20" y="61" width="36" height="7" rx="2"
          fill="#f0ece0" stroke="white" stroke-width="1.5"/>
    <path d="M23,61 Q26,57 29,61" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M29,61 Q32,57 35,61" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M35,61 Q38,57 41,61" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M41,61 Q44,57 47,61" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M47,61 Q50,57 53,61" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- Layer 2 -->
    <rect x="20" y="54" width="36" height="7" rx="1"
          fill="#f0ece0" stroke="white" stroke-width="1.5"/>
    <path d="M23,54 Q26,50 29,54" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M29,54 Q32,50 35,54" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M35,54 Q38,50 41,54" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M41,54 Q44,50 47,54" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M47,54 Q50,50 53,54" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- Layer 3 -->
    <rect x="21" y="47" width="34" height="7" rx="1"
          fill="#ede9d8" stroke="white" stroke-width="1.5"/>
    <path d="M24,47 Q27,43 30,47" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M30,47 Q33,43 36,47" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M36,47 Q39,43 42,47" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M42,47 Q45,43 48,47" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M48,47 Q51,43 54,47" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- Layer 4 -->
    <rect x="21" y="40" width="34" height="7" rx="1"
          fill="#ede9d8" stroke="white" stroke-width="1.5"/>
    <path d="M24,40 Q27,36 30,40" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M30,40 Q33,36 36,40" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M36,40 Q39,36 42,40" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M42,40 Q45,36 48,40" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M48,40 Q51,36 54,40" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- Layer 5 -->
    <rect x="22" y="33" width="32" height="7" rx="1"
          fill="#eae6d5" stroke="white" stroke-width="1.5"/>
    <path d="M25,33 Q28,29 31,33" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M31,33 Q34,29 37,33" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M37,33 Q40,29 43,33" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M43,33 Q46,29 49,33" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M49,33 Q52,29 55,33" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- Layer 6 -->
    <rect x="22" y="26" width="32" height="7" rx="1"
          fill="#eae6d5" stroke="white" stroke-width="1.5"/>
    <path d="M25,26 Q28,22 31,26" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M31,26 Q34,22 37,26" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M37,26 Q40,22 43,26" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M43,26 Q46,22 49,26" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M49,26 Q52,22 55,26" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- Layer 7 -->
    <rect x="23" y="19" width="30" height="7" rx="1"
