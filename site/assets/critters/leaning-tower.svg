    <path d="M26,19 Q29,15 32,19" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M32,19 Q35,15 38,19" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M38,19 Q41,15 44,19" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M44,19 Q47,15 50,19" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M50,19 Q53,15 56,19" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- 頂部鐘樓 Layer 8（略窄） -->
    <rect x="26" y="13" width="24" height="6" rx="2"
          fill="#e8e4d2" stroke="white" stroke-width="1.5"/>
    <path d="M29,13 Q32,9 35,13" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M35,13 Q38,9 41,13" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>
    <path d="M41,13 Q44,9 47,13" fill="none" stroke="#c8bfa8" stroke-width="0.7"/>

    <!-- 頂蓋（圓頂帽） -->
    <ellipse cx="38" cy="13" rx="13" ry="3.5"
             fill="#d8d4c0" stroke="white" stroke-width="1.2"/>
    <!-- 尖頂 -->
    <polygon points="38,7 32,13 44,13"
             fill="#d0ccb8" stroke="white" stroke-width="1.2"/>

    <!-- 受光面高光（白色細條，增加大理石感） -->
    <rect x="20" y="19" width="3" height="49" rx="0"
          fill="white" opacity="0.13"/>

  </g>

  <!-- 投影（傾斜草地上的暗影） -->
  <ellipse cx="44" cy="75" rx="20" ry="3" fill="#2a6a18" opacity="0.25"/>

</svg>