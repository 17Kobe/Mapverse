<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <linearGradient id="hillGradOuter" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f9450"/>
    <stop offset="1" stop-color="#1f5c2a"/>
  </linearGradient>
  <linearGradient id="hillGradInner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#55b566"/>
    <stop offset="1" stop-color="#2a7a3a"/>
  </linearGradient>
  <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfd8dc"/>
    <stop offset="1" stop-color="#8aa0a8"/>
  </linearGradient>
  <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#eceff1"/>
    <stop offset="1" stop-color="#a8b4ba"/>
  </linearGradient>
</defs>

  <!-- Ground hill (Namsan) -->
  <ellipse cx="40" cy="72" rx="30" ry="10" fill="url(#hillGradOuter)" stroke="#15431d" stroke-width="0.5"/>
  <ellipse cx="40" cy="68" rx="22" ry="8" fill="url(#hillGradInner)" stroke="#1f5c2a" stroke-width="0.4"/>

  <!-- Tower base/pedestal on hill -->
  <rect x="35" y="55" width="10" height="14" rx="2" fill="url(#metalGrad)" stroke="#5c6a70" stroke-width="0.5"/>

  <!-- Observation deck platform -->
  <ellipse cx="40" cy="54" rx="12" ry="4" fill="url(#metalGrad)" stroke="#5c6a70" stroke-width="0.4"/>
  <rect x="31" y="50" width="18" height="5" rx="2" fill="url(#towerGrad)" stroke="#7a8a90" stroke-width="0.4"/>

  <!-- Tower shaft above deck -->
  <rect x="37.5" y="22" width="5" height="29" rx="1.5" fill="url(#towerGrad)" stroke="#7a8a90" stroke-width="0.4"/>

  <!-- Colored light bands on tower shaft -->
  <rect x="37.5" y="26" width="5" height="2.5" rx="0.5" fill="#2196f3" stroke="none">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="37.5" y="30.5" width="5" height="2.5" rx="0.5" fill="#f44336" stroke="none">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="37.5" y="35" width="5" height="2.5" rx="0.5" fill="#4caf50" stroke="none">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="37.5" y="39.5" width="5" height="2.5" rx="0.5" fill="#ff9800" stroke="none">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Small observation ring mid-tower -->
  <ellipse cx="40" cy="44" rx="7" ry="2.5" fill="#607d8b" stroke="#37474f" stroke-width="0.3"/>

  <!-- Top antenna -->
  <line x1="40" y1="10" x2="40" y2="22" stroke="#9e9e9e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="9" r="2" fill="#f44336" stroke="#8a1a12" stroke-width="0.4">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Stars/sparkles around tower for night ambience -->
  <circle cx="18" cy="20" r="1.2" fill="#fffde7">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="62" cy="16" r="1" fill="#fffde7">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="32" r="1.2" fill="#fffde7">
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="38" r="1" fill="#fffde7">
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

</svg>
