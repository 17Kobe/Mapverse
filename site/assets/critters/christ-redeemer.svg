<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
<defs>
  <radialGradient id="crHead" cx="40%" cy="35%" r="70%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#cfcfcf"/>
  </radialGradient>
  <linearGradient id="crRobe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#d6d6d6"/>
  </linearGradient>
  <linearGradient id="crRobeLower" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eeeeee"/>
    <stop offset="100%" stop-color="#c8c8c8"/>
  </linearGradient>
  <linearGradient id="crArm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f2f2f2"/>
    <stop offset="100%" stop-color="#cccccc"/>
  </linearGradient>
  <linearGradient id="crHill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6fb15f"/>
    <stop offset="100%" stop-color="#386b2e"/>
  </linearGradient>
</defs>
<!-- 金色光環（細圓圈，不填色） -->
<circle cx="40" cy="16" r="7.5"
  fill="none" stroke="#ffd700" stroke-width="2.5"/>

<!-- 頭部 -->
<ellipse cx="40" cy="16" rx="4.5" ry="5"
  fill="url(#crHead)" stroke="#aaaaaa" stroke-width="0.5"/>

<!-- 身體袍子 -->
<path d="M34 22 Q32 32 30 44 Q33 46 40 47 Q47 46 50 44 Q48 32 46 22 Z"
  fill="url(#crRobe)" stroke="#b8b8b8" stroke-width="0.5"/>

<!-- 左臂（漸層立體感） -->
<path d="M34 25 Q26 27 15 28"
  fill="none" stroke="url(#crArm)" stroke-width="5" stroke-linecap="round"/>
<path d="M34 25 Q26 27 15 28"
  fill="none" stroke="#e4e4e4" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

<!-- 右臂 -->
<path d="M46 25 Q54 27 65 28"
  fill="none" stroke="url(#crArm)" stroke-width="5" stroke-linecap="round"/>
<path d="M46 25 Q54 27 65 28"
  fill="none" stroke="#e4e4e4" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

<!-- 左手 -->
<ellipse cx="14.5" cy="28.5" rx="2.5" ry="2"
  fill="url(#crArm)" stroke="#b8b8b8" stroke-width="0.4"/>

<!-- 右手 -->
<ellipse cx="65.5" cy="28.5" rx="2.5" ry="2"
  fill="url(#crArm)" stroke="#b8b8b8" stroke-width="0.4"/>

<!-- 袍子下擺 -->
<path d="M30 44 Q28 52 30 58 Q35 60 40 60 Q45 60 50 58 Q52 52 50 44 Z"
  fill="url(#crRobeLower)" stroke="#aaaaaa" stroke-width="0.5"/>

<!-- 台階（3 層，由小至大） -->
<rect x="32" y="57" width="16" height="3" rx="1"
  fill="#c8c8c8" stroke="#9c9c9c" stroke-width="0.4"/>
<rect x="29" y="60" width="22" height="3" rx="1"
  fill="#b8b8b8" stroke="#8c8c8c" stroke-width="0.4"/>
<rect x="26" y="63" width="28" height="3" rx="1"
  fill="#a8a8a8" stroke="#7c7c7c" stroke-width="0.4"/>

<!-- 山丘（底部半橢圓，不是矩形） -->
<ellipse cx="40" cy="70" rx="23" ry="8"
  fill="url(#crHill)" stroke="#2c5424" stroke-width="0.5"/>
</svg>
