<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="chimneyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a92a0"/>
      <stop offset="1" stop-color="#4a505a"/>
    </linearGradient>
    <linearGradient id="archG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5cad2"/>
      <stop offset="0.6" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#6e747c"/>
    </linearGradient>
    <linearGradient id="triG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd4a"/>
      <stop offset="1" stop-color="#d4a60e"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="40" cy="72" rx="28" ry="5" fill="#556b2f" opacity="0.5"/>

  <!-- Dead trees left -->
  <line x1="8" y1="62" x2="8" y2="45" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="8" y1="50" x2="4" y2="45" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="8" y1="53" x2="12" y2="48" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="8" y1="56" x2="5" y2="52" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Dead trees right -->
  <line x1="72" y1="62" x2="72" y2="46" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="72" y1="51" x2="68" y2="46" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="72" y1="54" x2="76" y2="49" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="72" y1="57" x2="75" y2="53" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Old reactor 4 ruins (left side, partially visible) -->
  <rect x="12" y="42" width="14" height="22" rx="1" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="0.6"/>
  <rect x="14" y="44" width="4" height="5" fill="#333" stroke="#111" stroke-width="0.4"/>
  <rect x="19" y="44" width="4" height="5" fill="#333" stroke="#111" stroke-width="0.4"/>
  <!-- Rubble detail -->
  <rect x="13" y="56" width="5" height="3" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="0.4"/>
  <rect x="19" y="58" width="6" height="3" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="0.4"/>

  <!-- Chimney / stack -->
  <rect x="52" y="28" width="7" height="36" rx="1" fill="url(#chimneyG)" stroke="#3f454e" stroke-width="0.6"/>
  <!-- Stack stripes -->
  <rect x="52" y="32" width="7" height="2" fill="#cc3333" opacity="0.8"/>
  <rect x="52" y="38" width="7" height="2" fill="#cc3333" opacity="0.8"/>
  <rect x="52" y="44" width="7" height="2" fill="#cc3333" opacity="0.8"/>
  <!-- Stack top cap -->
  <rect x="51" y="27" width="9" height="3" rx="1" fill="#555" stroke="#2a2a2a" stroke-width="0.5"/>

  <!-- New Safe Confinement arch (main structure) -->
  <!-- Arch shadow layer -->
  <path d="M 18 64 Q 18 28 40 28 Q 62 28 62 64 Z" fill="#707880" opacity="0.4"/>
  <!-- Main arch body -->
  <path d="M 20 64 Q 20 30 40 30 Q 60 30 60 64 Z" fill="url(#archG)" stroke="#4a4f57" stroke-width="0.6"/>
  <!-- Arch highlight/panel lines -->
  <path d="M 30 64 Q 30 36 40 35 Q 50 36 50 64" fill="none" stroke="#d9dde3" stroke-width="0.6" opacity="0.5"/>
  <path d="M 25 64 Q 24 40 40 38 Q 56 40 55 64" fill="none" stroke="#d9dde3" stroke-width="0.5" opacity="0.4"/>
  <!-- Arch ribs -->
  <path d="M 22 60 Q 22 34 40 32 Q 58 34 58 60" fill="none" stroke="#aab0b8" stroke-width="0.8" opacity="0.6"/>
  <!-- Arch base bar -->
  <rect x="19" y="62" width="42" height="4" rx="1" fill="url(#chimneyG)" stroke="#3f454e" stroke-width="0.6"/>

  <!-- Radiation warning triangle on arch -->
  <g transform="translate(33, 38)">
    <!-- Triangle background -->
    <polygon points="7,0 14,13 0,13" fill="url(#triG)" stroke="#8a6a0a" stroke-width="0.5"/>
    <!-- Radiation symbol center dot -->
    <circle cx="7" cy="9" r="1.5" fill="#1a1a1a"/>
    <!-- Radiation blades -->
    <path d="M7 9 L5 5 A3 3 0 0 1 9 5 Z" fill="#1a1a1a"/>
    <path d="M7 9 L3.5 11 A3 3 0 0 1 3.5 7 Z" fill="#1a1a1a"/>
    <path d="M7 9 L10.5 11 A3 3 0 0 1 10.5 7 Z" fill="#1a1a1a"/>
    <!-- Exclamation mark -->
    <text x="6.5" y="11.5" font-size="5" fill="#1a1a1a" font-weight="bold" font-family="sans-serif">!</text>
  </g>

  <!-- Radiation warning glow animation -->
  <g transform="translate(33, 38)">
    <polygon points="7,0 14,13 0,13" fill="none" stroke="#f5c518" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Smoke from chimney -->
  <g opacity="0.5">
    <circle cx="55" cy="24" r="3" fill="#aaa">
      <animate attributeName="cy" values="24;16;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="57" cy="21" r="2.5" fill="#bbb">
      <animate attributeName="cy" values="21;13;5" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.25;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;5" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="22" r="2" fill="#999">
      <animate attributeName="cy" values="22;15;7" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.2;0" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;4.5" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hazard fence posts -->
  <line x1="16" y1="64" x2="16" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="23" y1="64" x2="23" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="30" y1="64" x2="30" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="50" y1="64" x2="50" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="57" y1="64" x2="57" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="64" y1="64" x2="64" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="16" y1="66" x2="64" y2="66" stroke="#f5c518" stroke-width="1" stroke-dasharray="3,3"/>

</svg>
