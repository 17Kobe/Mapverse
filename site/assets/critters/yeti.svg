  <ellipse cx="42" cy="122" rx="14" ry="4.5" fill="#f4f8fd" stroke="#a3b2c6" stroke-width="1.6"/>
  <ellipse cx="72" cy="122" rx="12" ry="4" fill="#f4f8fd" stroke="#a3b2c6" stroke-width="1.6"/>
