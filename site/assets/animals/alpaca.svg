    <rect x="55" y="57" width="5" height="19" rx="2.3"/>
  </g>

  <g stroke="#8a5f3a" stroke-width="0.5">
    <ellipse cx="46" cy="49" rx="19" ry="14" fill="url(#wool)"/>
    <circle cx="31" cy="38" r="5" fill="url(#wool)"/>
    <circle cx="39" cy="34" r="6" fill="url(#wool)"/>
    <circle cx="48" cy="32" r="6.3" fill="url(#wool)"/>
    <circle cx="57" cy="34" r="5.8" fill="url(#wool)"/>
    <circle cx="63" cy="39" r="5" fill="url(#wool)"/>
    <circle cx="64" cy="47" r="4.8" fill="url(#wool)"/>
    <circle cx="59" cy="59" r="4.3" fill="url(#wool)"/>
    <circle cx="34" cy="61" r="4" fill="url(#wool)"/>
  </g>

