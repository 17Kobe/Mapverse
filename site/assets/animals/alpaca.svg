    <polygon points="21,17 27,4 25,19" fill="url(#ear)" stroke="#8a5f3a" stroke-width="0.4" opacity="0.8"/>

    <ellipse cx="16" cy="24" rx="11" ry="10.5" fill="url(#face)" stroke="#8a5f3a" stroke-width="0.5"/>

    <ellipse cx="7" cy="28" rx="6.3" ry="5.2" fill="url(#muzzle)" stroke="#a9794c" stroke-width="0.4"/>
