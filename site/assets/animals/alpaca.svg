<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="wool" cx="38%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#f6e8d6"/>
      <stop offset="55%" stop-color="#e0c19a"/>
      <stop offset="100%" stop-color="#b8895c"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfa877"/>
      <stop offset="100%" stop-color="#8a5f3a"/>
    </linearGradient>
    <radialGradient id="ear" cx="50%" cy="15%" r="90%">
