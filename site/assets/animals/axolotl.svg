<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="axBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9e8"/>
      <stop offset="100%" stop-color="#f3a8c4"/>
    </linearGradient>
    <linearGradient id="axBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f6"/>
      <stop offset="100%" stop-color="#ffe2ee"/>
    </linearGradient>
    <linearGradient id="axGill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9ab8"/>
      <stop offset="100%" stop-color="#e05a86"/>
    </linearGradient>
  </defs>

  <ellipse cx="40" cy="77" rx="22" ry="2.6" fill="#3a2430" opacity="0.2"/>

  <!-- 尾巴，輕輕擺動 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 58 58;6 58 58;-6 58 58" dur="2.6s" repeatCount="indefinite"/>
    <path d="M56,58 C68,56 76,60 74,68 C70,64 62,64 55,64 Z" fill="url(#axBody)" stroke="#c97a9c" stroke-width="0.6"/>
  </g>

  <!-- 四隻小短腿 -->
  <g fill="url(#axBody)" stroke="#c97a9c" stroke-width="0.6">
    <path d="M30,62 C27,66 26,70 28,73 C31,72 33,68 32,63 Z"/>
    <path d="M48,63 C46,67 46,71 49,74 C52,72 53,68 51,64 Z"/>
    <path d="M22,56 C18,59 16,63 18,66 C21,65 24,61 23,57 Z"/>
    <path d="M55,57 C58,60 60,64 58,67 C55,66 52,62 53,58 Z"/>
  </g>

  <!-- 身體 -->
  <path d="M18,52 C16,42 24,34 38,33 C52,32 62,38 62,50 C62,60 52,66 38,66 C24,66 19,60 18,52 Z"
        fill="url(#axBody)" stroke="#c97a9c" stroke-width="0.7"/>
  <!-- 淺色肚子 -->
  <ellipse cx="38" cy="58" rx="16" ry="7" fill="url(#axBelly)" opacity="0.85"/>

  <!-- 背部小斑點 -->
  <g fill="#e07aa0" opacity="0.6">
    <circle cx="32" cy="40" r="1.6"/>
    <circle cx="42" cy="38" r="1.4"/>
    <circle cx="50" cy="44" r="1.5"/>
    <circle cx="37" cy="48" r="1.3"/>
  </g>

  <!-- 頭頂與頭側的羽狀外鰭（招牌特徵） -->
  <g stroke="#c54a78" stroke-width="0.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 14 30;5 14 30;-4 14 30" dur="2.2s" repeatCount="indefinite"/>
      <path d="M14,30 C8,26 4,27 2,24 C5,29 6,33 10,34 Z" fill="url(#axGill)"/>
      <path d="M15,33 C8,31 4,33 1,31 C5,35 7,39 11,38 Z" fill="url(#axGill)"/>
      <path d="M16,37 C9,37 6,40 3,39 C7,42 10,45 14,43 Z" fill="url(#axGill)"/>
    </g>
  </g>

  <!-- 扁寬的頭與微笑 -->
  <ellipse cx="18" cy="38" rx="15" ry="12" fill="url(#axBody)" stroke="#c97a9c" stroke-width="0.7"/>
  <path d="M6,40 Q10,45 16,44" stroke="#b0345c" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <!-- 圓滾滾的小眼睛 -->
  <circle cx="13" cy="33" r="2.2" fill="#2a1a20"/>
  <circle cx="13.7" cy="32.2" r="0.6" fill="#fdeef3"/>
  <circle cx="24" cy="33" r="2.2" fill="#2a1a20"/>
  <circle cx="24.7" cy="32.2" r="0.6" fill="#fdeef3"/>
</svg>
