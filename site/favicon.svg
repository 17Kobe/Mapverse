<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#5bc8f5"/>
      <stop offset="60%" stop-color="#1a90d0"/>
      <stop offset="100%" stop-color="#0a5a96"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地球底色（亮藍） -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- 陸地（鮮綠，對比強） -->
  <!-- 歐亞大陸 -->
  <ellipse cx="19" cy="11" rx="7.5" ry="4.5" fill="#4ecb6a" transform="rotate(-12 19 11)"/>
  <!-- 非洲 -->
  <ellipse cx="16" cy="19" rx="3.2" ry="4.8" fill="#4ecb6a"/>
  <!-- 美洲 -->
  <ellipse cx="7"  cy="15" rx="3"   ry="5.5" fill="#4ecb6a" transform="rotate(-8 7 15)"/>
  <!-- 澳洲 -->
  <ellipse cx="23" cy="21" rx="3.8" ry="2.8" fill="#4ecb6a" transform="rotate(8 23 21)"/>

  <!-- 光澤 -->
  <circle cx="16" cy="16" r="15" fill="url(#shine)"/>

  <!-- 外框 -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#0a4a80" stroke-width="1"/>
</svg>
