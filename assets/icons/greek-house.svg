<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Santorini Greek Houses - whitewashed buildings on hillside, blue dome church -->

  <!-- Sky hint (very subtle, narrow top strip) -->
  <rect x="0" y="0" width="80" height="18" fill="#c8e4f8" opacity="0.4"/>

  <!-- Sea strip (right side) -->
  <rect x="54" y="30" width="26" height="42" fill="#4a9fd4" opacity="0.35" rx="1"/>
  <!-- Sea shimmer lines -->
  <line x1="58" y1="38" x2="74" y2="38" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="44" x2="76" y2="44" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <line x1="56" y1="50" x2="72" y2="50" stroke="white" stroke-width="0.8" opacity="0.4"/>

  <!-- Hillside / slope -->
  <path d="M0,72 L0,55 L8,48 L20,42 L32,38 L44,35 L56,33 L68,32 L80,32 L80,72 Z"
        fill="#b8a070" stroke="none"/>
  <!-- Hillside texture -->
  <path d="M5,60 Q15,56 25,58 Q35,54 45,52 Q55,50 65,48"
        fill="none" stroke="#9a8050" stroke-width="0.8" opacity="0.6"/>

  <!-- ===== BUILDINGS (bottom to top) ===== -->

  <!-- Building 4 - bottom left, large -->
  <rect x="4" y="52" width="22" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="1"/>
  <!-- Windows -->
  <rect x="8" y="57" width="5" height="6" fill="#2a3a5a" rx="0.5"/>
  <rect x="17" y="57" width="5" height="6" fill="#2a3a5a" rx="0.5"/>
  <!-- Door -->
  <rect x="11" y="64" width="5" height="8" fill="#2a3a5a" rx="0.5"/>
  <!-- Flower dots -->
  <circle cx="7" cy="62" r="1.2" fill="#e85070"/>
  <circle cx="24" cy="60" r="1.2" fill="#f07030"/>

  <!-- Building 3 - middle left -->
  <rect x="8" y="40" width="18" height="16" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="1"/>
  <!-- Windows -->
  <rect x="11" y="44" width="4" height="5" fill="#2a3a5a" rx="0.5"/>
  <rect x="19" y="44" width="4" height="5" fill="#2a3a5a" rx="0.5"/>
  <!-- Flat roof detail -->
  <rect x="7" y="39" width="20" height="2" fill="#eeeeee" stroke="#cccccc" stroke-width="1"/>
  <!-- Flower -->
  <circle cx="10" cy="48" r="1.2" fill="#e85070"/>
  <circle cx="24" cy="46" r="1.2" fill="#f07030"/>
  <circle cx="17" cy="53" r="1" fill="#e85070" opacity="0.8"/>

  <!-- Building 2 - upper center -->
  <rect x="22" y="32" width="16" height="14" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="1"/>
  <!-- Window -->
  <rect x="25" y="36" width="4" height="5" fill="#2a3a5a" rx="0.5"/>
  <rect x="31" y="36" width="4" height="5" fill="#2a3a5a" rx="0.5"/>
  <!-- Roof edge -->
  <rect x="21" y="31" width="18" height="2" fill="#eeeeee" stroke="#cccccc" stroke-width="1"/>
  <!-- Flowers -->
  <circle cx="24" cy="40" r="1.2" fill="#f07030"/>
  <circle cx="36" cy="38" r="1" fill="#e85070"/>

  <!-- Connecting wall / step between buildings -->
  <rect x="14" y="34" width="10" height="8" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="0.5"/>
  <rect x="15" y="37" width="3" height="4" fill="#2a3a5a" rx="0.5"/>

  <!-- ===== BLUE DOME CHURCH (topmost, most prominent) ===== -->

  <!-- Church bell tower (thin vertical) -->
  <rect x="38" y="18" width="6" height="16" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="0.5"/>
  <!-- Bell arch -->
  <path d="M38,22 Q41,18 44,22" fill="none" stroke="#cccccc" stroke-width="1.2"/>
  <!-- Bell -->
  <circle cx="41" cy="24" r="1.5" fill="#c8a830" stroke="#a08020" stroke-width="0.8"/>

  <!-- Church body -->
  <rect x="31" y="24" width="24" height="16" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="1"/>

  <!-- Blue dome (most prominent element) -->
  <!-- Drum base -->
  <rect x="33" y="20" width="18" height="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="0.5"/>
  <!-- The dome itself -->
  <path d="M31,24 Q42,8 53,24 Z" fill="#1a6ac8" stroke="#0a4a9a" stroke-width="1.5"/>
  <!-- Dome highlight -->
  <path d="M33,22 Q40,12 47,20" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>

  <!-- Cross on dome -->
  <line x1="42" y1="8" x2="42" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="12" x2="45" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Church windows -->
  <rect x="33" y="28" width="4" height="6" fill="#2a3a5a" rx="1"/>
  <path d="M33,28 Q35,25 37,28" fill="#2a3a5a"/>
  <rect x="47" y="28" width="4" height="6" fill="#2a3a5a" rx="1"/>
  <path d="M47,28 Q49,25 51,28" fill="#2a3a5a"/>
  <!-- Church door (arched) -->
  <rect x="39" y="30" width="6" height="10" fill="#2a3a5a" rx="1"/>
  <path d="M39,30 Q42,26 45,30" fill="#2a3a5a"/>

  <!-- Flowers on church wall -->
  <circle cx="32" cy="34" r="1.2" fill="#e85070"/>
  <circle cx="52" cy="32" r="1.2" fill="#f07030"/>
  <circle cx="45" cy="38" r="1" fill="#e85070"/>

  <!-- Terrace/walkway between church and building 2 -->
  <rect x="26" y="36" width="8" height="4" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>

  <!-- Bottom ground / path -->
  <rect x="0" y="70" width="80" height="10" fill="#c8b880" stroke="white" stroke-width="1" opacity="0.7"/>
  <!-- Path stones -->
  <ellipse cx="12" cy="73" rx="5" ry="2" fill="#d8c890" opacity="0.6"/>
  <ellipse cx="30" cy="74" rx="6" ry="1.5" fill="#d8c890" opacity="0.6"/>
  <ellipse cx="50" cy="73" rx="5" ry="2" fill="#d8c890" opacity="0.6"/>
</svg>
