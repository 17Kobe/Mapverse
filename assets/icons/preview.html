<style>
  /* === Design tokens === */
  /* Layout: centered grid, dark parchment game-map feel */
  :root {
    --bg: #1c1a14;
    --surface: #2a2618;
    --border: #4a4230;
    --fg: #e8dfc0;
    --muted: #8a7e60;
    --accent: #c8a040;
    --shadow: rgba(0,0,0,0.5);

    --font-display: 'Cinzel', Georgia, serif;
    --font-body: 'IM Fell English', 'Palatino Linotype', serif;

    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4edd8;
      --surface: #fffef5;
      --border: #c8b880;
      --fg: #2a2010;
      --muted: #7a6840;
      --accent: #9a6820;
      --shadow: rgba(100,80,20,0.15);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4edd8;
    --surface: #fffef5;
    --border: #c8b880;
    --fg: #2a2010;
    --muted: #7a6840;
    --accent: #9a6820;
    --shadow: rgba(100,80,20,0.15);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-block: 2rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 400;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-wrap: balance;
    margin-bottom: 0.4rem;
  }

  header p {
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 0.8rem auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    max-width: 720px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 16px var(--shadow);
  }

  .icon-frame {
    width: 120px;
    height: 120px;
    background: #3a4a3a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  .icon-frame svg {
    width: 96px;
    height: 96px;
  }

  .card-label {
    font-family: var(--font-display);
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
    text-align: center;
  }

  .card-desc {
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }

  .bg-swatches {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .swatch-btn {
    font-family: var(--font-body);
    font-size: 0.72rem;
    padding: 0.2rem 0.6rem;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .swatch-btn:hover, .swatch-btn.active {
    background: var(--border);
    color: var(--fg);
  }

  .size-row {
    display: flex;
    gap: 0.8rem;
    align-items: flex-end;
    margin-top: 0.25rem;
  }
  .size-row svg {
    display: block;
  }
</style>

  <p style="font-size:0.78rem; color:var(--muted); letter-spacing:0.06em;">
    背景色切換 &nbsp;·&nbsp; 測試圖示在不同地圖色塊上的可讀性
  </p>
  <div class="bg-swatches" style="margin-top:0.6rem;">
    <button class="swatch-btn active" onclick="setBg('bear','#3a4a3a')">草地</button>
    <button class="swatch-btn" onclick="setBg('bear','#4a6080')">水域</button>
    <button class="swatch-btn" onclick="setBg('bear','#6a5a40')">沙地</button>
    <button class="swatch-btn" onclick="setBg('bear','#505868')">雪地</button>
    <button class="swatch-btn" onclick="setAllBg('bear','petra','greek','#3a4a3a','#5a3a20','#3a4a5a')">全部重設</button>
  </div>
</div>

<script>
  function setBg(id, color) {
    const el = document.getElementById('frame-' + id);
    if (el) el.style.background = color;
  }
  function setAllBg(id1, id2, id3, c1, c2, c3) {
    setBg(id1, c1); setBg(id2, c2); setBg(id3, c3);
  }
  // swatch buttons: apply same bg to all frames
  document.querySelectorAll('.swatch-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });
  // Override first 4 swatches to change all frames
  const swatches = document.querySelectorAll('.swatch-btn');
  const bgMap = [
    ['#3a4a3a','#5a3a20','#3a4a5a'],
    ['#2a4060','#4a5060','#2a4060'],
    ['#6a5a40','#7a5a30','#6a5540'],
    ['#505868','#484850','#404858'],
  ];
  bgMap.forEach((colors, i) => {
    if (swatches[i]) {
      swatches[i].addEventListener('click', () => {
        setBg('bear', colors[0]);
        setBg('petra', colors[1]);
        setBg('greek', colors[2]);
      });
    }
  });
</script>
