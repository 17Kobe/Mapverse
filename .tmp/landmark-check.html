<title>地標圖示預覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #dce8cc;
  --fg: #1e2810;
  --card: #f0ece0;
  --border: #b0c890;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e2818; --fg: #d8e8c0; --card: #282e1c; --border: #3a5028;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg:#1e2818;--fg:#d8e8c0;--card:#282e1c;--border:#3a5028; color-scheme:dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: system-ui, sans-serif; font-size: 14px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.sub { font-size: 12px; opacity: 0.6; margin-bottom: 20px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; flex: 1; min-width: 160px;
}
.card-title { padding: 8px 12px 6px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--border); }
.slots { display: flex; gap: 0; }
.slot {
  flex: 1; padding: 10px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.slot span { font-size: 10px; color: white; font-weight: 500; opacity: 0.9; }
.slot svg { width: 80px; height: 80px; display: block; }
.g { background: linear-gradient(150deg, #6b9a52, #4a7a38); }
.b { background: linear-gradient(150deg, #7a6248, #5a4838); }
.w { background: linear-gradient(150deg, #4a82b8, #2a5890); }
</style>
