<title>地標圖示預覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #3a7a30;
    --bg2: #4a8a40;
    --bg3: #2a6a20;
    --label: #fff;
    --card-bg: rgba(0,0,0,0.35);
    --gap: 24px;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .7;
    margin: 20px 0 12px;
    text-align: center;
  }

  /* 模擬地圖地景：有起伏的綠色地形 */
  .map-bg {
    border-radius: 12px;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse at 20% 70%, #2e6828 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, #348030 0%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, #4a9040 0%, transparent 60%),
      #3a7a30;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--gap);
    margin-bottom: 20px;
  }

  /* 暗色地形背景 */
  .map-bg-dark {
    background:
      radial-gradient(ellipse at 20% 70%, #1a4018 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, #204a20 0%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, #2a5828 0%, transparent 60%),
      #1e4a1c;
  }

  /* 각 圖示格子 */
  .icon-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .icon-cell svg {
    width: 80px;
    height: 80px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  .icon-label {
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    text-align: center;
  }

  /* 不同尺寸預覽 */
  .size-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px;
    border-radius: 10px;
    background:
      radial-gradient(ellipse at 30% 60%, #2e6828 0%, transparent 50%),
      #3a7a30;
    margin-bottom: 12px;
  }

  .size-row.on-sand {
    background:
      radial-gradient(ellipse at 30% 60%, #c8a060 0%, transparent 50%),
      #b89050;
  }

  .size-row.on-mountain {
    background:
      radial-gradient(ellipse at 30% 60%, #506888 0%, transparent 50%),
      #607888;
  }

  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .size-item svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }

  .size-tag {
    font-size: .65rem;
    opacity: .75;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }

  h2 {
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    opacity: .65;
    margin: 20px 0 8px;
    text-align: center;
  }
</style>
